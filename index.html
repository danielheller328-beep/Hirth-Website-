<style>
  /* ---- ELITE DARK THEME — zero plain white anywhere on this site ---- */
  :root {
    --depth-3d: 1;
    --surface-page:
      radial-gradient(1200px 600px at 85% -150px, color-mix(in srgb, var(--blue-500) 13%, transparent), transparent 60%),
      radial-gradient(1000px 560px at -12% 40%, color-mix(in srgb, var(--blue-500) 8%, transparent), transparent 55%),
      linear-gradient(168deg, #101e28 0%, #0a141a 55%, #081016 100%);
    --surface-inverse:
      radial-gradient(900px 460px at 18% -10%, color-mix(in srgb, var(--blue-500) 22%, transparent), transparent 55%),
      radial-gradient(1100px 600px at 105% 110%, rgba(3,7,10,0.9), transparent 60%),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 88px),
      linear-gradient(160deg, #162935 0%, #0a141a 100%);
    --surface-card: linear-gradient(180deg, rgba(46,74,90,0.5) 0%, rgba(22,38,48,0.62) 100%);
    --surface-subtle: rgba(255,255,255,0.04);
    --surface-accent-tint: rgba(27,156,216,0.1);
    --paper: #0a141a;
    --white: #101e28;
    --text-primary: #eef4f7;
    --text-secondary: #b9c8d1;
    --text-muted: #8499a4;
    --border-subtle: rgba(255,255,255,0.1);
    --border-strong: rgba(255,255,255,0.22);
    --grey-50: rgba(255,255,255,0.045);
    --grey-100: rgba(255,255,255,0.08);
    --grey-200: rgba(255,255,255,0.14);
    --blue-50: rgba(27,156,216,0.12);
    --blue-100: rgba(27,156,216,0.3);
    --shadow-card: 0 1px 2px rgba(0,0,0,0.45), 0 12px 32px rgba(0,0,0,0.4);
    --shadow-card-hover: 0 4px 10px rgba(0,0,0,0.5), 0 28px 64px rgba(0,0,0,0.55);
    --shadow-overlay: 0 18px 70px rgba(0,0,0,0.65);
    --action-primary: #2c4858;
    --action-primary-hover: #3a5a6d;
    --status-leased: #8499a4;
    /* warm brass — the premium pop against all the blue */
    --gold: #cda35f;
    --gold-200: #e6c992;
    --gold-soft: rgba(205,163,95,0.16);
  }
  html { scrollbar-color: #28414f #0a141a; }
  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-track { background: #0a141a; }
  ::-webkit-scrollbar-thumb { background: #28414f; border-radius: 5px; border: 2px solid #0a141a; }
  ::-webkit-scrollbar-thumb:hover { background: #3a5565; }
  ::selection { background: rgba(27,156,216,0.35); color: #fff; }
  footer {
    background:
      radial-gradient(900px 500px at 15% 0%, color-mix(in srgb, var(--blue-500) 14%, transparent), transparent 55%),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 88px),
      linear-gradient(165deg, #13222b 0%, #070d11 100%) !important;
  }

  .container { max-width: var(--container-max); margin: 0 auto; padding-left: var(--container-pad); padding-right: var(--container-pad); }
  .svc { display: block; text-decoration: none; background: var(--surface-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); overflow: hidden; box-shadow: var(--shadow-card); transition: box-shadow var(--duration-base) var(--ease-out), transform var(--duration-base) var(--ease-out); }
  .svc:hover { box-shadow: 0 6px 12px rgba(15,30,39,0.12), 0 28px 64px rgba(15,30,39,0.22); }
  .svc img { transition: transform var(--duration-slow) var(--ease-out); }
  .svc:hover img { transform: scale(1.04); }

  /* ---- 3D: cursor tilt, hero parallax, stat-band perspective ---- */
  .tilt3d, .svc { transition: transform 0.3s var(--ease-out), box-shadow 0.3s var(--ease-out); will-change: transform; }
  .tilt3d:hover { box-shadow: 0 6px 12px rgba(15,30,39,0.12), 0 28px 64px rgba(15,30,39,0.22); border-radius: var(--radius-sm); }
  .hero-par { transform: scale(1.12); will-change: transform; }
  .hero-h1 { background: linear-gradient(180deg, #ffffff 18%, #c7d8e2 88%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; text-shadow: none; filter: drop-shadow(0 16px 36px rgba(0,0,0,0.6)); }
  .statband3d { perspective: 900px; }
  .statband3d > div { transform: rotateX(calc(var(--depth-3d) * 7deg)); }
  .statband3d div { text-shadow: 0 1px 0 rgba(0,0,0,0.3), 0 16px 32px rgba(0,0,0,0.45); }

  /* ---- Bio drop cap ---- */
  .bio-lede::first-letter { font-size: 3.4em; line-height: 0.8; float: left; margin: 6px 14px 0 0; color: var(--gold-600, #a67c1f); font-family: var(--font-display); }

  /* ---- Leaflet locator pins + popups ---- */
  .hg-map { background: #0a141a; }
  .hg-pin-dot { display: block; width: 16px; height: 16px; border-radius: 50%; background: var(--gold-500); border: 2px solid #fff; box-shadow: 0 0 0 4px color-mix(in srgb, var(--gold-500) 32%, transparent), 0 2px 8px rgba(0,0,0,0.55); transition: transform 0.2s var(--ease-out); }
  .hg-pin:hover .hg-pin-dot { transform: scale(1.28); }
  .leaflet-popup-content-wrapper { background: var(--navy-900); color: #fff; border-radius: var(--radius-sm); border: 1px solid var(--border-subtle); box-shadow: var(--shadow-overlay); }
  .leaflet-popup-tip { background: var(--navy-900); border: 1px solid var(--border-subtle); }
  .leaflet-popup-content { margin: 14px 16px; font-family: var(--font-sans); }
  .leaflet-popup-content strong { font-family: var(--font-display); font-weight: 400; font-size: 16px; color: #fff; }
  .hg-pop-meta { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-inverse-secondary); }
  .hg-pop-link { display: inline-block; margin-top: 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--gold-300); }
  .leaflet-bar a, .leaflet-bar a:hover { background: var(--navy-900); color: #fff; border-bottom-color: var(--border-inverse); }
  .leaflet-control-attribution { background: rgba(10,20,26,0.75) !important; color: var(--text-muted) !important; }
  .leaflet-control-attribution a { color: var(--text-inverse-secondary) !important; }


  /* ---- Premium service cards ---- */  .svc-card { display: block; text-decoration: none; background: var(--surface-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); overflow: hidden; box-shadow: var(--shadow-card); position: relative; transition: transform 0.4s var(--ease-out), box-shadow 0.4s var(--ease-out); will-change: transform; }
  .svc-card::after { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--svc-accent); transform: scaleX(0); transform-origin: left; transition: transform 0.5s var(--ease-out); z-index: 4; }
  .svc-card:hover { transform: translateY(-8px); box-shadow: 0 8px 16px rgba(15,30,39,0.12), 0 36px 72px rgba(15,30,39,0.26); }
  .svc-card:hover::after { transform: scaleX(1); }
  .svc-media img { transition: transform 0.8s var(--ease-out); }
  .svc-card:hover .svc-media img { transform: scale(1.06); }
  .svc-num { position: absolute; right: 18px; top: 10px; font-family: var(--font-display); font-size: 72px; line-height: 1; color: #fff; opacity: 0.16; }
  .svc-badge { position: absolute; left: 26px; top: 22px; width: 46px; height: 46px; border-radius: var(--radius-xs); display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 22px rgba(0,0,0,0.35); transition: transform 0.4s var(--ease-out); }
  .svc-card:hover .svc-badge { transform: translateY(-3px) rotate(-4deg); }
  .svc-cta .svc-arrow { display: inline-block; transition: transform 0.3s var(--ease-out); }
  .svc-card:hover .svc-cta .svc-arrow { transform: translateX(6px); }


  .mk { position: absolute; transform: translate(-50%, -50%); }
  .mk-dot { display: block; width: 9px; height: 9px; border-radius: 50%; background: var(--blue-400); box-shadow: 0 0 14px 3px color-mix(in srgb, var(--blue-500) 75%, transparent); }
  .mk-ring { position: absolute; left: 50%; top: 50%; width: 36px; height: 36px; margin: -18px 0 0 -18px; border-radius: 50%; border: 1px solid var(--blue-400); opacity: 0; }
  .mk-lbl { position: absolute; left: 15px; top: -5px; font: 500 10px var(--font-sans); letter-spacing: 0.18em; text-transform: uppercase; color: rgba(255,255,255,0.88); white-space: nowrap; text-shadow: 0 1px 5px rgba(0,0,0,0.85); }
  @media (prefers-reduced-motion: no-preference) {
    .mk-ring { animation: mkpulse 3.2s var(--ease-out) infinite; }
  }
  @keyframes mkpulse {
    0% { transform: scale(0.35); opacity: 0.85; }
    70% { transform: scale(1.1); opacity: 0; }
    100% { transform: scale(1.1); opacity: 0; }
  }

  /* ---- Scroll reveal: 3D rise-in for cards/maps. Hidden state only applies
     when html.anim-ok is set — and that class is added from inside a
     requestAnimationFrame callback, so any context where frames don't run
     (hidden iframes, DOM captures, print/export) shows everything instead. ---- */
  @media (prefers-reduced-motion: no-preference) {
    html.anim-ok .reveal3d:not([data-in]) { opacity: 0; transform: perspective(1100px) rotateX(calc(var(--depth-3d, 1) * 12deg)) translateY(64px) scale(0.97); }
    html.anim-ok .reveal3d[data-in] { opacity: 1; transform: perspective(1100px) rotateX(0deg) translateY(0) scale(1); transition: transform 0.9s var(--ease-out), opacity 0.9s var(--ease-out); }
    html.anim-ok .reveal3d[data-done] { transition: transform 0.3s var(--ease-out), box-shadow 0.3s var(--ease-out); }

    /* soft text/blocks reveal — rise + focus pull */
    html.anim-ok .reveal-up:not([data-in]) { opacity: 0; transform: translateY(38px); filter: blur(9px); }
    html.anim-ok .reveal-up[data-in] { opacity: 1; transform: none; filter: none; transition: opacity 0.95s var(--ease-out), transform 0.95s var(--ease-out), filter 0.95s var(--ease-out); }

    /* cinematic variants for the About / profile section */
    html.anim-ok .reveal-clip:not([data-in]) { opacity: 0; clip-path: inset(0 0 100% 0); transform: scale(1.08) translateY(28px); filter: blur(6px); }
    html.anim-ok .reveal-clip[data-in] { opacity: 1; clip-path: inset(0 0 0 0); transform: none; filter: none; transition: clip-path 1.4s var(--ease-out), opacity 0.9s var(--ease-out), transform 1.4s var(--ease-out), filter 1.1s var(--ease-out); }
    /* gold light-sweep that crosses the portrait as it unveils */
    .cinema-sweep { position: absolute; inset: 0; z-index: 4; pointer-events: none; overflow: hidden; }
    .cinema-sweep::before { content: ''; position: absolute; top: -40%; left: -60%; width: 45%; height: 180%; transform: rotate(18deg) translateX(-40px); background: linear-gradient(90deg, transparent, rgba(239,217,171,0.55), transparent); opacity: 0; }
    html.anim-ok .reveal-clip[data-in] .cinema-sweep::before { animation: cinemaSweep 1.5s var(--ease-out) 0.5s both; }
    @keyframes cinemaSweep { 0% { opacity: 0; left: -60%; } 30% { opacity: 1; } 100% { opacity: 0; left: 130%; } }
    html.anim-ok .reveal-left:not([data-in]) { opacity: 0; transform: translateX(-46px); filter: blur(8px); }
    html.anim-ok .reveal-left[data-in] { opacity: 1; transform: none; filter: none; transition: opacity 0.9s var(--ease-out), transform 1s var(--ease-out), filter 0.9s var(--ease-out); }
    html.anim-ok .reveal-right:not([data-in]) { opacity: 0; transform: translateX(46px); filter: blur(8px); }
    html.anim-ok .reveal-right[data-in] { opacity: 1; transform: none; filter: none; transition: opacity 0.9s var(--ease-out), transform 1s var(--ease-out), filter 0.9s var(--ease-out); }
    /* line-by-line bio rise — children stagger via --i */
    html.anim-ok .reveal-lines:not([data-in]) > * { opacity: 0; transform: translateY(26px); }
    html.anim-ok .reveal-lines[data-in] > * { opacity: 1; transform: none; transition: opacity 0.8s var(--ease-out), transform 0.8s var(--ease-out); transition-delay: calc(var(--i, 0) * 110ms); }

    /* page-to-page transition — every navigation glides in */
    html.anim-ok .page-anim { animation: pageIn 0.7s var(--ease-out) both; }
  }
  @keyframes pageIn { from { opacity: 0; transform: translateY(30px); filter: blur(8px); } to { opacity: 1; transform: none; filter: none; } }
  /* ---- Map color grade: kill the brown — every map reads in brand blue ---- */
  .map-tint { filter: grayscale(1) sepia(0.9) hue-rotate(165deg) saturate(2.1) brightness(0.85) contrast(1.06); }

  /* ---- Section textures: faint blue map + watermark mark ---- */
  .texture-map { position: relative; }
  .texture-map::before { content: ''; position: absolute; inset: 0; background: url('../assets/maps/la-hero-dark.png') center / cover; opacity: 0.12; filter: grayscale(1) sepia(0.9) hue-rotate(165deg) saturate(2) brightness(0.75); pointer-events: none; }
  .texture-map > * { position: relative; z-index: 1; }
  .watermark-logo { position: relative; overflow: hidden; }
  .watermark-logo { position: relative; overflow: hidden; }
  .watermark-logo::after {
    content: ''; position: absolute; right: 56px; top: 50%; transform: translateY(-50%);
    width: 480px; height: 480px; max-width: 42%; pointer-events: none;
    /* the white logo PNG is used as an alpha mask, then filled with a gold gradient
       so the Hirth mark reads as a warm gold watermark on every band it sits on */
    -webkit-mask: url('../assets/logo-hirth-white.png') center / contain no-repeat;
    mask: url('../assets/logo-hirth-white.png') center / contain no-repeat;
    background: linear-gradient(135deg, var(--gold-500) 0%, var(--gold-200) 55%, var(--gold-500) 100%);
    opacity: 0.16;
  }
  .watermark-logo.on-light::after { opacity: 0.12; }

  /* ---- Ghost type — giant engraved serif words behind sections ---- */
  .ghost-word { position: absolute; right: 8px; top: 14px; z-index: 0; font-family: var(--font-display); font-size: clamp(110px, 13vw, 190px); line-height: 1; letter-spacing: 0.05em; color: rgba(255,255,255,0.018); -webkit-text-stroke: 1px rgba(165,205,230,0.085); pointer-events: none; user-select: none; white-space: nowrap; }
  .ghost-word.gold { -webkit-text-stroke: 1px rgba(205,163,95,0.16); }

  /* gold pops */
  .stat-plus { color: var(--gold) !important; }
  .svc-num { color: var(--gold) !important; opacity: 0.92 !important; }
  .gold-rule { background: linear-gradient(90deg, var(--gold), var(--gold-200)) !important; }
  .gold-text { color: var(--gold) !important; }

  /* ---- Ambient drifting light — the page is never a dead background ---- */
  .orb { position: fixed; border-radius: 50%; filter: blur(90px); pointer-events: none; z-index: 0; mix-blend-mode: screen; }
  .orb1 { width: 560px; height: 560px; background: radial-gradient(circle, rgba(27,156,216,0.3), transparent 65%); top: -160px; right: -140px; }
  .orb2 { width: 480px; height: 480px; background: radial-gradient(circle, rgba(79,107,124,0.28), transparent 65%); bottom: -180px; left: -160px; }
  .orb3 { width: 440px; height: 440px; background: radial-gradient(circle, rgba(205,163,95,0.22), transparent 65%); top: 42%; left: 26%; }
  @media (prefers-reduced-motion: no-preference) {
    html.anim-ok .orb1 { animation: orbA 26s ease-in-out infinite alternate; }
    html.anim-ok .orb2 { animation: orbB 32s ease-in-out infinite alternate; }
    html.anim-ok .orb3 { animation: orbA 38s ease-in-out infinite alternate-reverse; }
  }
  @keyframes orbA { from { transform: translate3d(0, 0, 0) scale(1); } to { transform: translate3d(-120px, 90px, 0) scale(1.15); } }
  @keyframes orbB { from { transform: translate3d(0, 0, 0) scale(1); } to { transform: translate3d(140px, -110px, 0) scale(1.1); } }

  /* ---- Planet: pre-tinted real world map in a sphere illusion ---- */
  .dive-layer, .dive-planet-wrap, .dive-planet { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .dive-planet { width: 100%; height: 100%; border-radius: 50%; background-size: 100% 100%; position: relative; overflow: hidden;
    box-shadow: inset -60px -50px 160px rgba(0,0,0,0.78), inset 0 0 120px rgba(8,16,22,0.5); }
  .dive-planet::before { content: ''; position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 32% 26%, rgba(255,255,255,0.13), transparent 46%); z-index: 3; }
  .dive-la-glint { position: absolute; width: 8px; height: 8px; margin: -4px; border-radius: 50%; background: #cfeeff; box-shadow: 0 0 12px 4px rgba(76,180,226,0.9), 0 0 28px 10px rgba(27,156,216,0.5); z-index: 4; }
  @media (prefers-reduced-motion: no-preference) {
    .dive-la-glint { animation: glintPulse 2.2s ease-in-out infinite; }
  }
  @keyframes glintPulse { 0%, 100% { transform: scale(1); opacity: 0.9; } 50% { transform: scale(1.7); opacity: 1; } }
  /* warp-speed star streaks during the plunge — radial lines from LA's screen point */
  .dive-warp { position: absolute; inset: 0; z-index: 29; pointer-events: none; opacity: 0; overflow: hidden; }
  .dive-warp span { position: absolute; left: 50%; top: 50%; width: 2px; height: 22vh; transform-origin: 50% 0; background: linear-gradient(180deg, rgba(255,255,255,0.85), rgba(120,190,240,0.25) 40%, transparent); border-radius: 2px; }
  /* landing flash — a quick bloom as the city resolves */
  .dive-flash { position: absolute; inset: 0; z-index: 31; pointer-events: none; opacity: 0; background: radial-gradient(circle at 50% 48%, rgba(255,255,255,0.9), rgba(205,163,95,0.4) 30%, transparent 62%); }
  .dive-stars { position: absolute; inset: -10%; pointer-events: none;
    background-image:
      radial-gradient(1.6px 1.6px at 25px 35px, rgba(255,255,255,0.9), transparent 60%),
      radial-gradient(1px 1px at 150px 120px, rgba(255,255,255,0.7), transparent 60%),
      radial-gradient(1.2px 1.2px at 80px 210px, rgba(180,220,255,0.65), transparent 60%),
      radial-gradient(0.8px 0.8px at 220px 60px, rgba(255,255,255,0.5), transparent 60%),
      radial-gradient(1px 1px at 310px 170px, rgba(200,230,255,0.55), transparent 60%),
      radial-gradient(1.3px 1.3px at 360px 280px, rgba(255,255,255,0.6), transparent 60%);
    background-size: 420px 420px; will-change: transform, opacity; }
  @media (prefers-reduced-motion: no-preference) {
    .dive-stars { animation: starDrift 90s linear infinite; }
  }
  @keyframes starDrift { from { transform: translate3d(0, 0, 0); } to { transform: translate3d(-420px, -210px, 0); } }

  /* ---- Cinematic Earth → LA dive (scroll-driven; static contexts skip it) ---- */
  .dive-wrap:not(.dive-on) .dive-layer,
  .dive-wrap:not(.dive-on) .dive-planet-wrap,
  .dive-wrap:not(.dive-on) .dive-stars,
  .dive-wrap:not(.dive-on) .dive-label,
  .dive-wrap:not(.dive-on) .dive-hint { display: none !important; }
  .dive-intro { display: none; }
  .dive-on .dive-intro { display: flex; }
  .dive-wrap:not(.dive-on) .dive-sticky { position: relative; min-height: 620px; display: flex; align-items: center; }
  /* static hero must always be visible (no JS reveal needed when dive is off) */
  .dive-wrap:not(.dive-on) .dive-final { opacity: 1 !important; }
  .dive-wrap:not(.dive-on) .dive-final .fx { opacity: 1 !important; transform: none !important; filter: none !important; }
  .dive-wrap.dive-on { height: 100vh; }
  .dive-wrap.dive-on.dive-done { height: 100vh; }
  .dive-on .dive-sticky { position: sticky; top: 0; height: 100vh; }
  /* staged entrance of the final hero content — logo, eyebrow, headline, lede, CTAs */
  .dive-on .dive-final .fx { opacity: 0; transform: translateY(34px); filter: blur(10px); transition: opacity 0.9s var(--ease-out), transform 0.9s var(--ease-out), filter 0.9s var(--ease-out); }
  .dive-on .dive-final.show .fx { opacity: 1; transform: none; filter: none; }
  @media (prefers-reduced-motion: no-preference) {
    .dive-hint > div { animation: divehint 2.2s var(--ease-out) infinite; transform-origin: top center; }
  }

function ListingModal({ listing, onClose, go }) {

        </div>

            <div style={{ position: 'relative', borderRadius: 'var(--radius-sm)', overflow: 'hidden', border: '1px solid var(--border-inverse)', aspectRatio: '8.5 / 11', maxWidth: '620px', margin: '0 auto', background: 'var(--navy-900)' }}>

        {/* Location — real Google Maps pin for this address */}
        <div style={{ borderTop: '1px solid var(--border-inverse)', padding: '40px 44px 48px' }}>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: '16px', marginBottom: '20px', flexWrap: 'wrap' }}>
            <div>
              <p style={{ font: 'var(--weight-medium) 11px var(--font-sans)', letterSpacing: 'var(--tracking-eyebrow)', textTransform: 'uppercase', color: 'var(--gold-500)', margin: 0 }}>Location</p>
              <h3 style={{ fontFamily: 'var(--font-display)', fontSize: '22px', color: '#fff', margin: '6px 0 0' }}>{listing.title} &middot; {region}</h3>
            </div>

              style={{ display: 'inline-flex', alignItems: 'center', gap: '8px', font: 'var(--weight-semibold) 11px var(--font-sans)', letterSpacing: 'var(--tracking-caps)', textTransform: 'uppercase', color: 'var(--blue-400)', textDecoration: 'none', border: '1px solid var(--border-inverse)', borderRadius: 'var(--radius-xs)', padding: '10px 16px' }}>
              <i data-lucide="map-pin" style={{ width: '15px', height: '15px' }}></i> Open in Google Maps
            </a>
          </div>
          <div style={{ position: 'relative', borderRadius: 'var(--radius-sm)', overflow: 'hidden', border: '1px solid var(--border-inverse)', aspectRatio: '16 / 6', background: 'var(--navy-900)' }}>

              src={'https://maps.google.com/maps?q=' + encodeURIComponent(addr) + '&z=15&t=m&hl=en&output=embed'}

        {/* THE SALE — deal highlights (closed listings) */}

            <div className="r-grid-2" style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '18px 40px' }}>

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  React.useEffect(() => { applyTweaks(t); }, [t]);
  const [selected, setSelected] = React.useState(null);
  listingHolder.open = setSelected;
  const [flyer, setFlyer] = React.useState(null);
  flyerHolder.open = setFlyer;
  const [page, setPage] = React.useState(() => localStorage.getItem('hirth-kit-page') || 'home');
  const go = (p) => {
    setPage(p);
    localStorage.setItem('hirth-kit-page', p);
    window.scrollTo({ top: 0 });
  };
  React.useEffect(() => {
    const id = setTimeout(() => { if (window.lucide) window.lucide.createIcons(); }, 60);
    return () => clearTimeout(id);
  }, [page]);
  // Social links: inside an iframe embed (the site is framed on Wix) a plain
  // target="_blank" is frequently blocked, and the lucide <i> can measure 0px
  // before icons hydrate — so the anchors look dead. Give them a real hit area
  // and open them explicitly, falling back to the top window if popups are blocked.
  React.useEffect(() => {
    const onClick = (e) => {
      const a = e.target.closest && e.target.closest('a[href^="https://www.facebook.com"], a[href^="https://www.linkedin.com"], a[href^="https://www.instagram.com"]');
      if (!a) return;
      e.preventDefault();
      const href = a.getAttribute('href');
      const w = window.open(href, '_blank', 'noopener');
      if (!w) { try { window.top.location.href = href; } catch (err) { window.location.href = href; } }
    };
    document.addEventListener('click', onClick);
    return () => document.removeEventListener('click', onClick);
  }, []);
  let view = null;
  if (page === 'home') view = <window.HomePage go={go} countUp={t.countUp} />;
  else if (page.startsWith('properties-')) view = <window.PropertiesPage status={page.replace('properties-', '')} go={go} />;
  else if (page === 'daniel-hirth') view = <window.ProfilePage go={go} />;
  else if (page === 'about-team') view = <window.TeamPage go={go} />;
  else if (page === 'about-services') view = <window.ServicesPage go={go} />;
  else if (page === 'about-testimonials') view = <window.TestimonialsPage />;
  else view = <window.ContactPage />;

  return (
    <div>
      <div className="world-bg" aria-hidden="true">
        <div className="world-zoom">
          <div className="world-pan">
            <div className="world-map" data-cursor-par="-24"></div>
          </div>
        </div>
      </div>
      <div className="world-aurora" aria-hidden="true"></div>
      <div className="world-veil" aria-hidden="true"></div>
      <div aria-hidden="true">
        <div className="par-wrap" data-cursor-par="-52"><div className="orb orb1"></div></div>
        <div className="par-wrap" data-cursor-par="34"><div className="orb orb2"></div></div>
        <div className="par-wrap" data-cursor-par="-20"><div className="orb orb3"></div></div>
      </div>
      <NavBar
        active={page === 'daniel-hirth' ? 'about-team' : page}
        transparent={page === 'home'}
        logoSrc="../assets/logo-hirth-white.png"
        onNavigate={go}
      />
      <div className="page-anim" key={page} style={{ position: 'relative', zIndex: 1 }}>
        {view}
        <SiteFooter logoSrc="../assets/logo-hirth-white.png" onNavigate={go} />
      </div>
      <TweaksPanel>
        <TweakSection label="Design" />
        <TweakRadio label="Headlines" value={t.look} options={['premium', 'classic']}
                    onChange={(v) => setTweak('look', v)} />
        <TweakColor label="Accent" value={t.accent} options={['#1b9cd8', '#0e6e9e', '#8a97a0']}
                    onChange={(v) => setTweak('accent', v)} />
        <TweakSlider label="3D depth" value={t.depth3d} min={0} max={2} step={0.1}
                     onChange={(v) => setTweak('depth3d', v)} />
        <TweakSection label="Hero" />
        <TweakSlider label="Map darkness" value={t.scrim} min={0.3} max={1} step={0.02}
                     onChange={(v) => setTweak('scrim', v)} />
        <TweakSection label="Motion" />
        <TweakToggle label="Animate stats" value={t.countUp}
                     onChange={(v) => setTweak('countUp', v)} />
      </TweaksPanel>
      <ListingModal listing={selected} onClose={() => setSelected(null)} go={go} />
      <FlyerViewer listing={flyer} onClose={() => setFlyer(null)} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
