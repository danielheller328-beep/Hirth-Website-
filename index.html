<style>
  /* ---- ELITE DARK THEME — zero plain white anywhere on this site ---- */
  :root {

  .mk { position: absolute; transform: translate(-50%, -50%); }
  .mk-dot { display: block; width: 9px; height: 9px; border-radius: 50%; background: var(--blue-400); box-shadow: 0 0 14px 3px color-mix(in srgb, var(--blue-500) 75%, transparent); }
  .mk-ring { position: absolute; left: 50%; top: 50%; width: 36px; height: 36px; margin: -18px 0 0 -18px; border-radius: 50%; border: 1px solid var(--blue-400); opacity: 0; }
  .mk-lbl { position: absolute; left: 15px; top: -5px; font: 500 10px var(--font-sans); letter-spacing: 0.18em; text-transform: uppercase; color: rgba(255,255,255,0.88); white-space: nowrap; text-shadow: 0 1px 5px rgba(0,0,0,0.85); }

  /* ---- Scroll reveal: 3D rise-in for cards/maps. Hidden state only applies
     when html.anim-ok is set — and that class is added from inside a
     requestAnimationFrame callback, so any context where frames don't run
     (hidden iframes, DOM captures, print/export) shows everything instead. ---- */
  @media (prefers-reduced-motion: no-preference) {
    html.anim-ok .reveal3d:not([data-in]) { opacity: 0; transform: perspective(1100px) rotateX(calc(var(--depth-3d, 1) * 12deg)) translateY(64px) scale(0.97); }
    html.anim-ok .reveal3d[data-in] { opacity: 1; transform: perspective(1100px) rotateX(0deg) translateY(0) scale(1); transition: transform 0.9s var(--ease-out), opacity 0.9s var(--ease-out); }
    html.anim-ok .reveal3d[data-done] { transition: transform 0.3s var(--ease-out), box-shadow 0.3s var(--ease-out); }

    /* soft text/blocks reveal — rise + focus pull */
    html.anim-ok .reveal-up:not([data-in]) { opacity: 0; transform: translateY(38px); filter: blur(9px); }
    html.anim-ok .reveal-up[data-in] { opacity: 1; transform: none; filter: none; transition: opacity 0.95s var(--ease-out), transform 0.95s var(--ease-out), filter 0.95s var(--ease-out); }

    /* cinematic variants for the About / profile section */
    html.anim-ok .reveal-clip:not([data-in]) { opacity: 0; clip-path: inset(0 0 100% 0); transform: scale(1.08) translateY(28px); filter: blur(6px); }
    html.anim-ok .reveal-clip[data-in] { opacity: 1; clip-path: inset(0 0 0 0); transform: none; filter: none; transition: clip-path 1.4s var(--ease-out), opacity 0.9s var(--ease-out), transform 1.4s var(--ease-out), filter 1.1s var(--ease-out); }
    /* gold light-sweep that crosses the portrait as it unveils */
    .cinema-sweep { position: absolute; inset: 0; z-index: 4; pointer-events: none; overflow: hidden; }
    .cinema-sweep::before { content: ''; position: absolute; top: -40%; left: -60%; width: 45%; height: 180%; transform: rotate(18deg) translateX(-40px); background: linear-gradient(90deg, transparent, rgba(239,217,171,0.55), transparent); opacity: 0; }
    html.anim-ok .reveal-clip[data-in] .cinema-sweep::before { animation: cinemaSweep 1.5s var(--ease-out) 0.5s both; }
    @keyframes cinemaSweep { 0% { opacity: 0; left: -60%; } 30% { opacity: 1; } 100% { opacity: 0; left: 130%; } }
    html.anim-ok .reveal-left:not([data-in]) { opacity: 0; transform: translateX(-46px); filter: blur(8px); }
    html.anim-ok .reveal-left[data-in] { opacity: 1; transform: none; filter: none; transition: opacity 0.9s var(--ease-out), transform 1s var(--ease-out), filter 0.9s var(--ease-out); }
    html.anim-ok .reveal-right:not([data-in]) { opacity: 0; transform: translateX(46px); filter: blur(8px); }
    html.anim-ok .reveal-right[data-in] { opacity: 1; transform: none; filter: none; transition: opacity 0.9s var(--ease-out), transform 1s var(--ease-out), filter 0.9s var(--ease-out); }
    /* line-by-line bio rise — children stagger via --i */
    html.anim-ok .reveal-lines:not([data-in]) > * { opacity: 0; transform: translateY(26px); }
    html.anim-ok .reveal-lines[data-in] > * { opacity: 1; transform: none; transition: opacity 0.8s var(--ease-out), transform 0.8s var(--ease-out); transition-delay: calc(var(--i, 0) * 110ms); }

    /* page-to-page transition — every navigation glides in */
    html.anim-ok .page-anim { animation: pageIn 0.7s var(--ease-out) both; }
  }
  @keyframes pageIn { from { opacity: 0; transform: translateY(30px); filter: blur(8px); } to { opacity: 1; transform: none; filter: none; } }
  /* ---- Map color grade: kill the brown — every map reads in brand blue ---- */
  .map-tint { filter: grayscale(1) sepia(0.9) hue-rotate(165deg) saturate(2.1) brightness(0.85) contrast(1.06); }

  /* ---- Section textures: faint blue map + watermark mark ---- */
  .texture-map { position: relative; }
  .texture-map::before { content: ''; position: absolute; inset: 0; background: url('assets/maps/la-hero-dark.png') center / cover; opacity: 0.12; filter: grayscale(1) sepia(0.9) hue-rotate(165deg) saturate(2) brightness(0.75); pointer-events: none; }
  .texture-map > * { position: relative; z-index: 1; }
  .watermark-logo { position: relative; overflow: hidden; }
  .watermark-logo { position: relative; overflow: hidden; }
  .watermark-logo::after {
    content: ''; position: absolute; right: 56px; top: 50%; transform: translateY(-50%);
    width: 480px; height: 480px; max-width: 42%; pointer-events: none;
    /* the white logo PNG is used as an alpha mask, then filled with a gold gradient
       so the Hirth mark reads as a warm gold watermark on every band it sits on */
    -webkit-mask: url('assets/logo-hirth-white.png') center / contain no-repeat;
    mask: url('assets/logo-hirth-white.png') center / contain no-repeat;
    background: linear-gradient(135deg, var(--gold-500) 0%, var(--gold-200) 55%, var(--gold-500) 100%);
    opacity: 0.16;

  .watermark-logo.on-light::after { opacity: 0.12; }

  /* ---- Ghost type — giant engraved serif words behind sections ---- */
  .ghost-word { position: absolute; right: 8px; top: 14px; z-index: 0; font-family: var(--font-display); font-size: clamp(110px, 13vw, 190px); line-height: 1; letter-spacing: 0.05em; color: rgba(255,255,255,0.018); -webkit-text-stroke: 1px rgba(165,205,230,0.085); pointer-events: none; user-select: none; white-space: nowrap; }
  .ghost-word.gold { -webkit-text-stroke: 1px rgba(205,163,95,0.16); }

  /* gold pops */
  .stat-plus { color: var(--gold) !important; }
  .svc-num { color: var(--gold) !important; opacity: 0.92 !important; }

  .gold-text { color: var(--gold) !important; }

  /* ---- Ambient drifting light — the page is never a dead background ---- */
  .orb { position: fixed; border-radius: 50%; filter: blur(90px); pointer-events: none; z-index: 0; mix-blend-mode: screen; }
  .orb1 { width: 560px; height: 560px; background: radial-gradient(circle, rgba(27,156,216,0.3), transparent 65%); top: -160px; right: -140px; }
  .orb2 { width: 480px; height: 480px; background: radial-gradient(circle, rgba(79,107,124,0.28), transparent 65%); bottom: -180px; left: -160px; }
  .orb3 { width: 440px; height: 440px; background: radial-gradient(circle, rgba(205,163,95,0.22), transparent 65%); top: 42%; left: 26%; }
  @media (prefers-reduced-motion: no-preference) {
    html.anim-ok .orb1 { animation: orbA 26s ease-in-out infinite alternate; }
    html.anim-ok .orb2 { animation: orbB 32s ease-in-out infinite alternate; }
    html.anim-ok .orb3 { animation: orbA 38s ease-in-out infinite alternate-reverse; }

  @keyframes orbA { from { transform: translate3d(0, 0, 0) scale(1); } to { transform: translate3d(-120px, 90px, 0) scale(1.15); } }
  @keyframes orbB { from { transform: translate3d(0, 0, 0) scale(1); } to { transform: translate3d(140px, -110px, 0) scale(1.1); } }

  /* ---- Planet: pre-tinted real world map in a sphere illusion ---- */
  .dive-layer, .dive-planet-wrap, .dive-planet { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .dive-planet { width: 100%; height: 100%; border-radius: 50%; background-size: 100% 100%; position: relative; overflow: hidden;
    box-shadow: inset -60px -50px 160px rgba(0,0,0,0.78), inset 0 0 120px rgba(8,16,22,0.5); }
  .dive-planet::before { content: ''; position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 32% 26%, rgba(255,255,255,0.13), transparent 46%); z-index: 3; }
  .dive-la-glint { position: absolute; width: 8px; height: 8px; margin: -4px; border-radius: 50%; background: #cfeeff; box-shadow: 0 0 12px 4px rgba(76,180,226,0.9), 0 0 28px 10px rgba(27,156,216,0.5); z-index: 4; }
  @media (prefers-reduced-motion: no-preference) {

  @keyframes glintPulse { 0%, 100% { transform: scale(1); opacity: 0.9; } 50% { transform: scale(1.7); opacity: 1; } }
  /* warp-speed star streaks during the plunge — radial lines from LA's screen point */
  .dive-warp { position: absolute; inset: 0; z-index: 29; pointer-events: none; opacity: 0; overflow: hidden; }
  .dive-warp span { position: absolute; left: 50%; top: 50%; width: 2px; height: 22vh; transform-origin: 50% 0; background: linear-gradient(180deg, rgba(255,255,255,0.85), rgba(120,190,240,0.25) 40%, transparent); border-radius: 2px; }
  /* landing flash — a quick bloom as the city resolves */
  .dive-flash { position: absolute; inset: 0; z-index: 31; pointer-events: none; opacity: 0; background: radial-gradient(circle at 50% 48%, rgba(255,255,255,0.9), rgba(205,163,95,0.4) 30%, transparent 62%); }
  .dive-stars { position: absolute; inset: -10%; pointer-events: none;
    background-image:
      radial-gradient(1.6px 1.6px at 25px 35px, rgba(255,255,255,0.9), transparent 60%),
      radial-gradient(1px 1px at 150px 120px, rgba(255,255,255,0.7), transparent 60%),
      radial-gradient(1.2px 1.2px at 80px 210px, rgba(180,220,255,0.65), transparent 60%),
      radial-gradient(0.8px 0.8px at 220px 60px, rgba(255,255,255,0.5), transparent 60%),
      radial-gradient(1px 1px at 310px 170px, rgba(200,230,255,0.55), transparent 60%),
      radial-gradient(1.3px 1.3px at 360px 280px, rgba(255,255,255,0.6), transparent 60%);
    background-size: 420px 420px; will-change: transform, opacity; }
  @media (prefers-reduced-motion: no-preference) {

  }
  @keyframes starDrift { from { transform: translate3d(0, 0, 0); } to { transform: translate3d(-420px, -210px, 0); } }

  /* ---- Cinematic Earth → LA dive (scroll-driven; static contexts skip it) ---- */
  .dive-wrap:not(.dive-on) .dive-layer,
  .dive-wrap:not(.dive-on) .dive-planet-wrap,
  .dive-wrap:not(.dive-on) .dive-stars,

  .dive-wrap:not(.dive-on) .dive-hint { display: none !important; }

  .dive-wrap:not(.dive-on) .dive-sticky { position: relative; min-height: 620px; display: flex; align-items: center; }

  .dive-wrap:not(.dive-on) .dive-final { opacity: 1 !important; }
  .dive-wrap:not(.dive-on) .dive-final .fx { opacity: 1 !important; transform: none !important; filter: none !important; }
  .dive-wrap.dive-on { height: 100vh; }
  .dive-wrap.dive-on.dive-done { height: 100vh; }
  .dive-on .dive-sticky { position: sticky; top: 0; height: 100vh; }
  /* staged entrance of the final hero content — logo, eyebrow, headline, lede, CTAs */
  .dive-on .dive-final .fx { opacity: 0; transform: translateY(34px); filter: blur(10px); transition: opacity 0.9s var(--ease-out), transform 0.9s var(--ease-out), filter 0.9s var(--ease-out); }
  .dive-on .dive-final.show .fx { opacity: 1; transform: none; filter: none; }
  @media (prefers-reduced-motion: no-preference) {
    .dive-hint > div { animation: divehint 2.2s var(--ease-out) infinite; transform-origin: top center; }
  }
  @keyframes divehint { 0% { transform: scaleY(0); } 45% { transform: scaleY(1); } 100% { transform: scaleY(1); opacity: 0; } }

// The world map behind the whole site keeps zooming in as you scroll down — the
// descent never truly ends. Eased every frame so stepped wheel input stays fluid.
(() => {
  if (!window.matchMedia('(prefers-reduced-motion: no-preference)').matches) return;
  let cur = 0, last = 0;
  const loop = (now) => {
    const zoom = document.querySelector('.world-zoom');
    if (zoom) {
      const dh = Math.max(document.documentElement.scrollHeight - window.innerHeight, 1);
      const sp = Math.min((window.scrollY || 0) / dh, 1);
      const dt = last ? Math.min((now - last) / 1000, 0.05) : 0.016;
      cur += (sp - cur) * (1 - Math.exp(-dt * 6));
      const s = (1 + cur * 0.5).toFixed(4);
      const ty = (cur * -4).toFixed(2);
      zoom.style.transform = 'translate3d(0,' + ty + 'vh,0) scale(' + s + ')';
    }
    last = now;
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
})();
(() => {
  const SEL = '.tilt3d, .svc';
  document.addEventListener('pointermove', (e) => {
    const el = e.target.closest && e.target.closest(SEL);
    if (!el) return;
    const depth = window.__tiltDepth === undefined ? 1 : window.__tiltDepth;
    if (!depth) return;
    const r = el.getBoundingClientRect();
    const sizeDamp = Math.min(1, 460 / r.width); // wide rows tilt less than cards
    const px = (e.clientX - r.left) / r.width - 0.5;
    const py = (e.clientY - r.top) / r.height - 0.5;
    const max = 9 * depth * sizeDamp;
    el.style.transform = 'perspective(900px) rotateX(' + (-py * max).toFixed(2) + 'deg) rotateY(' + (px * max).toFixed(2) + 'deg) translateY(-4px)';
    if (!el.__tiltBound) {
      el.__tiltBound = true;
      el.addEventListener('pointerleave', () => { el.style.transform = ''; });
    }
  }, { passive: true });

  document.addEventListener('scroll', () => {
    const y = window.scrollY;
    const depth = window.__tiltDepth === undefined ? 1 : window.__tiltDepth;
    document.querySelectorAll('.hero-par').forEach((img) => {
      img.style.transform = 'translateY(' + (y * 0.28 * depth).toFixed(1) + 'px) scale(1.12)';
    });
  }, { passive: true });
})();

// Scroll-reveal driver — IntersectionObserver instead of a perpetual
// scroll/resize/mutation + 600ms setInterval sweep (that combo was scanning the
// whole DOM continuously and was a real source of the site feeling laggy).
// Reveal state lives in data attributes so React re-renders (tweaks) can't reset it.
(() => {
  requestAnimationFrame(() => document.documentElement.classList.add('anim-ok'));
  const SEL = '.reveal3d:not([data-in]), .reveal-up:not([data-in]), .reveal-clip:not([data-in]), .reveal-left:not([data-in]), .reveal-right:not([data-in]), .reveal-lines:not([data-in])';
  const io = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      if (!entry.isIntersecting) return;
      const el = entry.target;
      el.setAttribute('data-in', '1');
      setTimeout(() => el.setAttribute('data-done', '1'), 1100);
      io.unobserve(el);
    });
  }, { rootMargin: '0px 0px -8% 0px', threshold: 0 });
  const observeNew = () => {
    document.querySelectorAll(SEL).forEach((el) => {
      const vh = window.innerHeight;
      const r = el.getBoundingClientRect();
      // Some constrained/preview iframe contexts never fire IntersectionObserver
      // callbacks at all — reveal immediately for anything already in (or near)
      // view instead of depending solely on the observer, so content is never
      // permanently stuck invisible. IO still handles below-the-fold reveal-on-scroll.
      if (vh < 10 || (r.top < vh * 0.95 && r.bottom > 0)) {
        el.setAttribute('data-in', '1');
        setTimeout(() => el.setAttribute('data-done', '1'), 1100);
      } else {
        io.observe(el);
      }
    });
  };
  window.addEventListener('DOMContentLoaded', () => {
    const root = document.getElementById('root');
    if (root) new MutationObserver(observeNew).observe(root, { childList: true, subtree: true });
    observeNew();
    // Last-resort safety net: if something still never revealed (e.g. this IO
    // never fires in this environment), force everything visible after a beat.
    setTimeout(() => document.querySelectorAll(SEL).forEach((el) => el.setAttribute('data-in', '1')), 1500);
  });
})();

// Cursor: a precise instrument — instant dot + eased hairline ring that opens
// over interactive elements. rAF-gated; desktop pointers only.
(() => {
  if (!window.matchMedia('(pointer: fine)').matches) return;
  window.addEventListener('DOMContentLoaded', () => {
    const dot = document.createElement('div'); dot.className = 'cursor-dot';
    const ring = document.createElement('div'); ring.className = 'cursor-ring';
    document.body.append(dot, ring);
    let mx = -600, my = -600, rx = -600, ry = -600, nx = 0, ny = 0;
    const parOk = window.matchMedia('(prefers-reduced-motion: no-preference)').matches;
    document.addEventListener('pointermove', (e) => {
      mx = e.clientX; my = e.clientY;
      document.body.classList.add('cursor-on');
    }, { passive: true });
    document.addEventListener('pointerleave', () => document.body.classList.remove('cursor-on'));
    document.addEventListener('pointerover', (e) => {
      const hit = e.target.closest && e.target.closest('a, button, input, select, textarea, label, .tilt3d, .svc');
      ring.classList.toggle('big', !!hit);
    }, { passive: true });
    const loop = () => {
      rx += (mx - rx) * 0.22; ry += (my - ry) * 0.22;
      dot.style.transform = 'translate(' + mx + 'px,' + my + 'px)';
      ring.style.transform = 'translate(' + rx.toFixed(1) + 'px,' + ry.toFixed(1) + 'px)';
      if (parOk) {
        // background layers drift toward the pointer at different depths
        const tx = mx > -500 ? (mx / window.innerWidth) - 0.5 : 0;
        const ty = my > -500 ? (my / window.innerHeight) - 0.5 : 0;
        nx += (tx - nx) * 0.055; ny += (ty - ny) * 0.055;
        document.querySelectorAll('[data-cursor-par]').forEach((el) => {
          const f = parseFloat(el.getAttribute('data-cursor-par')) || 0;
          el.style.transform = 'translate3d(' + (nx * f).toFixed(2) + 'px,' + (ny * f).toFixed(2) + 'px,0)';
        });
      }
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  });
})();

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

  { title: '11771 Washington Blvd', meta: 'Whittier, CA 90606', status: 'for-sale', image: S + '11771-washington.jpg', price: 'Contact us for price', headline: 'Corner Lot Retail Building', specs: ['±984 SF Building', '±15,397 SF Lot', 'LCC3BE* Zoning', '10.91% Cap', '12.16% Pro Forma Cap', 'Corner Lot'], description: ['11771 Washington Blvd presents a rare opportunity to acquire a high-yield commercial investment positioned on a large infill parcel along one of Southeast Los Angeles County\u2019s primary commercial corridors. Located in the City of Whittier, the property consists of approximately 984 square feet of existing commercial improvements situated on an expansive \u00b115,397 square-foot lot with flexible LCC3BE* zoning, offering exceptional long-term functionality, owner-user utility, and redevelopment potential.', 'The asset is currently occupied under a gross lease structure generating strong in-place cash flow, while also benefiting from built-in contractual rent increases that ownership has not yet fully implemented, creating immediate upside for a new investor. The property is offered at an attractive 10.91% current capitalization rate with projected upside to approximately 12.16% pro forma capitalization rate through the implementation of contractual lease escalations alone.', 'Strategically positioned along Washington Boulevard, the property benefits from excellent visibility, strong traffic exposure, and immediate accessibility to Interstate 605, Interstate 5, and State Route 60. The surrounding trade area is supported by a dense mix of residential neighborhoods, industrial operators, automotive businesses, retail users, and commercial service providers that continue to drive strong demand throughout the Southeast Los Angeles County market.', 'The combination of durable in-place income, contractual revenue growth, flexible zoning, and intrinsic land value positions 11771 Washington Boulevard as a uniquely attractive opportunity for investors, owne   { title: '6825 Kester Avenue', meta: 'Van Nuys, CA 91405', status: 'for-sale', image: S + '6825-kester.jpg', price: 'Contact us for price', headline: '28-Unit Development Opportunity', tagline: '28 Buildable Units | 3 Designated for Extremely Low Income | TOC Tier 3', specs: ['28 Buildable Units', '<$56K / Buildable Unit', 'C1.5-1VL TOC Tier 3', '20,514 SF Buildable', 'Opportunity Zone'], description: ['Ethan Donel, Alex Reyhan, and Daniel Hirth are pleased to present 6825 Kester Avenue, an exceptional shovel-ready multifamily development opportunity located in the heart of Van Nuys, California. The property is strategically positioned just off the corner of Vanowen Street and North Kester Avenue, within one of the most active and diverse submarkets in the San Fernando Valley.', 'With RTI approved plans in place, a developer can immediately break ground on a 28-unit multifamily building priced at under $56,000 per buildable unit. The design includes twenty-three (23) primary residential units and five (5) fitness rooms with existing plumbing and infrastructure that can be converted into ADUs to reach the full 28-unit potential.', 'The property is zoned C1.5-1VL TOC Tier 3 with a FAR of 2.34:1, permitting 20,514 square feet of buildable area, and is located within an opportunity zone allowing developers to receive federal tax incentives. With the upcoming Metro Light Rail extension along Van Nuys Boulevard, the neighborhood is poised for long-term appreciation.'] },
  { title: '330 Hillcrest Boulevard', meta: 'Inglewood, CA 90301', status: 'for-sale', image: S + '330-hillcrest.jpg', price: 'Contact us for price', headline: 'Multi-Tenant Medical/Office Building', tagline: 'Well-Positioned Medical/Office Asset in Inglewood’s Explosive Growth Corridor', specs: ['5,500 SF Building', '11,550 SF Lot', '2 Units', 'Built 1955 / INC1', 'On-Site Parking'], description: ['Elijah Suval and Daniel Hirth of The Hirth Group have been exclusively selected to market for sale 330 E Hillcrest Blvd, Inglewood, CA 90301 — a multi-tenant medical/office building consisting of 5,500 SF of building on an 11,550 SF lot. The property is configured with two units, one measuring 3,500 SF and leased to a long-standing dental practice, and the other totaling 2,000 SF and currently vacant, offering flexibility for an owner-user or new tenant. Built in 1955 and zoned INC1, the property provides ample on-site parking in the rear along with additional street parking.', '330 E Hillcrest Blvd sits at the epicenter of Inglewood’s explosive growth corridor, just south of West Manchester Blvd and east of South Market Street. The property is surrounded by hundreds of brand-new luxury apartments, with more projects breaking ground nearby. Immediately adjacent is a major mixed-use development featuring 65 luxury residential units and ground-floor retail.', 'Positioned minutes from SoFi Stadium, the Intuit Dome, The Kia Forum, and Hollywood Park, this location captures the momentum of one of Los Angeles’ fastest-growing submarkets. *Buyer to perform own due diligence and verify all information.'] },

  { title: '6543 Lankershim Boulevard', meta: 'North Hollywood, CA 91606', status: 'for-sale', image: S + '6543-lankershim.jpg', price: 'Contact us for price', headline: 'Preschool/Daycare Center', tagline: 'Fantastic Owner-User Opportunity | SBA Financing with as Little as 10% Down', specs: ['±3,103 SF Building', '±9,380 SF Lot', 'LAC2 Zoned', '3 Classrooms', 'Playground + Kitchen'], description: ['The Hirth Group’s team, consisting of Ethan Donel, Alex Reyhan, and Daniel Hirth, has been exclusively retained by ownership to facilitate the sale of 6543 Lankershim Boulevard, North Hollywood, CA 91606. This ±3,103 SF educational facility is situated on an estimated ±9,380 SF lot zoned LAC2, offering excellent frontage and visibility along Lankershim Boulevard with prominent signage, a secure front entrance, and convenient alley access at the rear. The property features three (3) large classrooms, one (1) administrative office, three (3) bathrooms, a spacious reception area, and a fully equipped kitchen, plus a central playground and open activity area.', 'With the building currently featuring a month-to-month tenant, 6543 Lankershim Boulevard presents an excellent opportunity for an owner/user to capitalize on the strong demand for educational facilities. For an owner/user taking advantage of SBA financing with as little as 10% down, this is an ideal chance to own prime real estate in a highly desirable pocket of the San Fernando Valley.', 'Note: Per title, building is ±3,088 square feet. Buyers advised to independently verify all information, measurements, and permitted uses with the City of Los Angeles.'] },
  { title: '2321 Filbert Street', meta: 'Oakland, CA 94607', status: 'for-sale', image: P + 'listing-2321-filbert.jpg', price: 'Contact us for price', headline: 'Fully Built Commercial Kitchen', tagline: 'Attractive Yield: 7.57% in-place year 1 cap rate with scheduled growth to 7.70% and a blended ~8.05% return over the remaining lease.', specs: ['Turnkey Chef Kitchen', 'Leased to Always Fishing Inc.', '7.57% Year 1 Cap', '~8.05% Blended Return'], description: ['2321 Filbert Street represents a rare investment opportunity: a fully improved, turnkey chef\u2019s kitchen and catering production facility in the heart of Oakland. Leased to Always Fishing Inc., a seasoned operator with a strong foothold in the culinary and catering sector, the property offers stable cash flow, a high replacement-cost build-out, and long-term market relevance.', 'The existing lease provides an attractive 7.57% year 1 cap rate, with scheduled rent increases elevating the return to 7.70% in 2026. Averaged across the remaining term, investors benefit from a blended return of ~8.05% \u2014 a yield rarely available in today\u2019s Bay Area market for stabilized assets.', 'Note: Buyers are advised to independently verify all information, measurements, and permitted uses with the City of Oakland.'] },
  { title: '8621 Bellanca Avenue', meta: 'Los Angeles, CA 90045', status: 'for-sale', image: S + '8621-bellanca.jpg', price: 'Contact us for price', headline: 'Commercial-Flex Building', tagline: 'Freestanding 11,798 SF Commercial-Flex Building on a Large ±20,981 SF Lot', specs: ['11,798 SF Building', '±20,981 SF Lot', 'Built 1961 / LAMR1', '27-Car Gated Parking', 'Verizon Cell Tower Lease'], description: ['8621 Bellanca Avenue, Los Angeles, CA 90045 is a freestanding commercial-flex building with 11,798 SF on 20,981 SF of land. Built in 1961 and zoned LAMR1, it is in excellent condition with major upgrades, offering strong potential for office, creative office, commercial, or flex uses. Perfect for owner-users needing customizable space or investors seeking value-add opportunities, it provides ample room for reconfiguration. The subject property contains two points of ingress and egress as well as gated parking for 27 vehicles. Upgrades include new electrical wiring in December 2022 with mini-split provisions, a 2019 roof, 2023 windows, floors, ceilings, and lighting, plus wrought-iron fencing from 2019–2023.', '8621 Bellanca Avenue is strategically located in the heart of Westchester, adjacent to the booming LAX and Playa Vista submarkets. This dynamic location places the property within minutes of Los Angeles International Airport, the 405 and 105 freeways, and the Metro K Line. The area is surrounded by top-tier amenities including The Campus at Playa Vista, Runway Playa Vista, and Silicon Beach tech giants like Google, YouTube, and Amazon Studios.', '*A Verizon cell tower is located on the south side of the property. The lease agreement extends until November 30, 2029, with current monthly payments of $7,020, subject to 5% annual increases. Verizon is presently in its second option period and holds two additional 5-year renewal options.'] },

  { title: '6104 S. Wilton Place', meta: 'Los Angeles, CA 90047', status: 'for-sale', image: S + '6104-wilton.jpg', price: 'Contact us for price', headline: 'Development Opportunity', tagline: 'Perfect Land Banking Opportunity or Development Opportunity', specs: ['4,137 SF Lot', 'R1 Zoned', '~40% Delivered Vacant', '“Van Ness” Neighborhood'], description: ['6104 S. Wilton Place, Los Angeles, CA 90047, is a rare 4,137 SF R1-zoned lot nestled in the quiet “Van Ness” neighborhood of South LA. This property offers tremendous potential for developers and investors alike! Approximately 40% of the parcel, currently used by a neighboring tenant, will be delivered vacant at the close of escrow, providing an adaptable space for future use. Situated just off W. Slauson Ave. and S. Western Ave., enjoy seamless access to major thoroughfares, public transportation, and key employment hubs.', 'Surrounded by single-family homes and emerging developments, this property is in the path of progress, making it a prime investment for appreciation. With an increasing demand for housing and a rapidly evolving market, this lot is perfect for a developer or savvy investor looking to capitalize on future growth.', '*Buyer to verify all information. The backyard also contains an electrical pole.'] },
  { title: '8212 S. Western Avenue', meta: 'Los Angeles, CA 90047', status: 'in-escrow', image: S + '8212-western.jpg', price: 'Contact us for price', headline: 'A 89-Unit Development Opportunity', tagline: 'Attractive Price Per Buildable Unit: $39,326 / Buildable Unit', specs: ['23,434 SF Land', 'C2-1VL-CPIO', '58–89 Units', 'TOC Tier 1 / FAR 2.75:1', '~64,444 SF Buildable'], description: ['8212 S Western Avenue is located on the Northeast corner of W 83rd Street and S Western Avenue. The subject property boasts roughly 23,434 SF of land zoned C2-1VL-CPIO on a hard corner. 8212 S Western Avenue allows a developer the opportunity to build 58 units by right or 89 units exercising the TOC Tier 1 incentives, which include a 50% density bonus and an FAR increase of 2.75:1, totaling approximately 64,444 SF of buildable SF with only 8 units being designated to extremely low income, for less than $40,000 per buildable unit.', '8212 S Western Avenue is just blocks away from the well-known intersection of Manchester Avenue and S Western Ave. The submarket is gentrifying rapidly, recognized by the national tenants surrounding the subject property, such as Ralphs, O’Reilly Auto Parts, WSS Shoe Store, Taco Bell, Jiffy Lube, McDonald’s, KFC, Chase Bank, Domino’s Pizza, Smart & Final, and Wells Fargo, to name a few.', 'Note: Buyer to perform their own due diligence and verify all information.'] },

  { title: '144 N Clark Drive', meta: 'Beverly Hills, CA 90211', status: 'closed', dealType: 'Multifamily', price: '$2,865,000', image: S + '144-n-clark.jpg', headline: 'Eight Unit Apartment Building', tagline: 'The Hirth Group represented our client in this transaction.', description: ['The Hirth Group represented our client in the successful sale of 144 N. Clark Drive, a fully repositioned 8-unit multifamily asset in the heart of Beverly Hills. Situated on a quiet, tree-lined street moments from Beverly Drive, Wilshire Boulevard, and Rodeo Drive, the property traded in one of Los Angeles’ most desirable residential enclaves.', 'Through a competitive marketing campaign and disciplined negotiation, our team delivered certainty of execution and a result that reflected the asset’s full repositioned value.'] },
  { title: '2525 E Ball Road', meta: 'Anaheim, CA 92806', status: 'closed', image: CLO + 'n02.jpg', tagline: 'The Hirth Group represented our client in this transaction.', description: ['The Hirth Group represented our client in the successful sale of 2525 E Ball Road, a commercial real estate asset located in Anaheim. The transaction closed as part of the firm’s extensive track record across the greater Los Angeles commercial real estate market.', 'Through a competitive, broadly marketed campaign and disciplined negotiation, our team delivered certainty of execution and a result that reflected the asset’s full market value.'] },
  { title: '1329 2nd Avenue', meta: 'Los Angeles, CA 90019', status: 'closed', image: CLO + '1329-2nd.jpg', price: '$1,365,000', specs: ['4 Fully Remodeled Units', '7.33% CAP', '$227,500 Per Unit'], tagline: '7.33% CAP Rate | $227,500 Per Unit · $1,365,000 Closing · The Hirth Group represented our client.', description: ['Daniel Hirth and Alex Reyhan of The Hirth Group are proud to announce the successful closing of 1329 2nd Avenue in Los Angeles, CA 90019, located in the heart of the Mid-City submarket.', 'The property consists of four fully remodeled units with a highly desirable unit mix, offering immediate cash flow and long-term upside. The asset traded at a 7.33% cap rate, $227,500 per unit, providing strong in-place income and future value-add potential in one of Los Angeles’ most resilient rental markets.', 'This transaction was particularly meaningful as the seller was a repeat client, successfully executing another disposition, while the buyer was a first-time investor acquiring a stabilized asset with upside in a prime Mid-City location. Through clear communication, thoughtful structuring, and hands-on guidance, the deal moved efficiently from contract to closing.', 'The result was a true win-win transaction and another example of The Hirth Group’s commitment to delivering exceptional outcomes for our clients.'] },
  { title: '1101 Saviers Road', meta: 'Oxnard, CA 93033 · Auto Center', status: 'closed', image: CLO + '1101-saviers.jpg', price: '$2,500,000', specs: ['4,814 SF Building', '65,340 SF Lot', '$519.32/SF Building', '$38.26/SF Land'], tagline: '$519.32/SF Building | $38.26/SF Land · $2,500,000 Closing · The Hirth Group represented our client.', description: ['Daniel Hirth and Alex Reyhan of The Hirth Group are proud to announce the successful closing of 1101 Saviers Road in Oxnard, CA — positioned on the hard corner of W. Wooley Road & S. Oxnard Blvd.', 'The property consists of a 4,814 SF auto repair facility on a 65,340 SF lot in a high-traffic, high-visibility location. The property sold for $2,500,000, equating to $519.32 per square foot on the building and $38.26 per square foot on the land.', 'Leveraging deep market knowledge and long-standing relationships, The Hirth Group executed an off-market strategy, approaching the existing tenant and creating urgency around securing long-term control of the asset. Despite the challenge of the tenant’s nearly 20-year modified gross lease with multiple options, the team navigated the negotiation with precision and positioned the buyer for long-term success.', 'The Hirth Group also guided the buyer through the SBA financing process, ensuring a seamless transaction from initial discussions through closing. The seller, a repeat client, successfully capitalized on this disposition to complete a cash-out exit. The transaction closed with 45 days of due diligence and a 75-day escrow.'] },
  { title: '3015 Durfee Avenue', meta: 'El Monte, CA 91732 · Multi-Tenant Industrial Property', status: 'closed', image: CLO + '3015-durfee.jpg', price: '$3,990,000', headline: '10-Unit Mixed-Use Industrial Property', specs: ['10 Units', '5.78% CAP', 'Fully NNN Leases', '30-Day Due Diligence', '45-Day Close'], tagline: '5.78% CAP Rate | Fully NNN Leases · $3,990,000 Off-Market Closing · The Hirth Group represented our client.', description: ['The Hirth Group proudly announces the successful off-market sale of 3015 Durfee Avenue in El Monte, California — a rare 10-unit mixed-use industrial property strategically positioned in the heart of the San Gabriel Valley.', 'The property sold for $3,990,000 at a 5.78% capitalization rate on fully NNN leases, showcasing the strength of stabilized income-producing assets in one of Southern California’s most desirable industrial submarkets.', 'Through a 30-day due diligence period and a 45-day close, The Hirth Group guided the transaction seamlessly through an accelerated escrow process — including securing financing for the buyer — ensuring a smooth, strategic, and highly efficient closing from start to finish.', 'The property’s combination of modern construction, clear height, NNN leases, and multi-tenant configuration made it a highly coveted investment among institutional and private buyers alike, reflecting the ongoing demand for well-located, income-generating industrial assets with strong fundamentals and limited supply.'] },
  { title: '2226 Sepulveda Boulevard', meta: 'Los Angeles, CA 90064', status: 'closed', image: CLO + 'n06.jpg', tagline: 'The Hirth Group represented our client in this transaction.', description: ['The Hirth Group represented our client in the successful sale of 2226 Sepulveda Boulevard, a commercial real estate asset located in Los Angeles. The transaction closed as part of the firm’s extensive track record across the greater Los Angeles commercial real estate market.', 'Through a competitive, broadly marketed campaign and disciplined negotiation, our team delivered certainty of execution and a result that reflected the asset’s full market value.'] },
  { title: '1217–1223 Centinela Avenue', meta: 'Inglewood, CA 90301 · Educational Facility', status: 'closed', image: CLO + '1217-centinela.jpg', price: '$7,700,000', headline: 'Record-Setting Educational Facility Sale', specs: ['11,647 SF Building', '±39,121 SF Lot', '$660+/SF Building', '<100-Day Escrow'], tagline: '$660+/SF Building | Record Price for Inglewood · $7,700,000 Closing · The Hirth Group represented the seller.', description: ['The Hirth Group is pleased to announce the successful closing of 1217–1223 Centinela Avenue, Inglewood, CA 90301 — a daycare/educational facility located in the northwestern portion of Inglewood. The property consists of 11,647 SF of building on an estimated 39,121 SF lot. The building had been vacant for more than three years and carried significant deferred maintenance.', 'Elijah, Alex, and Daniel represented the seller, whose motivation to sell stemmed from the prolonged vacancy and a desire to see the property revitalized to serve children in an underserved community. The buyer, a non-profit entity, plans to redevelop the asset into a K–12 educational facility — a much-needed addition for Inglewood.', 'The Hirth Group’s close collaboration with the seller to strategize, position, and execute on her real estate goals is what sets the team apart. Within the first few weeks of marketing, the team generated multiple offers for both sale and lease, ultimately selecting the buyer best aligned with the seller’s vision. Escrow closed in just under 100 days with no re-trade.', 'At over $660/SF on the building and just under $200/SF on the land, The Hirth Group achieved a record-setting price — the highest price per SF for an educational facility of this size ever in Inglewood. Known for breaking records and consistently delivering in challenging markets, The Hirth Group once again demonstrated the ability to maximize value and provide results sellers can count on.'] },
  { title: 'Chipotle — 2929 Berry Street', meta: 'Fort Worth, TX', status: 'closed', image: CLO + 'n08.jpg', tagline: 'The Hirth Group represented our client in this transaction.', description: ['The Hirth Group represented our client in the successful sale of Chipotle, a single-tenant net-leased retail asset located in Fort Worth. The transaction closed as part of the firm’s extensive track record across the greater Los Angeles commercial real estate market.', 'The assignment reflects The Hirth Group’s expertise across retail, industrial, office, and multifamily product types, and our commitment to maximizing value for every client.'] },
  { title: '7569 Woodman Place', meta: 'Van Nuys, CA 91405', status: 'closed', image: CLO + '7569-woodman.jpg', price: '$2,350,000', tagline: 'The Hirth Group represented both the seller and the buyer in this transaction.', saleHighlights: ['Closed at Full List Price | Attracted Strong Buyer Interest in Challenging Market', 'Hands-On Throughout Escrow | Seamless SBA Loan Execution', 'Last-Minute Insurance Hurdles Resolved | Lot Resurfaced & Safety Upgrades Completed', '±7,192 SF Building on ±19,510 SF LAMR2-Zoned Corner Lot', 'Seller Expanding to Atlanta Facility | Buyer Establishing High-End Recycling Center', 'The Hirth Group Represented Both Sellers and Buyer'], description: ['Ethan Donel, Alex Reyhan, and Daniel Hirth of The Hirth Group are proud to announce the successful closing of 7569 Woodman Place, Van Nuys, CA 91405. This freestanding ±7,192 SF metal building sits on a prominent ±19,510 SF corner lot, zoned LAMR2 — a designation with far more restrictions on allowable uses compared to broader industrial zoning such as M1 or M2. From the start, our team understood these limitations and strategically targeted a niche pool of qualified buyers who could thrive within the property’s permitted uses.', 'This was a transaction years in the making. The property went into escrow twice before, and in that time market conditions shifted dramatically — higher interest rates, reduced buyer activity, and a more selective lending environment. But our team never stopped pushing. We re-engaged the market multiple times, keeping the seller confident in our ability to deliver, and ultimately secured a full list price sale.', 'We identified and secured a motivated owner-user — a first-time commercial property purchaser — who obtained SBA financing. We guided him through every step of the process, from offer to close. In the final days before escrow, unexpected insurance requirements nearly delayed the deal, ranging from something as minor as adding a fire extinguisher to major safety and liability work such as completely resurfacing the lot. Our team moved quickly, coordinating multiple vendors to complete the work on time so escrow could close without delay.', 'The seller is expanding operations to a larger facility in Atlanta, while the buyer is establishing a high-end recycling center at the site — a true win-win outcome that reflects The Hirth Group’s relentless, hands-on approach to every transaction.'] },
  { title: '2525 Ball Road', meta: 'Anaheim, CA 92806 · Express Car Wash', status: 'closed', image: CLO + '2525-ball.jpg', price: '$4,650,000', headline: 'Express Car Wash — 25-Year Absolute Ground Lease', specs: ['±38,370 SF Land', '±4,840 SF Improvements', '5.05% CAP', '25-Yr Absolute Ground Lease', 'All-Cash Close', 'Built 2025'], tagline: '5.05% CAP Rate | 25-Year Absolute Ground Lease · $4,650,000 All-Cash Closing · The Hirth Group represented our client .', description: ['The property consists of a newly constructed, institutional-quality express car wash situated on approximately ±38,370 square feet of land with ±4,840 square feet of improvements. Strategically located at the signalized intersection of E Ball Road and Sunkist Street, just off the 57 Freeway, the asset benefits from exposure to approximately ±80,000 vehicles per day and exceptional regional accessibility.', 'Positioned within one of Orange County’s most dynamic trade areas, the property is located approximately 2.5 miles from Disneyland Resort, in close proximity to the Honda Center, and approximately 1.5 miles from Angel Stadium. The surrounding Platinum Triangle and Anaheim Resort District continue to experience significant public and private investment, reinforcing long-term fundamentals and sustained consumer traffic in the immediate corridor.', 'The asset is secured by a 25-year absolute ground lease, providing true passive ownership with zero landlord responsibilities and long-term income stability. Notably, The Hirth Group brought the property to market prior to the car wash opening to the public, successfully generating multiple competitive offers during pre-stabilization.', 'In a capital markets environment characterized by elevated interest rates, cautious underwriting, and limited transaction velocity, the team executed an all-cash closing at a 5.05% CAP rate. The buyer, a repeat client of The Hirth Group, strategically acquired the asset for long-term cash flow durability and bonus depreciation benefits, while the seller achieved premium pricing in a market where many comparable assets are experiencing extended marketing timelines and price discovery challenges.', 'This transaction further demonstrates The Hirth Group’s ability to create a competitive marketing campaign, structure certainty, and deliver institutional-level execution — even in a constrained capital markets environment. The Hirth Group represented both the buyer and the seller in this transaction.'] },
  { title: '6226 Vineland Avenue', meta: 'North Hollywood, CA 91606', status: 'closed', image: CLO + 'n10.jpg', tagline: 'The Hirth Group represented our client in this transaction.', description: ['The Hirth Group represented our client in the successful sale of 6226 Vineland Avenue, a commercial property located in North Hollywood. The transaction closed as part of the firm’s extensive track record across the greater Los Angeles commercial real estate market.', 'Through a competitive, broadly marketed campaign and disciplined negotiation, our team delivered certainty of execution and a result that reflected the asset’s full market value.'] },
  { title: '2319 W Magnolia Boulevard', meta: 'Burbank, CA 91506 · Two-Story Office Building', status: 'closed', image: CLO + '2319-magnolia.jpg', price: '$1,350,000', headline: 'Two-Story Office Building — Owner-User Sale', specs: ['±2,111 SF Building', '±2,625 SF Lot', '98% of List Price', 'Dozen+ Competitive Offers'], tagline: '98% of List Price | Dozen+ Competitive Offers · $1,350,000 Closing · The Hirth Group represented both the seller and buyer.', description: ['Ethan Donel, Alex Reyhan, and Daniel Hirth of The Hirth Group are proud to announce the successful closing of 2319 W Magnolia Boulevard, Burbank, CA 91506. This well-located, two-story office building features ±2,111 square feet of space on a ±2,625 SF BUC3YY-zoned lot, positioned along the highly visible thoroughfare of Magnolia Boulevard.', 'The Hirth Group represented both the seller and buyer in this transaction, generating over a dozen competitive offers. Prior to our involvement, the property had been listed with another firm but received little to no traction. Leveraging our market dominance, we advised the seller on a refreshed pricing and positioning strategy — reigniting interest and driving momentum.', 'The road to closing wasn’t without its challenges. The property entered escrow multiple times and fell out, but our team remained relentless throughout the process. We continued to push forward, re-engaging buyers, maintaining momentum, and ultimately delivering results for our client.', 'We ultimately identified an ideal owner-user buyer, already SBA pre-approved, and negotiated a deal that closed at 98% of list price. Despite volatility in the current financing environment, our team remained hands-on throughout the process — working closely with the buyer, their lender, and the SBA to ensure a seamless and efficient escrow for all parties involved.', 'After outgrowing the space, the seller upgraded to a larger nearby facility — opening the door for a rare owner-user opportunity in the heart of Burbank. The buyer moved quickly to capitalize on the moment and will now transform the property into the new headquarters for their growing company.'] },

// ---- Photo auto-matching by address slug -------------------------------------
// Drop a photo into assets/photos/closed/ named after the property address and
// it fills that card automatically — no code edit needed. Examples:
//   1440 W. Manchester Avenue  ->  1440-manchester.jpg
//   707–711 Vesta Street       ->  707-vesta.jpg
//   Burger King — 1608 N. Tift Avenue -> 1608-tift.jpg
// Rule: <street number>-<first street word>.jpg  (also accepts .png/.webp)
// Directional prefixes (N/S/E/W) and punctuation are ignored.
// Returns every acceptable slug for a title, so an address range like
// "707–711 Vesta Street" matches a file named 707-vesta.jpg OR 711-vesta.jpg.
const _photoSlugs = (title) => {
  const t = String(title || '').replace(/[—–]/g, '-').toLowerCase().replace(/[.,&]/g, ' ');
  const nums = [...t.matchAll(/\b(\d{2,6})\b/g)];
  if (!nums.length) return [];
  const skip = /^(north|south|east|west|st|nd|rd|th|the|and|suite|ste|unit)$/;
  const type = /^(street|st|avenue|ave|boulevard|blvd|road|rd|drive|dr|place|pl|way|lane|ln|court|ct|highway|hwy|circle|parkway|pkwy)$/;
  const out = [];
  nums.forEach((m) => {
    const after = t.slice(m.index + m[1].length);
    const words = after.split(/\s+/).filter((w) => /^[a-z]{2,}$/.test(w) && !skip.test(w));
    const named = words.filter((w) => !type.test(w));
    const word = named[0] || words[0];
    if (word) out.push(m[1] + '-' + word);
  });
  return out;
};

  _photoBySlug[base] = 'assets/photos/closed/' + f;

  const cands = _photoSlugs(title);
  for (let i = 0; i < cands.length; i++) { if (_photoBySlug[cands[i]]) return _photoBySlug[cands[i]]; }
  return null;
};

const _norm = (s) => (s || '').toLowerCase().replace(/[—–-]/g, ' ').replace(/[^a-z0-9 ]/g, '').replace(/\s+/g, ' ').trim();
const _detByTitle = {};

// Photo auto-match runs ONCE over the fully assembled list — not per-branch, or
// the `_extra` rows (the majority) never get it. Runs before dedupe so `_score`
// sees newly-matched photos and the richest record wins the merge.
SOLD_LIST = SOLD_LIST.map((l) => (l.image ? l : Object.assign({}, l, { image: _autoPhoto(l.title) || null })));

// ---- One card per property. The resume lists a property once per side of the
// deal (and again if it traded more than once), and some records are titled by
// tenant brand rather than address — all of which read as duplicates. Key off the
// COMBINED title+meta (street number + ZIP) so brand-titled and address-titled
// records for the same property collapse together.
const _addrKey = (l, i) => {
  const s = (String(l.title || '') + ' ' + String(l.meta || '')).replace(/[—–]/g, '-');
  const num = (s.match(/\b\d{3,6}\b/) || [''])[0];
  const zips = s.match(/\b\d{5}\b/g);
  const zip = zips ? zips[zips.length - 1] : '';
  if (num && zip) return num + '#' + zip;                       // strongest: street no. + ZIP
  const street = s.toLowerCase().replace(/[.,]/g, '').split(/\s+/)
    .filter((w) => /^[a-z]{3,}$/.test(w) && !/^(north|south|east|west|the|and)$/.test(w))[0] || '';
  if (num) return num + '#' + street;                            // no ZIP: street no. + street name
  // No street number at all (portfolios, brand-only titles): match on the title
  // core before any " - qualifier", so "X - 3 Properties" and "X" collapse.
  const core = String(l.title || '').replace(/[—–]/g, '-').split(' - ')[0]
    .toLowerCase().replace(/[^a-z0-9]/g, '');
  return 'name#' + (core || ('row' + i));
};
const _score = (l) => (l.image ? 4 : 0) + (l.description ? 2 : 0) + (l.headline ? 1 : 0);

(function dedupeSold() {
  const buckets = new Map();
  SOLD_LIST.forEach((l, i) => {
    const k = _addrKey(l, i);
    if (!buckets.has(k)) buckets.set(k, []);
    buckets.get(k).push(l);
  });
  const merged = [];
  buckets.forEach((group) => {
    if (group.length === 1) { merged.push(group[0]); return; }
    const byScore = group.slice().sort((a, b) => _score(b) - _score(a));
    const base = byScore[0];                       // richest record — keeps the photo
    const top = group.slice().sort((a, b) => _amt(b.price) - _amt(a.price))[0];
    // Prefer a title that carries the street address over a bare brand name.
    const titled = byScore.filter((g) => /\d/.test(String(g.title || '')));

    const distinct = Array.from(new Set(prices));
    merged.push(Object.assign({}, base, {
      title: (titled[0] || base).title,
      meta: group.map((g) => g.meta || '').sort((a, b) => b.length - a.length)[0] || base.meta,
      price: _amt(top.price) > 0 ? top.price : base.price,
      dealType: base.dealType || top.dealType,
      representation: base.representation || top.representation,
      dealCount: distinct.length > 1 ? distinct.length : undefined,
    }));
  });
  SOLD_LIST = merged;
})();

// Lead with the largest closings — the track record reads strongest big-first.
SOLD_LIST = SOLD_LIST.slice().sort((a, b) => _amt(b.price) - _amt(a.price));

Object.assign(window, { LISTINGS, FEATURED, SERVICES, DANIEL, TESTIMONIAL_FULL, TESTIMONIALS, SOLD_PHOTOS, SOLD_LIST });

<script type="text/babel">
// The Hirth Group website kit — DiveHero: cinematic Earth → LA scroll descent.
// 2D compositor-only build: every animated element moves with transform/opacity
// alone (pre-tinted map images, zero runtime filters, no WebGL) so the dive runs
// at full frame rate on any machine. Real cartography throughout (CARTO/OSM).
// Static contexts (no rendering frames / reduced motion) skip the dive and render
// the normal LA-map hero — content is never hidden. The descent is one-way per
// session: once you land in LA, the hero pins and never flies back to space.
const { Button: DiveButton, Eyebrow: DiveEyebrow } = window.HirthGroupDesignSystem_c76dea;

const diveMercY = (lat) => { const r = lat * Math.PI / 180; return (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2; };
const DIVE_LA = { lat: 34.05, lon: -118.25 };
const diveFrac = (b) => {
  const yN = diveMercY(b.north), yS = diveMercY(b.south);
  return { x: (DIVE_LA.lon - b.west) / (b.east - b.west), y: (diveMercY(DIVE_LA.lat) - yN) / (yS - yN) };
};
const EF = diveFrac(window.MAP_BOUNDS.earth);

function DiveHero({ go }) {
  const wrapRef = React.useRef(null);

  React.useEffect(() => {
    const wrap = wrapRef.current;
    if (!wrap) return;
    let cleanup = null;

    const t = setTimeout(() => {
      const framesOk = document.documentElement.classList.contains('anim-ok');
      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      // DESKTOP: the earth fills the screen and LOCKS scroll — you descend through
      // it (Earth → LA) before the site scrolls. TOUCH/iPhone: the dive AUTO-PLAYS
      // and never locks (locking touch-scroll breaks inside the Wix frame).
      if (!framesOk || reduced) return; // static hero
      // SCROLL-LOCKED DESCENT on EVERY device (desktop + iPhone): the earth fills
      // the screen and the page is locked — you drive the Earth → LA descent with
      // wheel or swipe. The instant you land, the lock is FULLY released (every
      // listener removed, overflow + touch-action restored) so the rest of the
      // site scrolls freely from then on, with no blockers anywhere.

      const planet = wrap.querySelector('.dive-planet-wrap');
      const glint = wrap.querySelector('.dive-la-glint');
      const starsEl = wrap.querySelector('.dive-stars');
      const layers = { socal: wrap.querySelector('.dive-socal') };
      const intro = wrap.querySelector('.dive-intro');
      const label = wrap.querySelector('.dive-label');
      const hint = wrap.querySelector('.dive-hint');
      const finalEl = wrap.querySelector('.dive-final');
      const B = window.MAP_BOUNDS;

      wrap.classList.add('dive-on');

      // ---------- layout ----------
      let D = 0;
      const place = () => {
        const vw = window.innerWidth, vh = window.innerHeight;
        D = Math.round(Math.min(vw, vh) * 0.74);
        planet.style.width = D + 'px';
        planet.style.height = D + 'px';
        planet.style.left = (vw / 2 - D / 2) + 'px';
        planet.style.top = (vh / 2 - D / 2 + vh * 0.03) + 'px';
        planet.style.transformOrigin = (EF.x * 100) + '% ' + (EF.y * 100) + '%';
        const S = 1.28 * Math.max(vw, vh);
        [['socal', B.socal]].forEach(([k, b]) => {
          const f = diveFrac(b), el = layers[k];
          el.style.width = S + 'px'; el.style.height = S + 'px';
          el.style.left = (vw / 2 - f.x * S) + 'px';
          el.style.top = (vh / 2 - f.y * S) + 'px';
          el.style.transformOrigin = (f.x * 100) + '% ' + (f.y * 100) + '%';
        });
      };

      // ---------- scroll-driven timeline (all eased, all overlapping) ----------
      const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
      const ss = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
      const seg = (p, a, b) => ss((p - a) / (b - a));
      let target = 0, prog = 0;
      let done = false; // one-way ratchet per page load — every fresh load starts at Earth
      // Scroll-jack: while descending we LOCK the page and drive progress from wheel/
      // touch deltas — so no matter how fast the user flings, they cannot skip past the
      // dive to the footer. Progress is clamped 0→1; the page releases only on landing.
      const SENS = 1 / 2600;
      let touchY = null;
      let locked = true;
      document.body.style.overflow = 'hidden';
      document.documentElement.style.overflow = 'hidden';
      document.body.style.touchAction = 'none';
      window.scrollTo(0, 0);
      const onWheel = (e) => { if (done) return; e.preventDefault(); target = clamp(target + e.deltaY * SENS, 0, 1); };
      const onTouchStart = (e) => { touchY = e.touches[0].clientY; };
      const onTouchMove = (e) => {
        if (done) return; e.preventDefault();
        const y = e.touches[0].clientY;
        if (touchY != null) target = clamp(target + (touchY - y) * SENS * 2.4, 0, 1);
        touchY = y;
      };
      const onKey = (e) => {
        if (done) return;
        if (['ArrowDown', 'PageDown', ' ', 'Spacebar'].includes(e.key)) { e.preventDefault(); target = clamp(target + 0.14, 0, 1); }
        else if (['ArrowUp', 'PageUp'].includes(e.key)) { e.preventDefault(); target = clamp(target - 0.14, 0, 1); }
      };
      const releaseLock = () => {
        if (!locked) return;
        locked = false;
        document.body.style.overflow = '';
        document.documentElement.style.overflow = '';
        document.body.style.touchAction = '';
        window.removeEventListener('wheel', onWheel, { passive: false });
        window.removeEventListener('touchstart', onTouchStart);
        window.removeEventListener('touchmove', onTouchMove, { passive: false });
        window.removeEventListener('keydown', onKey);
      };
      const onScroll = () => { if (done) target = 1; };

      const setFlat = (el, p, inA, inB, outA, outB, sA, sB) => {
        const o = seg(p, inA, inB) * (1 - seg(p, outA, outB));
        if (o < 0.004) { if (el.style.visibility !== 'hidden') { el.style.visibility = 'hidden'; el.style.opacity = 0; } return; }
        el.style.visibility = 'visible';
        el.style.opacity = o;
        // modest per-layer scale — kept low so the raster map never magnifies
        // past its native resolution and stays sharp through the descent
        el.style.transform = 'translateZ(0) scale(' + Math.pow(1.7, seg(p, sA, sB)).toFixed(4) + ')';
      };

      const LABELS = [[0.05, 0.42, 'Earth'], [0.6, 0.82, 'Southern California']];
      let raf = 0;
      let last = 0;
      // Smooth the raw scroll target itself (wheel notches arrive as big discrete
      // jumps); we low-pass the target, then critically-damp the displayed prog
      // toward it — two stages of easing turn stepped input into glass-smooth motion.
      let smoothTarget = 0;
      let diveStart = 0;
      const AUTO_MS = 4200; // earth descends Earth → LA by itself over ~4.2s
      const loop = (now) => {
        if (disposed) return;
        const dt = last ? Math.min((now - last) / 1000, 0.05) : 0.016;
        last = now;
        if (!diveStart) diveStart = now;
        // AUTO-DESCEND: progress advances by itself over AUTO_MS. The page stays
        // locked the whole time (earth is all you see) until it lands, then the
        // lock releases and the site scrolls freely. Same on every device.
        if (!done) target = clamp((now - diveStart) / AUTO_MS, 0, 1);
        smoothTarget += (target - smoothTarget) * (1 - Math.exp(-dt * 5.0));
        const k = 1 - Math.exp(-dt * 4.2); // gentle glide, ~230ms time-constant
        prog += (smoothTarget - prog) * k;
        if (Math.abs(smoothTarget - prog) < 0.0003 && Math.abs(target - smoothTarget) < 0.0003) { prog = smoothTarget = target; }
        if (!done && prog >= 0.985) {
          done = true;
          wrap.classList.add('dive-done');
          prog = 1; target = 1;
          releaseLock();
          window.scrollTo({ top: 0 });
        }
        const p = prog;

        // planet: gentle idle bob, then a single accelerating zoom anchored on LA
        const e1 = seg(p, 0.02, 0.5);
        const drift = seg(p, 0.04, 0.46);
        const zoom = 1 + Math.pow(seg(p, 0.0, 0.52), 1.5) * 1.5; // 1 → 2.5, sharp
        const tx = (0.5 - EF.x) * D * drift;
        const ty = (0.5 - EF.y) * D * drift + 7 * Math.sin(now * 0.0006) * (1 - e1);
        const planetO = 1 - seg(p, 0.46, 0.6);
        planet.style.transform = 'translate3d(' + tx.toFixed(1) + 'px,' + ty.toFixed(1) + 'px,0) scale(' + zoom.toFixed(4) + ')';
        planet.style.opacity = planetO;
        planet.style.visibility = planetO < 0.004 ? 'hidden' : 'visible';
        glint.style.opacity = seg(p, 0.16, 0.34) * planetO;
        starsEl.style.opacity = 1 - seg(p, 0.3, 0.52);

        setFlat(layers.socal, p, 0.46, 0.6, 0.82, 0.92, 0.5, 0.86);

        const io = 1 - seg(p, 0.02, 0.13);
        intro.style.opacity = io;
        hint.style.opacity = 0;
        let lt = '', lo = 0;
        for (const [a, b, txt] of LABELS) {
          const o = seg(p, a, a + 0.05) * (1 - seg(p, b, b + 0.05));
          if (o > lo) { lo = o; lt = txt; }
        }

        label.style.opacity = lo;

        finalEl.style.opacity = fo;
        finalEl.style.pointerEvents = fo > 0.6 ? 'auto' : 'none';
        finalEl.classList.toggle('show', fo > 0.12);

      };

      let disposed = false;
      place(); onScroll();
      raf = requestAnimationFrame(loop);

      // hasn't finished a few seconds after it should, force it complete and
      // release the lock — so the page can NEVER stay stuck locked.
      const watchdog = setTimeout(() => {
        if (done) return;
        done = true;
        wrap.classList.add('dive-done');
        target = 1; smoothTarget = 1; prog = 1;
        releaseLock();
      }, AUTO_MS + 7000);

function _hash(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h; }
function buildFallbackNarrative(l) {
  const city = l.meta ? l.meta.split(',')[0] : '';

    () => 'This ' + (type ? type + ' at ' : 'closing at ') + addr + (city ? ', ' + city + ',' : '') + ' was handled start to finish by our team.',

    () => 'A well-executed ' + (type || 'commercial') + ' closing at ' + addr + (city ? ', ' + city : '') + '.',
  ];
  const closers = price
    ? [' The transaction closed at ' + price + '.', ' Final sale price: ' + price + '.', ' It traded at ' + price + '.']
    : [' Contact our team for the full transaction record.', ' Reach out for details on this closing.', ''];
  const second = [
    'The Hirth Group managed every stage of the deal — sourcing, negotiation, and escrow — on behalf of our client.',
    'From initial marketing through final closing, our team ran point on every stage of the transaction.',

    'This closing reflects the hands-on, deal-by-deal approach The Hirth Group brings to every assignment.',

  const h = _hash(addr);
  const open = openers[h % openers.length]();
  const close = closers[Math.floor(h / openers.length) % closers.length];
  const sec = second[Math.floor(h / (openers.length * closers.length)) % second.length];
  return [open + close, sec + ' Get in touch with The Hirth Group for more on this deal.'];
}
