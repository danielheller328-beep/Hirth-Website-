// Jarvis / arc-reactor HUD — layered SVG rings (beaded outer, tick marks,
// segmented + dashed rings, glowing core) with the Hirth mark at center.
window.HudReactor = function HudReactor({ size = 260, speaking = false }) {
  const BLUE = '#1b9cd8';
  const polar = (cx, cy, r, deg) => { const a = (deg - 90) * Math.PI / 180; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; };
  const beads = Array.from({ length: 96 }, (_, i) => { const [x, y] = polar(100, 100, 95, i * 3.75); return <circle key={i} cx={x} cy={y} r={i % 8 === 0 ? 1.9 : 1.15} fill={BLUE} opacity={i % 8 === 0 ? 0.95 : 0.55} />; });
  const ticks = Array.from({ length: 60 }, (_, i) => { const deg = i * 6; const [x1, y1] = polar(100, 100, 82, deg); const [x2, y2] = polar(100, 100, i % 5 === 0 ? 72 : 77, deg); return <line key={i} x1={x1} y1={y1} x2={x2} y2={y2} stroke={BLUE} strokeWidth={i % 5 === 0 ? 1.4 : 0.7} opacity={i % 5 === 0 ? 0.85 : 0.4} />; });
  const dots = Array.from({ length: 40 }, (_, i) => { const [x, y] = polar(100, 100, 66, i * 9); return <circle key={i} cx={x} cy={y} r="1" fill={BLUE} opacity="0.5" />; });
  return (
    <div style={{ position: 'relative', width: size, height: size, margin: '0 auto' }}>
      <style>{'@keyframes hg-spin{to{transform:rotate(360deg)}}@keyframes hg-spin-r{to{transform:rotate(-360deg)}}@keyframes hg-pulse{0%,100%{opacity:.45}50%{opacity:.95}}@keyframes hg-glow{0%,100%{opacity:.55;transform:scale(.97)}50%{opacity:1;transform:scale(1.03)}}@keyframes hg-talk{0%{opacity:.7;transform:scale(.96)}25%{opacity:1;transform:scale(1.1)}50%{opacity:.82;transform:scale(1.0)}75%{opacity:1;transform:scale(1.12)}100%{opacity:.7;transform:scale(.96)}}.hgr{transform-origin:100px 100px}'}</style>
      <svg viewBox="0 0 200 200" width={size} height={size} style={{ position: 'absolute', inset: 0, filter: 'drop-shadow(0 0 6px rgba(27,156,216,0.45))', overflow: 'visible' }}>
        <defs>
          <radialGradient id="hgcore" cx="50%" cy="42%" r="60%">
            <stop offset="0%" stopColor="#eaf7ff" stopOpacity="0.9" />
            <stop offset="34%" stopColor={BLUE} stopOpacity="0.85" />
            <stop offset="70%" stopColor="#0f2a38" stopOpacity="0.6" />
            <stop offset="100%" stopColor="#0a141a" stopOpacity="0" />
          </radialGradient>
        </defs>
        <g className="hgr" style={{ animation: 'hg-spin 40s linear infinite' }}>{beads}</g>
        <circle className="hgr" cx="100" cy="100" r="88" fill="none" stroke={BLUE} strokeWidth="0.6" opacity="0.35" />
        <g className="hgr" style={{ animation: 'hg-spin-r 24s linear infinite' }}>{ticks}</g>
        {/* broken accent arc, like the reference */}
        <path className="hgr" d="M100 12 A88 88 0 0 1 176 64" fill="none" stroke={BLUE} strokeWidth="2" strokeLinecap="round" opacity="0.9" style={{ animation: 'hg-spin 8s linear infinite' }} />
        <circle className="hgr" cx="100" cy="70" r="70" fill="none" stroke={BLUE} strokeWidth="0.5" opacity="0.25" style={{ transformOrigin: '100px 100px' }} />
        <g className="hgr" style={{ animation: 'hg-spin 30s linear infinite' }}>{dots}</g>
        {/* segmented inner ring */}
        <circle className="hgr" cx="100" cy="100" r="54" fill="none" stroke={BLUE} strokeWidth="9" strokeDasharray="15 9" opacity="0.85" style={{ animation: 'hg-spin-r 14s linear infinite' }} />
        {/* dashed ring */}
        <circle className="hgr" cx="100" cy="100" r="42" fill="none" stroke={BLUE} strokeWidth="1.4" strokeDasharray="3 5" opacity="0.7" style={{ animation: 'hg-spin 10s linear infinite' }} />
        <circle cx="100" cy="100" r="34" fill="url(#hgcore)" style={{ transformOrigin: '100px 100px', animation: (speaking ? 'hg-talk 0.5s ease-in-out infinite' : 'hg-glow 3.4s ease-in-out infinite') }} />
        <circle className="hgr" cx="100" cy="100" r="30" fill="none" stroke={BLUE} strokeWidth="0.8" opacity="0.55" style={{ animation: 'hg-pulse 2.4s ease-in-out infinite' }} />
      </svg>
      <div style={{ position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        <img src="assets/logo-hirth-white.png" alt="The Hirth Group" style={{ width: '30%', opacity: 0.97, filter: 'drop-shadow(0 0 8px rgba(27,156,216,0.6))', animation: speaking ? 'hg-talk 0.5s ease-in-out infinite' : 'none' }} />
      </div>
    </div>
  );
}

function TestimonialCarousel() {
  const items = window.TESTIMONIALS || [];
  const [i, setI] = React.useState(0);
  const n = items.length;
  const go = (next) => setI((p) => (p + next + n) % n);
  const touch = React.useRef(null);
  const onStart = (e) => { touch.current = e.touches[0].clientX; };
  const onEnd = (e) => {
    if (touch.current == null) return;
    const dx = e.changedTouches[0].clientX - touch.current;
    if (Math.abs(dx) > 50) go(dx < 0 ? 1 : -1);
    touch.current = null;
  };
  React.useEffect(() => {
    const onKey = (e) => { if (e.key === 'ArrowLeft') go(-1); if (e.key === 'ArrowRight') go(1); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  });
  const arrow = {
    background: 'none', border: 0, cursor: 'pointer', color: 'var(--text-inverse-secondary)',
    fontSize: '32px', lineHeight: 1, padding: '12px', transition: 'color 150ms var(--ease-out)',
    flexShrink: 0,
  };
  const t = items[i] || { quote: '', attribution: '' };
  return (
    <div style={{ width: '100%', maxWidth: 'var(--container-max)', margin: '0 auto' }}>
      <div
        onTouchStart={onStart}
        onTouchEnd={onEnd}
        style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '24px' }}
      >
        <button style={arrow} aria-label="Previous" onClick={() => go(-1)}
          onMouseEnter={(e) => (e.currentTarget.style.color = 'var(--blue-400)')}
          onMouseLeave={(e) => (e.currentTarget.style.color = 'var(--text-inverse-secondary)')}
        >&larr;</button>
        <div style={{ flex: 1, minHeight: '340px', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          <PgQuote key={i} inverse={false} quote={t.quote} attribution={t.attribution} />
        </div>
        <button style={arrow} aria-label="Next" onClick={() => go(1)}
          onMouseEnter={(e) => (e.currentTarget.style.color = 'var(--blue-400)')}
          onMouseLeave={(e) => (e.currentTarget.style.color = 'var(--text-inverse-secondary)')}
        >&rarr;</button>
      </div>
      <div style={{ display: 'flex', justifyContent: 'center', gap: '14px', marginTop: '36px' }}>
        {items.map((_, d) => (
          <button key={d} aria-label={'Testimonial ' + (d + 1)} onClick={() => setI(d)}
            style={{
              width: '9px', height: '9px', borderRadius: '50%', padding: 0, cursor: 'pointer',
              border: d === i ? '1.5px solid var(--text-primary)' : 0,
              background: d === i ? 'transparent' : 'var(--border-subtle)',
              transition: 'all 150ms var(--ease-out)',
            }}
          ></button>
        ))}
      </div>
    </div>
  );
}

function applyTweaks(t) {

}

// Listing detail overlay — wired so PropertyCard clicks always open it.
// Exception: a listing with a `flyer` PDF opens a full-screen in-context PDF
// viewer (window.open to a relative path loses the preview token).
const listingHolder = { open: null };
const flyerHolder = { open: null };
window.HirthOpenListing = (l) => {
  if (l && l.flyer) { if (flyerHolder.open) flyerHolder.open(l); return; }
  if (listingHolder.open) listingHolder.open(l);
};

function flyerFilename(listing) {
  return (listing.title || 'Hirth-Group-Listing').replace(/[^a-z0-9]+/gi, '-').replace(/^-|-$/g, '') + '-Lease-Flyer.pdf';
}

// Robust cross-device download: fetch the PDF as a blob and save it via a
// temporary anchor (works in sandboxed iframes where a bare download attr is
// ignored). Falls back to opening the file in a new tab if fetch is blocked.
async function downloadFlyer(listing) {
  const url = listing.flyer;
  const name = flyerFilename(listing);
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const blob = await res.blob();
    const obj = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = obj; a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(obj); }, 1500);
  } catch (e) {
    window.open(url, '_blank', 'noopener');
  }
}

      <object data={listing.flyer + '#view=FitH'} type="application/pdf" style={{ flex: 1, width: '100%', border: 0, background: '#33373b' }}>
        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', height: '100%', gap: '18px', padding: '40px', textAlign: 'center' }}>
          <p style={{ color: 'var(--text-inverse)', fontFamily: 'var(--font-display)', fontSize: '24px', margin: 0 }}>Preview not available here.</p>
          <p style={{ color: 'var(--text-inverse-secondary)', fontSize: '14px', margin: 0 }}>Some browsers and ad/tracker blockers block embedded PDFs — tap below to download the flyer.</p>
          <div style={{ display: 'flex', gap: '12px', flexWrap: 'wrap', justifyContent: 'center' }}>
            <button onClick={() => downloadFlyer(listing)} style={{ display: 'inline-flex', alignItems: 'center', gap: '8px', cursor: 'pointer', border: 'none', font: 'var(--weight-semibold) 12px var(--font-sans)', letterSpacing: 'var(--tracking-caps)', textTransform: 'uppercase', color: '#fff', background: 'var(--action-accent)', borderRadius: 'var(--radius-xs)', padding: '14px 26px' }}>Download Flyer (PDF)</button>
          </div>
        </div>
      </object>
    </div>
  );
}

function ListingModal({ listing, onClose, go }) {
  const _hash = (s) => { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h; };
  const HIRTH_AGENTS = [
    { name: 'Daniel Hirth', role: 'Managing Director', phone: '310.300.2838', tel: '3103002838', email: 'Daniel@HirthGroup.com', license: 'CA: 01515796', photo: 'assets/photos/daniel-hirth-portrait.png' },
    { name: 'Alex Reyhan', role: 'Vice President', phone: '310.300.3181', tel: '3103003181', email: 'Alex@HirthGroup.com', license: 'CA: 02005428', photo: 'assets/photos/team-alex-reyhan.png' },
  ];
  React.useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    document.body.style.overflow = listing ? 'hidden' : '';
    if (listing && window.lucide) window.lucide.createIcons();
    return () => { window.removeEventListener('keydown', onKey); document.body.style.overflow = ''; };
  }, [onClose, listing]);
  if (!listing) return null;
  const { Tag } = window.HirthGroupDesignSystem_c76dea;
  const region = (listing.meta || '').split('·')[0].trim();
  // Build the most geocode-reliable address: strip range/multi-address noise
  // ("1250 & 1270 East Park Street", "5501–5521 Hollywood Boulevard", brand
  // prefixes like "Chipotle — 2929 Berry Street") down to a single clean
  // street number + street name, so Google pins the exact parcel instead of
  // guessing at an ambiguous combined address.
  const cleanAddr = (t) => {
    const s = String(t || '').replace(/[–—]/g, '-');
    const idx = s.search(/\d/);
    if (idx === -1) return null; // no street number in the title at all
    const rest = s.slice(idx).replace(/^(\d+)(?:\s*[-&]\s*\d+)?/, '$1');
    return rest.trim();
  };
  const cleaned = cleanAddr(listing.title);
  // If the title carries no street number (e.g. a brand/portfolio name with the
  // real address only in meta), geocode off the meta address alone.
  const addr = cleaned ? (cleaned + ', ' + region) : region;
  const propType = (listing.dealType || listing.headline || '').toLowerCase();
  const cityOnly = region ? region.split(',')[0].trim() : 'Los Angeles';
  const cityPhrase = cityOnly !== 'Los Angeles' || !propType ? cityOnly : '';
  const openers = [
    (t, c, p) => 'The Hirth Group sold ' + t + (c ? ', a well-positioned asset in ' + c + ',' : '') + ' on behalf of our client. From the initial engagement through marketing, negotiation, and escrow, the team managed every stage of the process directly — the kind of hands-on representation that has defined The Hirth Group\u2019s track record across the greater Los Angeles commercial real estate market' + (p ? '. The transaction closed at ' + p : '') + '.',
    (t, c, p) => 'Bringing ' + t + (c ? ' to market in ' + c : '') + ', The Hirth Group ran a focused, relationship-driven process from listing to close. Our team worked the deal from the ground up — positioning the asset, driving demand, and guiding our client through negotiation and escrow to a smooth, on-time close' + (p ? ' at ' + p : '') + ', backed by the firm\u2019s deep knowledge of the local market.',
    (t, c, p) => t + (c ? ' in ' + c : '') + ' represents the kind of deal The Hirth Group is built for: hands-on stewardship through every stage of the transaction, from underwriting through close of escrow. Our team managed the marketing, negotiation, and diligence process directly on behalf of our client, delivering a successful outcome' + (p ? ' at a sale price of ' + p : '') + ' as part of the firm\u2019s extensive record across Southern California.',
    (t, c, p) => 'The Hirth Group guided ' + t + (c ? ' in ' + c : '') + ' to a successful sale' + (p ? ' at ' + p : '') + ', representing our client from the first conversation through final closing. This closing reflects the same disciplined process behind every transaction the firm handles — thorough preparation, direct client communication, and a relentless focus on getting the deal to the finish line.',
  ];
  const idx = _hash(listing.title || '') % openers.length;
  const body = listing.description || [
    listing.status === 'closed' ? openers[idx](listing.title, cityPhrase, listing.price && /^\$/.test(listing.price) ? listing.price : null)
      : listing.status === 'leased' ? 'Successfully leased by The Hirth Group.'
      : 'This asset is currently available. The full marketing package — pricing, financials, rent roll, and offering memorandum — is provided on request.',
  ];
  return (
    <div onClick={onClose} style={{
      position: 'fixed', inset: 0, zIndex: 200, overflowY: 'auto',
      background: 'rgba(6,12,16,0.78)', backdropFilter: 'blur(8px)', animation: 'pageIn 0.3s var(--ease-out) both',
    }}>
      <div onClick={(e) => e.stopPropagation()} style={{
        maxWidth: '1180px', margin: '0 auto', minHeight: '100%',
        background: 'var(--surface-inverse)', boxShadow: 'var(--shadow-overlay)',
      }}>
        {/* top bar — Back to Listings */}
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '20px 32px', borderBottom: '1px solid var(--border-inverse)', position: 'sticky', top: 0, background: 'var(--navy-950)', zIndex: 5 }}>
          <button onClick={onClose} style={{ background: 'none', border: 'none', cursor: 'pointer', display: 'inline-flex', alignItems: 'center', gap: '8px', font: 'var(--weight-medium) 12px var(--font-sans)', letterSpacing: 'var(--tracking-caps)', textTransform: 'uppercase', color: 'var(--text-inverse-secondary)' }}
            onMouseEnter={(e) => { e.currentTarget.style.color = '#fff'; }} onMouseLeave={(e) => { e.currentTarget.style.color = 'var(--text-inverse-secondary)'; }}>
            <span style={{ fontSize: '15px' }}>&larr;</span> Back to Listings
          </button>
          <img src="assets/logo-hirth-white.png" alt="The Hirth Group" style={{ height: '40px', width: 'auto' }} />
        </div>

        <div className="r-2col" style={{ display: 'grid', gridTemplateColumns: '1.15fr 0.85fr', gap: '0' }}>
          {/* photo */}
          <div style={{ position: 'relative', minHeight: '440px', background: 'var(--navy-900)' }}>
            {listing.image
              ? <img src={listing.image} alt={listing.title} style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'contain' }} />
              : <div style={{ position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', background: 'linear-gradient(160deg, #16242e, #0a141a)' }}>
                  <img src="assets/logo-hirth-white.png" alt="" style={{ width: '46%', opacity: 0.28 }} />
                </div>}
            <span style={{ position: 'absolute', top: '20px', left: '20px' }}><Tag status={listing.status} /></span>
          </div>
          {/* info */}
          <div style={{ padding: '48px 44px 56px' }}>
            <p style={{ font: 'var(--weight-medium) 11px var(--font-sans)', letterSpacing: 'var(--tracking-eyebrow)', textTransform: 'uppercase', color: 'var(--gold-500)', margin: 0 }}>{region || 'Greater Los Angeles'}</p>
            <h2 style={{ fontFamily: 'var(--font-display)', fontSize: '34px', color: '#fff', margin: '12px 0 0', lineHeight: 1.12 }}>{listing.title}</h2>
            {listing.price
              ? <p style={{ fontFamily: 'var(--font-sans)', fontWeight: 'var(--weight-bold)', fontSize: '24px', color: 'var(--blue-400)', margin: '22px 0 0', letterSpacing: '0.01em' }}>PRICE: {listing.price}</p>
              : <p style={{ display: 'inline-flex', alignItems: 'center', gap: '10px', fontFamily: 'var(--font-sans)', fontWeight: 'var(--weight-bold)', fontSize: '18px', letterSpacing: '0.16em', textTransform: 'uppercase', color: (listing.status === 'closed' || listing.status === 'leased') ? '#fff' : 'var(--blue-400)', margin: '22px 0 0' }}>
                  <span style={{ width: '9px', height: '9px', borderRadius: '50%', background: listing.status === 'leased' ? 'var(--grey-400)' : listing.status === 'for-lease' ? 'var(--blue-400)' : 'var(--status-closed, #2f9e63)' }}></span>
                  {listing.status === 'closed' ? 'SOLD BY THE HIRTH GROUP' : listing.status === 'leased' ? 'LEASED BY THE HIRTH GROUP' : listing.status === 'for-lease' ? 'FOR LEASE · SEE FLYER' : 'CONTACT FOR PRICE'}
                </p>}
            {listing.headline ? <h3 style={{ fontFamily: 'var(--font-sans)', fontWeight: 'var(--weight-bold)', fontSize: '18px', color: '#fff', margin: '24px 0 0' }}>{listing.headline}</h3> : null}
            {listing.specs ? (
              <div style={{ display: 'flex', flexWrap: 'wrap', gap: '10px', marginTop: '22px' }}>
                {listing.specs.map((s) => (
                  <span key={s} style={{ display: 'inline-flex', alignItems: 'center', font: 'var(--weight-medium) 12px var(--font-sans)', color: 'var(--text-inverse)', background: 'rgba(255,255,255,0.06)', border: '1px solid var(--border-inverse)', borderRadius: 'var(--radius-xs)', padding: '7px 12px' }}>{s}</span>
                ))}
              </div>
            ) : null}
            <div style={{ width: '48px', height: '2px', background: 'linear-gradient(90deg, var(--gold), var(--gold-200))', margin: '22px 0' }}></div>
            {body.map((para, i) => (
              <p key={i} style={{ color: 'var(--text-inverse-secondary)', fontSize: '14.5px', lineHeight: 1.75, margin: i ? '16px 0 0' : 0 }}>{para}</p>
            ))}
            {listing.tagline ? (
              <p style={{ marginTop: '22px', padding: '14px 18px', borderLeft: '2px solid var(--gold-500)', background: 'rgba(255,255,255,0.04)', fontSize: '14px', fontStyle: 'italic', color: 'var(--gold-200)', lineHeight: 1.6 }}>{listing.tagline}</p>
            ) : null}
            {listing.flyer ? (
              <div style={{ marginTop: '26px', display: 'flex', gap: '12px', flexWrap: 'wrap' }}>
                <Button variant="accent" onClick={() => { onClose(); window.HirthOpenFlyer && window.HirthOpenFlyer(listing); }}>
                  <i data-lucide="file-text" style={{ width: '15px', height: '15px' }}></i> View Lease Flyer
                </Button>
                <Button variant="outline-inverse" onClick={() => downloadFlyer(listing)}>
                  <i data-lucide="download" style={{ width: '15px', height: '15px' }}></i> Download PDF
                </Button>
              </div>
            ) : null}
          </div>
        </div>

        {listing.flyer ? (
          <div style={{ borderTop: '1px solid var(--border-inverse)', padding: '40px 44px 0' }}>
            <p style={{ font: 'var(--weight-medium) 11px var(--font-sans)', letterSpacing: 'var(--tracking-eyebrow)', textTransform: 'uppercase', color: 'var(--gold-500)', margin: '0 0 16px' }}>Lease Flyer</p>
            <div style={{ position: 'relative', borderRadius: 'var(--radius-sm)', overflow: 'hidden', border: '1px solid var(--border-inverse)', aspectRatio: '8.5 / 11', maxWidth: '620px', margin: '0 auto', background: 'var(--navy-900)' }}>
              <iframe title={'Flyer for ' + listing.title} src={listing.flyer + '#view=FitH'} loading="lazy" decoding="async"
                style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', border: 0 }}></iframe>
            </div>
          </div>
        ) : null}

        {/* Location — real Google Maps pin for this address */}
        <div style={{ borderTop: '1px solid var(--border-inverse)', padding: '40px 44px 48px' }}>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: '16px', marginBottom: '20px', flexWrap: 'wrap' }}>
            <div>
              <p style={{ font: 'var(--weight-medium) 11px var(--font-sans)', letterSpacing: 'var(--tracking-eyebrow)', textTransform: 'uppercase', color: 'var(--gold-500)', margin: 0 }}>Location</p>
              <h3 style={{ fontFamily: 'var(--font-display)', fontSize: '22px', color: '#fff', margin: '6px 0 0' }}>{listing.title} &middot; {region}</h3>
            </div>
            <a href={'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(addr)} target="_blank" rel="noopener noreferrer"
              style={{ display: 'inline-flex', alignItems: 'center', gap: '8px', font: 'var(--weight-semibold) 11px var(--font-sans)', letterSpacing: 'var(--tracking-caps)', textTransform: 'uppercase', color: 'var(--blue-400)', textDecoration: 'none', border: '1px solid var(--border-inverse)', borderRadius: 'var(--radius-xs)', padding: '10px 16px' }}>
              <i data-lucide="map-pin" style={{ width: '15px', height: '15px' }}></i> Open in Google Maps
            </a>
          </div>
          <div style={{ position: 'relative', borderRadius: 'var(--radius-sm)', overflow: 'hidden', border: '1px solid var(--border-inverse)', aspectRatio: '16 / 6', background: 'var(--navy-900)' }}>
            <iframe title={'Map of ' + listing.title} loading="lazy" decoding="async" referrerPolicy="no-referrer-when-downgrade"
              src={'https://maps.google.com/maps?q=' + encodeURIComponent(addr) + '&z=15&t=m&hl=en&output=embed'}
              style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', border: 0 }}></iframe>
          </div>
        </div>
        {/* THE SALE — deal highlights (closed listings) */}
        {listing.saleHighlights && listing.saleHighlights.length ? (
          <div style={{ borderTop: '1px solid var(--border-inverse)', padding: '44px' }}>
            <p style={{ font: 'var(--weight-medium) 11px var(--font-sans)', letterSpacing: 'var(--tracking-eyebrow)', textTransform: 'uppercase', color: 'var(--gold-500)', margin: '0 0 24px' }}>The Sale</p>
            <div className="r-grid-2" style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '18px 40px' }}>
              {listing.saleHighlights.map((h, i) => (
                <div key={i} style={{ display: 'flex', gap: '14px', alignItems: 'flex-start' }}>
                  <i data-lucide="check-circle-2" style={{ width: '18px', height: '18px', color: 'var(--gold-400)', flex: 'none', marginTop: '3px' }}></i>
                  <p style={{ margin: 0, fontSize: '15px', lineHeight: 1.55, color: 'var(--text-inverse)' }}>{h}</p>
                </div>
              ))}
            </div>
          </div>
        ) : null}
        {/* Listed By + Request OM — present on every listing */}
        <div className="r-2col" style={{ borderTop: '1px solid var(--border-inverse)', display: 'grid', gridTemplateColumns: '1.4fr 1fr' }}>
          <div style={{ padding: '44px', display: 'flex', flexDirection: 'column', gap: '28px' }}>
            <p style={{ font: 'var(--weight-medium) 11px var(--font-sans)', letterSpacing: 'var(--tracking-eyebrow)', textTransform: 'uppercase', color: 'var(--gold-500)', margin: 0 }}>Listed By</p>
            {HIRTH_AGENTS.map((a) => (
              <div key={a.name} style={{ display: 'flex', gap: '18px', alignItems: 'center' }}>
                <img src={a.photo} alt={a.name} style={{ width: '76px', height: '76px', borderRadius: '50%', objectFit: 'cover', objectPosition: 'top center', border: '1px solid var(--border-inverse)', flex: 'none' }} />
                <div>
                  <p style={{ fontFamily: 'var(--font-display)', fontSize: '21px', color: '#fff', margin: 0 }}>{a.name}</p>
                  <p style={{ font: 'var(--weight-medium) 10.5px var(--font-sans)', letterSpacing: 'var(--tracking-eyebrow)', textTransform: 'uppercase', color: 'var(--blue-400)', margin: '4px 0 8px' }}>{a.role}</p>
                  <p style={{ fontSize: '13px', color: 'var(--text-inverse-secondary)', lineHeight: 1.6, margin: 0 }}>
                    <a href={'tel:' + a.tel} style={{ color: 'var(--text-inverse)' }}>{a.phone}</a> Direct &middot; <a href={'mailto:' + a.email} style={{ color: 'var(--text-inverse)' }}>{a.email}</a><br />License {a.license}
                  </p>
                </div>
              </div>
            ))}
          </div>
          <div style={{ background: 'var(--navy-950)', padding: '44px', display: 'flex', flexDirection: 'column', justifyContent: 'center', alignItems: 'flex-start', gap: '16px' }}>
            <h3 style={{ fontFamily: 'var(--font-display)', fontSize: '28px', color: '#fff', margin: 0 }}>Request the OM</h3>
            <p style={{ fontSize: '14px', color: 'var(--text-inverse-secondary)', lineHeight: 1.7, margin: 0 }}>Get the full offering memorandum — financials, rent roll, and marketing package — sent directly to you.</p>
            <div style={{ display: 'flex', gap: '12px', flexWrap: 'wrap', marginTop: '6px' }}>
              <Button variant="accent" onClick={() => { onClose(); go('contact'); }}>Request OM</Button>
              <Button variant="outline-inverse" href="tel:3103002838">Call 310.300.2838</Button>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  React.useEffect(() => { applyTweaks(t); }, [t]);
  const [selected, setSelected] = React.useState(null);
  listingHolder.open = setSelected;
  const [flyer, setFlyer] = React.useState(null);
  flyerHolder.open = setFlyer;
  const [page, setPage] = React.useState(() => localStorage.getItem('hirth-kit-page') || 'home');
  const go = (p) => {
    setPage(p);
    localStorage.setItem('hirth-kit-page', p);
    window.scrollTo({ top: 0 });
  };
  React.useEffect(() => {
    const id = setTimeout(() => { if (window.lucide) window.lucide.createIcons(); }, 60);
    return () => clearTimeout(id);
  }, [page]);
  // Social links: inside an iframe embed (the site is framed on Wix) a plain
  // target="_blank" is frequently blocked, and the lucide <i> can measure 0px
  // before icons hydrate — so the anchors look dead. Give them a real hit area
  // and open them explicitly, falling back to the top window if popups are blocked.
  React.useEffect(() => {
    const onClick = (e) => {
      const a = e.target.closest && e.target.closest('a[href^="https://www.facebook.com"], a[href^="https://www.linkedin.com"], a[href^="https://www.instagram.com"]');
      if (!a) return;
      e.preventDefault();
      const href = a.getAttribute('href');
      const w = window.open(href, '_blank', 'noopener');
      if (!w) { try { window.top.location.href = href; } catch (err) { window.location.href = href; } }
    };
    document.addEventListener('click', onClick);
    return () => document.removeEventListener('click', onClick);
  }, []);
  let view = null;
  if (page === 'home') view = <window.HomePage go={go} countUp={t.countUp} />;
  else if (page.startsWith('properties-')) view = <window.PropertiesPage status={page.replace('properties-', '')} go={go} />;
  else if (page === 'daniel-hirth') view = <window.ProfilePage go={go} />;
  else if (page === 'about-team') view = <window.TeamPage go={go} />;
  else if (page === 'about-services') view = <window.ServicesPage go={go} />;
  else if (page === 'about-testimonials') view = <window.TestimonialsPage />;
  else view = <window.ContactPage />;

  return (
    <div>
      <div className="world-bg" aria-hidden="true">
        <div className="world-zoom">
          <div className="world-pan">
            <div className="world-map" data-cursor-par="-24"></div>
          </div>
        </div>
      </div>
      <div className="world-aurora" aria-hidden="true"></div>
      <div className="world-veil" aria-hidden="true"></div>
      <div aria-hidden="true">
        <div className="par-wrap" data-cursor-par="-52"><div className="orb orb1"></div></div>
        <div className="par-wrap" data-cursor-par="34"><div className="orb orb2"></div></div>
        <div className="par-wrap" data-cursor-par="-20"><div className="orb orb3"></div></div>
      </div>
      <NavBar
        active={page === 'daniel-hirth' ? 'about-team' : page}
        transparent={page === 'home'}
        logoSrc="assets/logo-hirth-white.png"
        onNavigate={go}
      />
      <div className="page-anim" key={page} style={{ position: 'relative', zIndex: 1 }}>
        {view}
        <SiteFooter logoSrc="assets/logo-hirth-white.png" onNavigate={go} />
      </div>
      <TweaksPanel>
        <TweakSection label="Design" />
        <TweakRadio label="Headlines" value={t.look} options={['premium', 'classic']}
                    onChange={(v) => setTweak('look', v)} />
        <TweakColor label="Accent" value={t.accent} options={['#1b9cd8', '#0e6e9e', '#8a97a0']}
                    onChange={(v) => setTweak('accent', v)} />
        <TweakSlider label="3D depth" value={t.depth3d} min={0} max={2} step={0.1}
                     onChange={(v) => setTweak('depth3d', v)} />
        <TweakSection label="Hero" />
        <TweakSlider label="Map darkness" value={t.scrim} min={0.3} max={1} step={0.02}
                     onChange={(v) => setTweak('scrim', v)} />
        <TweakSection label="Motion" />
        <TweakToggle label="Animate stats" value={t.countUp}
                     onChange={(v) => setTweak('countUp', v)} />
      </TweaksPanel>
      <ListingModal listing={selected} onClose={() => setSelected(null)} go={go} />
      <FlyerViewer listing={flyer} onClose={() => setFlyer(null)} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
