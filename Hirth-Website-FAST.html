   Imports only; see tokens/ for the actual definitions. */

/* The Hirth Group — webfonts (self-hosted)
   Display: Marcellus (single weight, 400) — engraved-Roman serif, used for
   headlines, stat figures, and the wordmark feel.
   UI/Body: Archivo (variable, 400–700) — sober grotesque for everything else.
   NOTE: substitutions — the live Wix site uses generic system/Wix fonts; these
   were chosen to match the engraved serif of the HIRTH wordmark. */

@font-face {
  font-family: 'Marcellus';
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("assets/bundled/957dc9fb-6296-4db7-b00d-0ce444bede33.woff2") format('woff2');
}

@font-face {
  font-family: 'Archivo';
  font-style: normal;
  font-weight: 400 700;

  src: url("assets/bundled/9361c899-233d-411b-a131-ced6d7591dda.woff2") format('woff2-variations');
}

/* The Hirth Group — color tokens
   Drawn from the brand mark: Hirth blue + silver on deep slate-navy. */

:root {
  /* ---- Base: navy (brand ink) ---- */
  --navy-950: #0c161c;
  --navy-900: #14242e;   /* primary dark surface — logo background */
  --navy-800: #1c313e;
  --navy-700: #28414f;
  --navy-600: #3a5565;
  --navy-500: #4f6b7c;

  /* ---- Base: Hirth blue (brand accent) ---- */
  --blue-700: #0e6e9e;
  --blue-600: #1485bd;
  --blue-500: #1b9cd8;   /* logo blue */
  --blue-400: #4cb4e2;
  --blue-100: #d9eef9;
  --blue-50:  #edf7fc;

  /* ---- Expanded jewel palette — warmth & variety against the blue.
     Used as product-type and section accents; blue stays the primary brand. ---- */
  --gold-800:  #7d5d28;
  --gold-700:  #9c7434;
  --gold-600:  #b08a3e;   /* on-light gold text */
  --gold-500:  #cda35f;   /* brass — premium/value */
  --gold-400:  #d9b574;
  --gold-300:  #e6c992;
  --gold-200:  #efd9ab;   /* bright gold on navy */
  --gold:      #cda35f;   /* alias → brass */
  --emerald-700: #1f7a4d;
  --emerald-500: #2f9d6e;  /* multifamily / closed-won */
  --emerald-300: #6fc79e;
  --teal-700:  #0d6e72;
  --teal-500:  #169aa0;
  --teal-400:  #2bb6bb;    /* office */
  --terra-700: #a3552e;
  --terra-500: #c8743f;    /* land / retail warmth */
  --terra-300: #e0a274;
  --plum-500:  #7b6aa0;    /* mixed-use */
  --plum-400:  #9a89c0;

  /* ---- Product-type accents (listings, services, submarkets) ---- */
  --type-retail:      #c8743f;  /* terracotta */
  --type-industrial:  #5b7a8c;  /* steel */
  --type-office:      #2bb6bb;  /* teal */
  --type-multifamily: #2f9d6e;  /* emerald */
  --type-land:        #cda35f;  /* brass */
  --type-mixed:       #7b6aa0;  /* plum */


  /* ---- Base: silver / slate neutrals ---- */
  --grey-900: #20272c;
  --grey-700: #46525a;
  --grey-500: #75828b;
  --grey-400: #98a3ab;   /* logo silver */
  --grey-300: #c2cad0;
  --grey-200: #dde2e6;
  --grey-100: #eceff1;
  --grey-50:  #f5f7f8;
  --white:    #ffffff;
  --paper:    #fafbfb;   /* page background */

  /* ---- Semantic: surfaces ---- */
  --surface-page:    var(--paper);
  --surface-card:    var(--white);
  --surface-subtle:  var(--grey-50);
  --surface-inverse: var(--navy-900);
  --surface-inverse-raised: var(--navy-800);
  --surface-accent-tint: var(--blue-50);

  /* ---- Semantic: text ---- */
  --text-primary:   var(--navy-900);
  --text-secondary: var(--grey-700);
  --text-muted:     var(--grey-500);
  --text-accent:    var(--blue-600);
  --text-inverse:   #f4f7f9;
  --text-inverse-secondary: #aebfc9;

  /* ---- Semantic: borders & lines ---- */
  --border-subtle:  var(--grey-200);
  --border-strong:  var(--grey-300);
  --border-inverse: rgba(255, 255, 255, 0.14);
  --rule-accent:    var(--blue-500); /* short accent rules under headings */

  /* ---- Semantic: interactive ---- */
  --action-primary:        var(--navy-900);
  --action-primary-hover:  var(--navy-800);
  --action-accent:         var(--blue-500);
  --action-accent-hover:   var(--blue-600);
  --focus-ring:            rgba(27, 156, 216, 0.45);

  /* ---- Semantic: status (used sparingly — listing states) ---- */
  --status-available: var(--blue-600);
  --status-closed:    #1f7a4d;
  --status-leased:    var(--grey-500);
}

/* The Hirth Group — typography tokens */

:root {
  /* ---- Families ---- */
  --font-display: 'Marcellus', 'Times New Roman', serif;
  --font-sans: 'Archivo', 'Helvetica Neue', Helvetica, Arial, sans-serif;

  /* ---- Sizes (desktop reference, 1440 grid) ---- */
  --text-display-xl: 64px;  /* hero headline, big stats */
  --text-display:    48px;  /* page titles */
  --text-h2:         36px;  /* section titles */
  --text-h3:         26px;  /* card / sub-section titles */
  --text-h4:         20px;  /* minor headings */
  --text-body-lg:    18px;  /* lead paragraphs, bios */
  --text-body:       16px;  /* default */
  --text-small:      14px;  /* meta, captions */
  --text-caption:    12px;  /* legal, license lines */
  --text-eyebrow:    13px;  /* uppercase kickers */

  /* ---- Line heights ---- */
  --leading-display: 1.08;
  --leading-heading: 1.2;
  --leading-body:    1.65;
  --leading-tight:   1.4;

  /* ---- Tracking ---- */
  --tracking-display: 0.01em;   /* Marcellus is wide already */
  --tracking-eyebrow: 0.22em;   /* uppercase kickers, nav links */
  --tracking-caps:    0.12em;   /* uppercase buttons, labels */
  --tracking-body:    0;

  /* ---- Weights (Archivo variable) ---- */
  --weight-regular:  400;
  --weight-medium:   500;
  --weight-semibold: 600;
  --weight-bold:     700;
}

/* The Hirth Group — spacing, radius, shadow, motion tokens */

:root {
  /* ---- Spacing (8px base) ---- */
  --space-1:  4px;
  --space-2:  8px;
  --space-3:  12px;
  --space-4:  16px;
  --space-5:  24px;
  --space-6:  32px;
  --space-7:  48px;
  --space-8:  64px;
  --space-9:  96px;
  --space-10: 128px;  /* section rhythm on desktop */

  /* ---- Layout ---- */
  --container-max: 1200px;
  --container-pad: 32px;
  --section-gap: var(--space-10);

  /* ---- Radii — near-square; the brand is architectural ---- */
  --radius-xs: 2px;   /* buttons, inputs, tags */
  --radius-sm: 3px;   /* cards */
  --radius-md: 4px;   /* images inside cards */
  --radius-pill: 999px; /* avatar only */

  /* ---- Shadows — low, cool, restrained ---- */
  --shadow-card: 0 1px 2px rgba(15, 30, 39, 0.06), 0 4px 16px rgba(15, 30, 39, 0.06);
  --shadow-card-hover: 0 2px 4px rgba(15, 30, 39, 0.08), 0 12px 32px rgba(15, 30, 39, 0.12);
  --shadow-overlay: 0 8px 40px rgba(15, 30, 39, 0.22);

  /* ---- Motion ---- */
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1); /* @kind other */
  --duration-fast: 150ms; /* @kind other */
  --duration-base: 250ms; /* @kind other */
  --duration-slow: 450ms; /* @kind other */
}

/* The Hirth Group — minimal base element styles for cards, kits, and templates. */

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: var(--font-sans);
  font-size: var(--text-body);
  line-height: var(--leading-body);
  color: var(--text-primary);
  background: var(--surface-page);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

h1, h2, h3 {
  font-family: var(--font-display);
  font-weight: 400;
  line-height: var(--leading-heading);
  letter-spacing: var(--tracking-display);
  margin: 0;
}

h4, h5, h6 {
  font-family: var(--font-sans);
  font-weight: var(--weight-semibold);
  line-height: var(--leading-tight);
  margin: 0;
}

p { margin: 0; }

a {
  color: var(--text-accent);
  text-decoration: none;
  transition: color var(--duration-fast) var(--ease-out);
}
a:hover { color: var(--blue-700); }

img { display: block; max-width: 100%; }

::selection { background: var(--blue-100); }

(() => {

    const zoom = document.querySelector('.world-zoom');

    last = now;
    if (Math.abs(target - cur) > 0.0002) {
      requestAnimationFrame(loop);

      cur = target;
      running = false;
      last = 0;

    const dh = Math.max(document.documentElement.scrollHeight - window.innerHeight, 1);
