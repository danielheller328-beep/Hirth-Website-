name: Publish newest uploaded website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-newest-website
  cancel-in-progress: true

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the complete repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make the newest uploaded website the live index
        id: publish
        shell: bash
        run: |
          set -euo pipefail

          is_website_file() {
            local file="$1"
            local lower="${file,,}"

            [[ -f "$file" ]] || return 1

            # The suite lives at /suite and the post maker at /flyers. Both are
            # full HTML documents, so without this guard a push that rebuilds
            # either would be mistaken for a new website upload and copied over
            # index.html — replacing the public site with an internal tool.
            [[ "$file" == flyers/* ]] && return 1
            [[ "$file" == suite/* ]] && return 1

            [[ "$lower" == *.zip ]] && return 0

            # A website upload can have any filename. Detect HTML by its content.
            [[ $(stat -c '%s' "$file") -le 52428800 ]] || return 1
            head -c 8192 "$file" | LC_ALL=C grep -Eiq '<!doctype[[:space:]]+html|<html([[:space:]>])'
          }

          candidates=()

          if [[ "${{ github.event_name }}" == "push" ]]; then
            before="${{ github.event.before }}"
            after="${{ github.sha }}"

            if [[ "$before" =~ ^0+$ ]] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
              while IFS= read -r -d '' file; do
                is_website_file "$file" && candidates+=("$file")
              done < <(git diff-tree --root --no-commit-id --name-only -r -z "$after")
            else
              while IFS= read -r -d '' file; do
                is_website_file "$file" && candidates+=("$file")
              done < <(git diff --name-only --diff-filter=AMR -z "$before" "$after")
            fi
          else
            # Manual runs publish the most recently committed website file.
            newest_time=0
            newest_file=""
            while IFS= read -r -d '' file; do
              if is_website_file "$file"; then
                file_time=$(git log -1 --format='%ct' -- "$file")
                if (( file_time >= newest_time )); then
                  newest_time=$file_time
                  newest_file="$file"
                fi
              fi
            done < <(git ls-files -z)
            [[ -n "$newest_file" ]] && candidates+=("$newest_file")
          fi

          if (( ${#candidates[@]} == 0 )); then
            echo "No new HTML website or ZIP package was found. Other uploaded assets are already live."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # When a push includes index.html, it is always the intended website.
          # Otherwise, use the last website file in that push, regardless of name.
          site_file="${candidates[${#candidates[@]}-1]}"
          for candidate in "${candidates[@]}"; do
            if [[ "${candidate##*/}" == "index.html" ]]; then
              site_file="$candidate"
            fi
          done

          echo "Publishing: $site_file"
          lower_site_file="${site_file,,}"

          if [[ "$lower_site_file" == *.zip ]]; then
            extract_dir=$(mktemp -d)
            trap 'rm -rf "$extract_dir"' EXIT

            python3 - "$site_file" "$extract_dir" <<'PY'
          import pathlib
          import sys
          import zipfile

          archive = pathlib.Path(sys.argv[1])
          destination = pathlib.Path(sys.argv[2]).resolve()

          with zipfile.ZipFile(archive) as package:
              for member in package.infolist():
                  target = (destination / member.filename).resolve()
                  if destination != target and destination not in target.parents:
                      raise SystemExit(f"Unsafe ZIP path: {member.filename}")
              package.extractall(destination)
          PY

            mapfile -d '' packaged_html < <(
              find "$extract_dir" -type f -print0 | while IFS= read -r -d '' file; do
                head -c 8192 "$file" | LC_ALL=C grep -Eiq '<!doctype[[:space:]]+html|<html([[:space:]>])' && printf '%s\0' "$file"
              done
            )

            if (( ${#packaged_html[@]} == 0 )); then
              echo "The uploaded ZIP does not contain a website HTML file." >&2
              exit 1
            fi

            packaged_index=""
            for candidate in "${packaged_html[@]}"; do
              if [[ "${candidate##*/}" == "index.html" ]]; then
                packaged_index="$candidate"
                break
              fi
            done
            [[ -n "$packaged_index" ]] || packaged_index="${packaged_html[0]}"

            package_root=$(dirname "$packaged_index")
            tar -C "$package_root" --exclude='.git' --exclude='.github' -cf - . | tar -xf -
            cp "$packaged_index" index.html
          elif [[ "$site_file" != "index.html" ]]; then
            cp "$site_file" index.html
          fi

          # GitHub Pages can ignore underscore-prefixed files; use the safe bundle name.
          if [[ -f _ds_bundle.js && ! -f ds-bundle.js ]]; then
            cp _ds_bundle.js ds-bundle.js
          fi
          sed -i 's|src="_ds_bundle\.js"|src="ds-bundle.js"|g' index.html
          touch .nojekyll
          printf '%s\n' "$site_file" > .published-source

          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "site_file=$site_file" >> "$GITHUB_OUTPUT"

      - name: Commit the live website
        if: steps.publish.outputs.published == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "The uploaded file is already the live website."
            exit 0
          fi

          git commit -m "Publish newest website: ${{ steps.publish.outputs.site_file }}"
          git push
