name: Publish newest website upload

on:
  push:
    branches:
      - main
    paths:
      - "**/*.html"
      - "**/*.zip"
      - ".github/workflows/publish-latest-html.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-newest-website
  cancel-in-progress: true

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find and prepare newest website upload
        id: newest
        shell: bash
        run: |
          set -euo pipefail

          latest_file=""
          latest_time=0

          while IFS= read -r -d '' file; do
            if [[ "$file" == "index.html" ]]; then
              continue
            fi

            commit_time=$(git log -1 --format=%ct -- "$file")
            commit_time=${commit_time:-0}

            if (( commit_time >= latest_time )); then
              latest_file="$file"
              latest_time=$commit_time
            fi
          done < <(git ls-files -z '*.html' '*.zip')

          if [[ -z "$latest_file" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "No website HTML or ZIP upload was found."
            exit 0
          fi

          lower_file="${latest_file,,}"

          if [[ "$lower_file" == *.zip ]]; then
            extract_dir=$(mktemp -d)
            unzip -q "$latest_file" -d "$extract_dir"

            site_index=$(find "$extract_dir" -type f -iname 'index.html' -print -quit)
            if [[ -z "$site_index" ]]; then
              site_index=$(find "$extract_dir" -type f -iname '*.html' -print -quit)
            fi

            if [[ -z "$site_index" ]]; then
              echo "The newest ZIP does not contain an HTML website." >&2
              exit 1
            fi

            site_root=$(dirname "$site_index")
            rsync -a \
              --exclude '.git' \
              --exclude '.github' \
              --exclude 'CNAME' \
              "$site_root/" ./
            cp -- "$site_index" index.html
          else
            cp -- "$latest_file" index.html
          fi

          # GitHub Pages and some browsers block underscore-prefixed bundles.
          # Publish this design-system bundle under a normal public filename.
          if [[ -f "_ds_bundle.js" ]]; then
            cp -- "_ds_bundle.js" "ds-bundle.js"
            sed -i 's|src="_ds_bundle.js"|src="ds-bundle.js"|g' index.html
            sed -i "s|src='_ds_bundle.js'|src='ds-bundle.js'|g" index.html
          fi

          touch .nojekyll

          echo "Prepared $latest_file as the live website"
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "source=$latest_file" >> "$GITHUB_OUTPUT"

      - name: Publish website
        if: steps.newest.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "The live website already matches the newest upload."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish newest website: ${{ steps.newest.outputs.source }}"
          git push
