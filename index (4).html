<script type="text/babel">
const { NavBar, SiteFooter } = window.HirthGroupDesignSystem_c76dea;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "look": "premium",
  "accent": "#1b9cd8",
  "scrim": 0.78,
  "countUp": true,
  "depth3d": 2
}/*EDITMODE-END*/;

// Accent options: logo blue / deep harbor blue / steel silver. Each maps to a
// full set of semantic accent tokens so links, rules, tags, and CTAs follow.
const ACCENTS = {
  '#1b9cd8': { 500: '#1b9cd8', 600: '#1485bd', 700: '#7cc6e6', 400: '#4cb4e2', 100: 'rgba(27,156,216,0.3)', 50: 'rgba(27,156,216,0.12)' },
  '#0e6e9e': { 500: '#0e6e9e', 600: '#0b5a82', 700: '#6fb3d4', 400: '#3f93bd', 100: 'rgba(14,110,158,0.32)', 50: 'rgba(14,110,158,0.14)' },
  '#8a97a0': { 500: '#8a97a0', 600: '#6e7d88', 700: '#bcc7ce', 400: '#a8b3bb', 100: 'rgba(138,151,160,0.3)', 50: 'rgba(138,151,160,0.12)' },
};

function applyTweaks(t) {
  const r = document.documentElement.style;
  // Look: 'premium' (Marcellus serif) vs 'classic' — plain sans headlines like the current Wix site.
  r.setProperty('--font-display', t.look === 'classic'
    ? "'Archivo', 'Helvetica Neue', Helvetica, Arial, sans-serif"
    : "'Marcellus', 'Times New Roman', serif");
  r.setProperty('--tracking-display', t.look === 'classic' ? '0.06em' : '0.01em');
  const a = ACCENTS[t.accent] || ACCENTS['#1b9cd8'];
  r.setProperty('--blue-500', a[500]); r.setProperty('--blue-600', a[600]);
  r.setProperty('--blue-700', a[700]); r.setProperty('--blue-400', a[400]);
  r.setProperty('--blue-100', a[100]); r.setProperty('--blue-50', a[50]);
  r.setProperty('--scrim-a', String(t.scrim));
  r.setProperty('--depth-3d', String(t.depth3d));
  window.__tiltDepth = t.depth3d;
}

// Listing detail overlay — wired so PropertyCard clicks always open it.
// Exception: a listing with a `flyer` PDF opens a full-screen in-context PDF
// viewer (window.open to a relative path loses the preview token).
const listingHolder = { open: null };
const flyerHolder = { open: null };
window.HirthOpenListing = (l) => {
  if (l && l.flyer) { if (flyerHolder.open) flyerHolder.open(l); return; }
  if (listingHolder.open) listingHolder.open(l);
};
window.HirthOpenFlyer = (l) => { if (flyerHolder.open) flyerHolder.open(l); };

function flyerFilename(listing) {
  return (listing.title || 'Hirth-Group-Listing').replace(/[^a-z0-9]+/gi, '-').replace(/^-|-$/g, '') + '-Lease-Flyer.pdf';
}

// Robust cross-device download: fetch the PDF as a blob and save it via a
// temporary anchor (works in sandboxed iframes where a bare download attr is
// ignored). Falls back to opening the file in a new tab if fetch is blocked.
async function downloadFlyer(listing) {
  const url = listing.flyer;
  const name = flyerFilename(listing);
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const blob = await res.blob();
    const obj = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = obj; a.download = name;

  // ?go=<page> is how 404.html hands off legacy Wix deep links.
  const initialPage = (() => {
    try {
      const q = new URLSearchParams(location.search).get('go');
      const valid = ['home', 'properties-for-sale', 'properties-for-lease', 'properties-closed', 'properties-leased', 'daniel-hirth', 'about-team', 'about-services', 'about-testimonials', 'contact'];
      if (q && valid.indexOf(q) !== -1) {
        localStorage.setItem('hirth-kit-page', q);
        history.replaceState(null, '', location.pathname);
        return q;
      }
    } catch (err) {}
    return localStorage.getItem('hirth-kit-page') || 'home';
  })();
  const [page, setPage] = React.useState(initialPage);
  const depthRef = React.useRef(1);
  const go = (p) => {
    setPage(p);
    localStorage.setItem('hirth-kit-page', p);
    window.scrollTo({ top: 0 });
    try {
      depthRef.current += 1;
      history.pushState({ hirth: 1, page: p, depth: depthRef.current }, '');
    } catch (err) {}
  };
  // The device/browser Back button navigates WITHIN the site only. On load we seed
  // two same-document history entries, so Back always has one of ours to land on;
  // landing on the seed entry re-seeds it, so Back can never walk off the site.
  const modalsRef = React.useRef({});
  React.useEffect(() => {
    const cur = initialPage;
    try {
      history.replaceState({ hirth: 1, page: cur, depth: 0 }, '');
      history.pushState({ hirth: 1, page: cur, depth: 1 }, '');
    } catch (err) {}
    depthRef.current = 1;
    const reseed = (p, d) => { try { history.pushState({ hirth: 1, page: p, depth: d }, ''); } catch (err) {} };
    const onPop = (e) => {
      const st = e.state;
      const m = modalsRef.current;
      // An open overlay swallows Back first.
      if (m.selected || m.flyer) {
        if (m.setSelected) m.setSelected(null);
        if (m.setFlyer) m.setFlyer(null);
        reseed(st && st.hirth ? st.page : page, depthRef.current);
        return;
      }
      if (st && st.hirth) {
        if (st.depth === 0) { reseed(st.page, 1); depthRef.current = 1; return; }
        depthRef.current = st.depth;
        setPage(st.page);
        localStorage.setItem('hirth-kit-page', st.page);
        window.scrollTo({ top: 0 });
        return;
      }
      // Foreign / missing state — stay put.
      reseed(page, depthRef.current);
    };
    window.addEventListener('popstate', onPop);
    return () => window.removeEventListener('popstate', onPop);
  }, []);
  React.useEffect(() => { modalsRef.current = { selected, flyer, setSelected, setFlyer }; });
  React.useEffect(() => {
    const heavy = page === 'properties-closed' || page === 'properties-leased';
    document.documentElement.classList.toggle('heavy-page', heavy);
  }, [page]);
  React.useEffect(() => {
    const id = setTimeout(() => { if (window.lucide) window.lucide.createIcons(); }, 60);
    return () => clearTimeout(id);
  }, [page]);
  // Social links: inside an iframe embed (the site is framed on Wix) a plain
  // target="_blank" is frequently blocked, and the lucide <i> can measure 0px
  // before icons hydrate — so the anchors look dead. Give them a real hit area
  // and open them explicitly, falling back to the top window if popups are blocked.
  React.useEffect(() => {
    const onClick = (e) => {
      const a = e.target.closest && e.target.closest('a[href]');
      if (!a) return;
      const href = a.getAttribute('href') || '';
      if (!/^https?:/i.test(href)) return;
      let sameSite = false;
      try { sameSite = new URL(href, location.href).host === location.host; } catch (err) {}
      if (sameSite) return;
      // Off-site link: open in a new tab and leave this window exactly where it is.
      e.preventDefault();
      e.stopPropagation();
      a.setAttribute('target', '_blank');
      a.setAttribute('rel', 'noopener noreferrer');
      window.open(href, '_blank', 'noopener,noreferrer');
    };
    document.addEventListener('click', onClick);
    return () => document.removeEventListener('click', onClick);
  }, []);
  let view = null;
  if (page === 'home') view = <window.HomePage go={go} countUp={t.countUp} />;
  else if (page.startsWith('properties-')) view = <window.PropertiesPage status={page.replace('properties-', '')} go={go} />;
  else if (page === 'daniel-hirth') view = <window.ProfilePage go={go} />;
  else if (page === 'about-team') view = <window.TeamPage go={go} />;
  else if (page === 'about-services') view = <window.ServicesPage go={go} />;
  else if (page === 'about-testimonials') view = <window.TestimonialsPage />;
  else view = <window.ContactPage />;

  return (
    <div>
      <div className="world-bg" aria-hidden="true">
        <div className="world-zoom">
          <div className="world-pan">
            <div className="world-map" data-cursor-par="-24"></div>
          </div>
        </div>
      </div>
      <div className="world-aurora" aria-hidden="true"></div>
      <div className="world-veil" aria-hidden="true"></div>
      <div aria-hidden="true">
        <div className="par-wrap" data-cursor-par="-52"><div className="orb orb1"></div></div>
        <div className="par-wrap" data-cursor-par="34"><div className="orb orb2"></div></div>
        <div className="par-wrap" data-cursor-par="-20"><div className="orb orb3"></div></div>
      </div>
      <NavBar
        active={page === 'daniel-hirth' ? 'about-team' : page}
        transparent={page === 'home'}
        logoSrc="assets/logo-hirth-white.png"
        onNavigate={go}
      />
      <div className="page-anim" key={page} style={{ position: 'relative', zIndex: 1 }}>
        {view}
        <SiteFooter logoSrc="assets/logo-hirth-white.png" onNavigate={go} />
      </div>
      <TweaksPanel>
        <TweakSection label="Design" />
        <TweakRadio label="Headlines" value={t.look} options={['premium', 'classic']}
                    onChange={(v) => setTweak('look', v)} />
        <TweakColor label="Accent" value={t.accent} options={['#1b9cd8', '#0e6e9e', '#8a97a0']}
                    onChange={(v) => setTweak('accent', v)} />
        <TweakSlider label="3D depth" value={t.depth3d} min={0} max={2} step={0.1}
                     onChange={(v) => setTweak('depth3d', v)} />
        <TweakSection label="Hero" />
        <TweakSlider label="Map darkness" value={t.scrim} min={0.3} max={1} step={0.02}
                     onChange={(v) => setTweak('scrim', v)} />
        <TweakSection label="Motion" />
        <TweakToggle label="Animate stats" value={t.countUp}
                     onChange={(v) => setTweak('countUp', v)} />
      </TweaksPanel>
      <ListingModal listing={selected} onClose={() => setSelected(null)} go={go} />
      <FlyerViewer listing={flyer} onClose={() => setFlyer(null)} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
