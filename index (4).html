<style>
  /* ---- ELITE DARK THEME — zero plain white anywhere on this site ---- */
  :root {

      linear-gradient(160deg, #162935 0%, #0a141a 100%);

    --surface-accent-tint: rgba(27,156,216,0.1);

  /* ---- Premium service cards ---- */  .svc-card { display: block; text-decoration: none; background: var(--surface-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); overflow: hidden; box-shadow: var(--shadow-card); position: relative; transition: transform 0.4s var(--ease-out), box-shadow 0.4s var(--ease-out); will-change: transform; }

  .svc-card:hover .svc-badge { transform: translateY(-3px) rotate(-4deg); }
  .svc-cta .svc-arrow { display: inline-block; transition: transform 0.3s var(--ease-out); }

  .mk { position: absolute; transform: translate(-50%, -50%); }
  .mk-dot { display: block; width: 9px; height: 9px; border-radius: 50%; background: var(--blue-400); box-shadow: 0 0 14px 3px color-mix(in srgb, var(--blue-500) 75%, transparent); }
  .mk-ring { position: absolute; left: 50%; top: 50%; width: 36px; height: 36px; margin: -18px 0 0 -18px; border-radius: 50%; border: 1px solid var(--blue-400); opacity: 0; }
  .mk-lbl { position: absolute; left: 15px; top: -5px; font: 500 10px var(--font-sans); letter-spacing: 0.18em; text-transform: uppercase; color: rgba(255,255,255,0.88); white-space: nowrap; text-shadow: 0 1px 5px rgba(0,0,0,0.85); }
  @media (prefers-reduced-motion: no-preference) {
    .mk-ring { animation: mkpulse 3.2s var(--ease-out) infinite; }
  }
  @keyframes mkpulse {
    0% { transform: scale(0.35); opacity: 0.85; }
    70% { transform: scale(1.1); opacity: 0; }
    100% { transform: scale(1.1); opacity: 0; }
  }

  /* ---- Scroll reveal: 3D rise-in for cards/maps. Hidden state only applies
     when html.anim-ok is set — and that class is added from inside a
     requestAnimationFrame callback, so any context where frames don't run
     (hidden iframes, DOM captures, print/export) shows everything instead. ---- */
  @media (prefers-reduced-motion: no-preference) {
    html.anim-ok .reveal3d:not([data-in]) { opacity: 0; transform: perspective(1100px) rotateX(calc(var(--depth-3d, 1) * 12deg)) translateY(64px) scale(0.97); }
    html.anim-ok .reveal3d[data-in] { opacity: 1; transform: perspective(1100px) rotateX(0deg) translateY(0) scale(1); transition: transform 0.9s var(--ease-out), opacity 0.9s var(--ease-out); }
    html.anim-ok .reveal3d[data-done] { transition: transform 0.3s var(--ease-out), box-shadow 0.3s var(--ease-out); }

    /* soft text/blocks reveal — rise + focus pull */
    html.anim-ok .reveal-up:not([data-in]) { opacity: 0; transform: translateY(38px); filter: blur(9px); }
    html.anim-ok .reveal-up[data-in] { opacity: 1; transform: none; filter: none; transition: opacity 0.95s var(--ease-out), transform 0.95s var(--ease-out), filter 0.95s var(--ease-out); }

    /* cinematic variants for the About / profile section */
    html.anim-ok .reveal-clip:not([data-in]) { opacity: 0; clip-path: inset(0 0 100% 0); transform: scale(1.08) translateY(28px); filter: blur(6px); }
    html.anim-ok .reveal-clip[data-in] { opacity: 1; clip-path: inset(0 0 0 0); transform: none; filter: none; transition: clip-path 1.4s var(--ease-out), opacity 0.9s var(--ease-out), transform 1.4s var(--ease-out), filter 1.1s var(--ease-out); }
    /* gold light-sweep that crosses the portrait as it unveils */
    .cinema-sweep { position: absolute; inset: 0; z-index: 4; pointer-events: none; overflow: hidden; }
    .cinema-sweep::before { content: ''; position: absolute; top: -40%; left: -60%; width: 45%; height: 180%; transform: rotate(18deg) translateX(-40px); background: linear-gradient(90deg, transparent, rgba(239,217,171,0.55), transparent); opacity: 0; }
    html.anim-ok .reveal-clip[data-in] .cinema-sweep::before { animation: cinemaSweep 1.5s var(--ease-out) 0.5s both; }
    @keyframes cinemaSweep { 0% { opacity: 0; left: -60%; } 30% { opacity: 1; } 100% { opacity: 0; left: 130%; } }
    html.anim-ok .reveal-left:not([data-in]) { opacity: 0; transform: translateX(-46px); filter: blur(8px); }
    html.anim-ok .reveal-left[data-in] { opacity: 1; transform: none; filter: none; transition: opacity 0.9s var(--ease-out), transform 1s var(--ease-out), filter 0.9s var(--ease-out); }
    html.anim-ok .reveal-right:not([data-in]) { opacity: 0; transform: translateX(46px); filter: blur(8px); }
    html.anim-ok .reveal-right[data-in] { opacity: 1; transform: none; filter: none; transition: opacity 0.9s var(--ease-out), transform 1s var(--ease-out), filter 0.9s var(--ease-out); }
    /* line-by-line bio rise — children stagger via --i */
    html.anim-ok .reveal-lines:not([data-in]) > * { opacity: 0; transform: translateY(26px); }
    html.anim-ok .reveal-lines[data-in] > * { opacity: 1; transform: none; transition: opacity 0.8s var(--ease-out), transform 0.8s var(--ease-out); transition-delay: calc(var(--i, 0) * 110ms); }

    /* page-to-page transition — every navigation glides in */
    html.anim-ok .page-anim { animation: pageIn 0.7s var(--ease-out) both; }
  }
  @keyframes pageIn { from { opacity: 0; transform: translateY(30px); filter: blur(8px); } to { opacity: 1; transform: none; filter: none; } }
  /* ---- Map color grade: kill the brown — every map reads in brand blue ---- */
  .map-tint { filter: grayscale(1) sepia(0.9) hue-rotate(165deg) saturate(2.1) brightness(0.85) contrast(1.06); }

  /* ---- Section textures: faint blue map + watermark mark ---- */
  .texture-map { position: relative; }
  .texture-map::before { content: ''; position: absolute; inset: 0; background: url('assets/maps/la-hero-dark.jpg') center / cover; opacity: 0.12; filter: grayscale(1) sepia(0.9) hue-rotate(165deg) saturate(2) brightness(0.75); pointer-events: none; }
  .texture-map > * { position: relative; z-index: 1; }
  .watermark-logo { position: relative; overflow: hidden; }
  .watermark-logo { position: relative; overflow: hidden; }
  .watermark-logo::after {
    content: ''; position: absolute; right: 56px; top: 50%; transform: translateY(-50%);
    width: 480px; height: 480px; max-width: 42%; pointer-events: none;
    /* the white logo PNG is used as an alpha mask, then filled with a gold gradient
       so the Hirth mark reads as a warm gold watermark on every band it sits on */
    -webkit-mask: url('assets/logo-hirth-white.png') center / contain no-repeat;
    mask: url('assets/logo-hirth-white.png') center / contain no-repeat;
    background: linear-gradient(135deg, var(--gold-500) 0%, var(--gold-200) 55%, var(--gold-500) 100%);
    opacity: 0.16;
  }
  .watermark-logo.on-light::after { opacity: 0.12; }

  /* ---- Ghost type — giant engraved serif words behind sections ---- */
  .ghost-word { position: absolute; right: 8px; top: 14px; z-index: 0; font-family: var(--font-display); font-size: clamp(110px, 13vw, 190px); line-height: 1; letter-spacing: 0.05em; color: rgba(255,255,255,0.018); -webkit-text-stroke: 1px rgba(165,205,230,0.085); pointer-events: none; user-select: none; white-space: nowrap; }
  .ghost-word.gold { -webkit-text-stroke: 1px rgba(205,163,95,0.16); }

  /* gold pops */
  .stat-plus { color: var(--gold) !important; }
  .svc-num { color: var(--gold) !important; opacity: 0.92 !important; }
  .gold-rule { background: linear-gradient(90deg, var(--gold), var(--gold-200)) !important; }
  .gold-text { color: var(--gold) !important; }

  /* ---- Ambient drifting light — the page is never a dead background ---- */
  .orb { position: fixed; border-radius: 50%; filter: blur(90px); pointer-events: none; z-index: 0; mix-blend-mode: screen; }
  .orb1 { width: 560px; height: 560px; background: radial-gradient(circle, rgba(27,156,216,0.3), transparent 65%); top: -160px; right: -140px; }
  .orb2 { width: 480px; height: 480px; background: radial-gradient(circle, rgba(79,107,124,0.28), transparent 65%); bottom: -180px; left: -160px; }
  .orb3 { width: 440px; height: 440px; background: radial-gradient(circle, rgba(205,163,95,0.22), transparent 65%); top: 42%; left: 26%; }
  @media (prefers-reduced-motion: no-preference) {
    html.anim-ok .orb1 { animation: orbA 26s ease-in-out infinite alternate; }
    html.anim-ok .orb2 { animation: orbB 32s ease-in-out infinite alternate; }
    html.anim-ok .orb3 { animation: orbA 38s ease-in-out infinite alternate-reverse; }
  }
  @keyframes orbA { from { transform: translate3d(0, 0, 0) scale(1); } to { transform: translate3d(-120px, 90px, 0) scale(1.15); } }
  @keyframes orbB { from { transform: translate3d(0, 0, 0) scale(1); } to { transform: translate3d(140px, -110px, 0) scale(1.1); } }

  /* ---- Planet: pre-tinted real world map in a sphere illusion ---- */
  .dive-layer, .dive-planet-wrap, .dive-planet { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .dive-planet { width: 100%; height: 100%; border-radius: 50%; background-size: 100% 100%; position: relative; overflow: hidden;
    box-shadow: inset -60px -50px 160px rgba(0,0,0,0.78), inset 0 0 120px rgba(8,16,22,0.5); }
  .dive-planet::before { content: ''; position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 32% 26%, rgba(255,255,255,0.13), transparent 46%); z-index: 3; }
  .dive-la-glint { position: absolute; width: 8px; height: 8px; margin: -4px; border-radius: 50%; background: #cfeeff; box-shadow: 0 0 12px 4px rgba(76,180,226,0.9), 0 0 28px 10px rgba(27,156,216,0.5); z-index: 4; }
  @media (prefers-reduced-motion: no-preference) {
    .dive-la-glint { animation: glintPulse 2.2s ease-in-out infinite; }
  }
  @keyframes glintPulse { 0%, 100% { transform: scale(1); opacity: 0.9; } 50% { transform: scale(1.7); opacity: 1; } }
  /* warp-speed star streaks during the plunge — radial lines from LA's screen point */
  .dive-warp { position: absolute; inset: 0; z-index: 29; pointer-events: none; opacity: 0; overflow: hidden; }
  .dive-warp span { position: absolute; left: 50%; top: 50%; width: 2px; height: 22vh; transform-origin: 50% 0; background: linear-gradient(180deg, rgba(255,255,255,0.85), rgba(120,190,240,0.25) 40%, transparent); border-radius: 2px; }
  /* landing flash — a quick bloom as the city resolves */
  .dive-flash { position: absolute; inset: 0; z-index: 31; pointer-events: none; opacity: 0; background: radial-gradient(circle at 50% 48%, rgba(255,255,255,0.9), rgba(205,163,95,0.4) 30%, transparent 62%); }
  .dive-stars { position: absolute; inset: -10%; pointer-events: none;
    background-image:
      radial-gradient(1.6px 1.6px at 25px 35px, rgba(255,255,255,0.9), transparent 60%),
      radial-gradient(1px 1px at 150px 120px, rgba(255,255,255,0.7), transparent 60%),
      radial-gradient(1.2px 1.2px at 80px 210px, rgba(180,220,255,0.65), transparent 60%),
      radial-gradient(0.8px 0.8px at 220px 60px, rgba(255,255,255,0.5), transparent 60%),
      radial-gradient(1px 1px at 310px 170px, rgba(200,230,255,0.55), transparent 60%),
      radial-gradient(1.3px 1.3px at 360px 280px, rgba(255,255,255,0.6), transparent 60%);
    background-size: 420px 420px; will-change: transform, opacity; }
  @media (prefers-reduced-motion: no-preference) {
    .dive-stars { animation: starDrift 90s linear infinite; }
  }
  @keyframes starDrift { from { transform: translate3d(0, 0, 0); } to { transform: translate3d(-420px, -210px, 0); } }

  /* ---- Cinematic Earth → LA dive (scroll-driven; static contexts skip it) ---- */
  .dive-wrap:not(.dive-on) .dive-layer,
  .dive-wrap:not(.dive-on) .dive-planet-wrap,
  .dive-wrap:not(.dive-on) .dive-stars,
  .dive-wrap:not(.dive-on) .dive-label,
  .dive-wrap:not(.dive-on) .dive-hint { display: none !important; }
  .dive-intro { display: none; }
  .dive-on .dive-intro { display: flex; }
  .dive-wrap:not(.dive-on) .dive-sticky { position: relative; min-height: 620px; display: flex; align-items: center; }
  /* static hero must always be visible (no JS reveal needed when dive is off) */
  .dive-wrap:not(.dive-on) .dive-final { opacity: 1 !important; }
  .dive-wrap:not(.dive-on) .dive-final .fx { opacity: 1 !important; transform: none !important; filter: none !important; }
  .dive-wrap.dive-on { height: 100vh; }
  .dive-wrap.dive-on.dive-done { height: 100vh; }
  .dive-on .dive-sticky { position: sticky; top: 0; height: 100vh; }
  /* staged entrance of the final hero content — logo, eyebrow, headline, lede, CTAs */
  .dive-on .dive-final .fx { opacity: 0; transform: translateY(34px); filter: blur(10px); transition: opacity 0.9s var(--ease-out), transform 0.9s var(--ease-out), filter 0.9s var(--ease-out); }
  .dive-on .dive-final.show .fx { opacity: 1; transform: none; filter: none; }
  @media (prefers-reduced-motion: no-preference) {
    .dive-hint > div { animation: divehint 2.2s var(--ease-out) infinite; transform-origin: top center; }
  }
  @keyframes divehint { 0% { transform: scaleY(0); } 45% { transform: scaleY(1); } 100% { transform: scaleY(1); opacity: 0; } }

<script>
// The world map behind the whole site keeps zooming in as you scroll down — the
// descent never truly ends. Eased every frame so stepped wheel input stays fluid.
(() => {
  if (!window.matchMedia('(prefers-reduced-motion: no-preference)').matches) return;
  let cur = 0, last = 0, zoom = null, dh = 1, prev = '';
  // scrollHeight is a layout read — sample it on change, never per frame.
  const measure = () => { dh = Math.max(document.documentElement.scrollHeight - window.innerHeight, 1); };
  window.addEventListener('resize', measure, { passive: true });
  setInterval(() => { if (!document.hidden && !document.documentElement.classList.contains('heavy-page')) measure(); }, 2000);
  let runningZ = false;
  const loop = (now) => {
    if (document.hidden) { runningZ = false; return; }
    if (!zoom) { zoom = document.querySelector('.world-zoom'); if (zoom) measure(); }
    if (!zoom || document.documentElement.classList.contains('heavy-page')) { runningZ = false; return; }
    const sp = Math.min((window.scrollY || 0) / dh, 1);
    const dt = last ? Math.min((now - last) / 1000, 0.05) : 0.016;
    cur += (sp - cur) * (1 - Math.exp(-dt * 6));
    const t = 'translate3d(0,' + (cur * -4).toFixed(2) + 'vh,0) scale(' + (1 + cur * 0.5).toFixed(4) + ')';
    if (t !== prev) { zoom.style.transform = t; prev = t; }
    last = now;
    if (Math.abs(sp - cur) > 0.0004) requestAnimationFrame(loop);
    else runningZ = false;
  };
  // A permanently-running rAF costs work every 16ms even when the page is
  // still. Run only while the eased value is catching up, then park until the
  // next scroll wakes us.
  const wakeZ = () => { if (runningZ || document.hidden) return; runningZ = true; last = 0; requestAnimationFrame(loop); };
  window.addEventListener('scroll', wakeZ, { passive: true });
  window.addEventListener('resize', wakeZ, { passive: true });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) wakeZ(); });
  wakeZ();
})();
(() => {
  const SEL = '.tilt3d, .svc';
  document.addEventListener('pointermove', (e) => {
    const el = e.target.closest && e.target.closest(SEL);
    if (!el) return;
    const depth = window.__tiltDepth === undefined ? 1 : window.__tiltDepth;
    if (!depth) return;
    const r = el.getBoundingClientRect();
    if (!depth || document.documentElement.classList.contains('heavy-page')) return;
    const px = (e.clientX - r.left) / r.width - 0.5;
    const py = (e.clientY - r.top) / r.height - 0.5;
    const max = 9 * depth * sizeDamp;
    el.style.transform = 'perspective(900px) rotateX(' + (-py * max).toFixed(2) + 'deg) rotateY(' + (px * max).toFixed(2) + 'deg) translateY(-4px)';
    if (!el.__tiltBound) {
      el.__tiltBound = true;
      el.addEventListener('pointerleave', () => { el.style.transform = ''; });
    }
  }, { passive: true });

  let heroPar = [], heroTick = 0;
  document.addEventListener('scroll', () => {
    const now = performance.now();
    if (now - heroTick > 500) { heroTick = now; heroPar = [].slice.call(document.querySelectorAll('.hero-par')); }
    if (!heroPar.length) return;
    const y = window.scrollY;
    const depth = window.__tiltDepth === undefined ? 1 : window.__tiltDepth;
    for (let i = 0; i < heroPar.length; i++) heroPar[i].style.transform = 'translateY(' + (y * 0.28 * depth).toFixed(1) + 'px) scale(1.12)';

})();

// Scroll-reveal driver — IntersectionObserver instead of a perpetual
// scroll/resize/mutation + 600ms setInterval sweep (that combo was scanning the
// whole DOM continuously and was a real source of the site feeling laggy).
// Reveal state lives in data attributes so React re-renders (tweaks) can't reset it.
(() => {
  requestAnimationFrame(() => document.documentElement.classList.add('anim-ok'));
  const SEL = '.reveal3d:not([data-in]), .reveal-up:not([data-in]), .reveal-clip:not([data-in]), .reveal-left:not([data-in]), .reveal-right:not([data-in]), .reveal-lines:not([data-in])';
  const io = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      if (!entry.isIntersecting) return;
      const el = entry.target;
      el.setAttribute('data-in', '1');
      setTimeout(() => el.setAttribute('data-done', '1'), 1100);
      io.unobserve(el);
    });

    document.querySelectorAll(SEL).forEach((el) => {
      const vh = window.innerHeight;
      const r = el.getBoundingClientRect();

      // callbacks at all — reveal immediately for anything already in (or near)
      // view instead of depending solely on the observer, so content is never
      // permanently stuck invisible. IO still handles below-the-fold reveal-on-scroll.
      if (vh < 10 || (r.top < vh * 0.95 && r.bottom > 0)) {
        el.setAttribute('data-in', '1');
        setTimeout(() => el.setAttribute('data-done', '1'), 1100);
      } else {
        io.observe(el);
      }
    });
  };
  window.addEventListener('DOMContentLoaded', () => {
    const root = document.getElementById('root');
      let queued = false;
      const scheduleObserve = () => {
        if (queued) return;
        queued = true;
        requestAnimationFrame(() => { queued = false; observeNew(); });
      };
      if (root) new MutationObserver(scheduleObserve).observe(root, { childList: true, subtree: true });

    // never fires in this environment), force everything visible after a beat.
    setTimeout(() => document.querySelectorAll(SEL).forEach((el) => el.setAttribute('data-in', '1')), 1500);
  });

// Cursor: a precise instrument — instant dot + eased hairline ring that opens
// over interactive elements. rAF-gated; desktop pointers only.
(() => {
  if (!window.matchMedia('(pointer: fine)').matches) return;
  window.addEventListener('DOMContentLoaded', () => {
    const dot = document.createElement('div'); dot.className = 'cursor-dot';
    const ring = document.createElement('div'); ring.className = 'cursor-ring';
    document.body.append(dot, ring);

    const parOk = window.matchMedia('(prefers-reduced-motion: no-preference)').matches;
    document.addEventListener('pointermove', (e) => {
      mx = e.clientX; my = e.clientY;

    }, { passive: true });

    document.addEventListener('pointerover', (e) => {
      const hit = e.target.closest && e.target.closest('a, button, input, select, textarea, label, .tilt3d, .svc');
      ring.classList.toggle('big', !!hit);
    }, { passive: true });
    // The parallax layers are a fixed handful of background nodes — resolve them
    // once instead of walking the DOM 60x a second (with 180 cards on the closed
    // page that query alone was the frame budget).
    let parEls = [];
    const collect = () => { parEls = [].slice.call(document.querySelectorAll('[data-cursor-par]')).map((el) => [el, parseFloat(el.getAttribute('data-cursor-par')) || 0]); };
    collect();
    setInterval(() => { if (!document.hidden) collect(); }, 4000);
    let pdot = '', pring = '', ppar = '', lastSettled = null;
    let running = false;
    const loop = () => {
      if (document.hidden) { running = false; return; }
      const restX = Math.abs(mx - rx), restY = Math.abs(my - ry);
      rx += (mx - rx) * 0.22; ry += (my - ry) * 0.22;
      const d = 'translate(' + mx + 'px,' + my + 'px)';
      if (d !== pdot) { dot.style.transform = d; pdot = d; }
      const rg = 'translate(' + rx.toFixed(1) + 'px,' + ry.toFixed(1) + 'px)';
      if (rg !== pring) { ring.style.transform = rg; pring = rg; }
      if (parOk) {
        const tx = mx > -500 ? (mx / window.innerWidth) - 0.5 : 0;
        const ty = my > -500 ? (my / window.innerHeight) - 0.5 : 0;
        nx += (tx - nx) * 0.055; ny += (ty - ny) * 0.055;
        const key = nx.toFixed(4) + ',' + ny.toFixed(4);
        if (key !== ppar) {
          ppar = key;
          for (let i = 0; i < parEls.length; i++) {
            const el = parEls[i][0], f = parEls[i][1];
            el.style.transform = 'translate3d(' + (nx * f).toFixed(2) + 'px,' + (ny * f).toFixed(2) + 'px,0)';
          }
        }
      }
      // Park once the ring has caught the cursor and the parallax has settled;
      // the next pointermove restarts it.
      if (restX > 0.3 || restY > 0.3 || ppar !== lastSettled) { lastSettled = ppar; requestAnimationFrame(loop); }
      else running = false;
    };
    const wake = () => { if (running || document.hidden) return; running = true; requestAnimationFrame(loop); };
    window.addEventListener('pointermove', wake, { passive: true });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) wake(); });
    wake();
  });
})();

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

  { title: '1801 Blake Avenue', meta: 'Los Angeles, CA 90039 · Elysian Valley / Frogtown', status: 'for-sale', image: S + '1801-blake.jpg', gallery: [S + '1801-blake-2.jpg'], price: '$14,500,000', headline: 'Multi-Tenant Creative Retail Building', tagline: '20,000 square feet of character, income, and long-term upside in one of Los Angeles’ most sought-after creative corridors.', specs: ['±20,000 SF Building', '±26,700 SF Lot', '10 Commercial Units', 'LACM Zoning', 'Built 1927 / Renovated 2025', 'Fully Stabilized'], description: ['1801 Blake Avenue is a premier creative retail asset located in the heart of the Elysian Valley / Frogtown submarket of Los Angeles. The property consists of approximately 20,000 square feet of retail space situated on a 26,700-square-foot lot, offering a rare combination of scale, architectural character, and irreplaceable land fundamentals in one of Los Angeles’ most supply-constrained corridors.', 'Originally constructed in 1927, the building has been thoughtfully repositioned to meet modern tenant demand. The property features exposed wood bow-truss ceilings, polished concrete floors, abundant natural light, and flexible open-floor layouts that cater to creative, lifestyle, and experiential retail users. The asset is currently configured into 10 commercial units, providing diversified income while maintaining strong upside through future mark-to-market opportunities.', 'The property is zoned LACM, allowing for a wide range of commercial and creative uses. It also benefits from excellent freeway access via the Golden State Freeway (I-5) and close proximity to Silver Lake, Atwater Village, Los Feliz, and Downtown Los Angeles.', 'The surrounding area has experienced significant tenant demand from boutique retailers, fitness concepts, creative offices, and food and beverage operators seeking authentic space in walkable, high-barrier submarkets.', '1801 Blake Avenue represents a compelling opportunity for investors seeking a stabilized creative retail asset with strong in-place tenancy, long-term rent growth potential, and durable real estate fundamentals in one of Los Angeles’ most dynamic and evolving neighborhoods.'] },
  { title: '17007–17009 Hawthorne Boulevard', meta: 'Lawndale, CA 90260', status: 'for-sale', image: HW_A, gallery: [HW_B], price: '$1,500,000', headline: 'Retail & Office Investment Opportunity', tagline: 'Value-add South Bay asset with nearly 100% embedded rental upside — 5.31% current cap rate to 9.12% pro forma.', specs: ['±4,780 SF Rentable Building', '±7,827 SF Double Lot', '$313.81 / RSF', '5.31% Current Cap', '9.12% Pro Forma Cap', 'Retail + Office Tenants', 'Dedicated Parking Parcel', 'LNC3YY Zoning', 'Built 1950'], description: ['Located along Hawthorne Boulevard in Lawndale, California, 17007 Hawthorne Boulevard presents an attractive value-add investment opportunity consisting of a 4,780-square-foot rentable commercial building situated on a 7,827-square-foot double lot, including a dedicated second parcel utilized for parking.', 'The property is currently occupied by two commercial tenants, including a 3,900-square-foot retail user and an 880-square-foot office tenant, providing a diversified tenancy profile within a highly visible South Bay commercial corridor.', 'The offering is particularly compelling due to the property’s significant embedded rental upside. While title records reflect approximately 3,136 square feet of building area, the property is understood to contain approximately 4,780 square feet of rentable building area, providing an attractive basis of approximately $313.81 per rentable square foot at the asking price.', 'At current in-place income, the property generates an estimated 5.31% capitalization rate. Based on the property’s substantial rental upside and normalized/pro forma income, the capitalization rate is projected to increase to approximately 9.12%, representing a compelling opportunity to substantially enhance both cash flow and asset value.', 'The existing retail lease extends through January 31, 2029, followed by a five-year option period. The lease provides for annual rental adjustments tied to the Consumer Price Index (CPI). According to ownership, the contractual increases have not been implemented since the lease was originally executed — creating an opportunity for a new owner to review and, where contractually permitted, implement the existing lease provisions for an immediate increase in property income without requiring new leasing, tenant turnover, or significant capital expenditure.', 'The property benefits from a rare 7,827-square-foot double-lot configuration, with the second lot utilized for parking. The additional land component provides an important competitive advantage along Hawthorne Boulevard, where parking and usable land are valuable components of the overall real estate.', 'Lawndale is positioned for the next chapter of the South Bay: 350 new residences are planned as part of the South Bay Galleria’s approved mixed-use redevelopment, and the approved Metro K Line extension will bring a new station to the Galleria — strengthening regional connectivity along the Hawthorne Boulevard corridor. With South Bay retail occupancy at 93.5% and limited new supply, well-located commercial assets throughout the submarket continue to be strongly supported.', '*Buyer to perform own due diligence and verify all information.'] },
  { title: '11007 Crenshaw Boulevard', meta: 'Inglewood, CA 90303 · Retail', status: 'for-sale', image: S + '11007-crenshaw.jpg', price: '$995,000', headline: 'Two-Unit Retail Building', tagline: 'Delivered Vacant | 6.87% Pro Forma | Gated Rear Parking | Minutes from SoFi Stadium', specs: ['±3,000 SF Building', '±7,139 SF Lot', 'Two Storefronts (1,500 SF Each)', 'Delivered Vacant', '6.87% Pro Forma Cap', '10 Gated Spaces', 'Built 1954 / INC2YY'], description: ['The Hirth Group has been exclusively retained to market for sale 11007 Crenshaw Boulevard, Inglewood, CA 90303 — a retail property consisting of two storefronts totaling ±3,000 SF of building on an estimated ±7,139 SF of land. There is gated parking for 10 vehicles in the rear. Both retail units are currently vacant (1,500 SF each), allowing a new investor to achieve market rents for the property or occupy all or part of the building. All in all, this is an incredible opportunity for an investor or owner/user looking for prime real estate in one of Los Angeles’ most flourishing submarkets.', 'At $995,000 — $331.67 per building SF and $139.38 per lot SF — the property is priced below the $343.46/SF average of recent Inglewood sale comparables, on a larger-than-average lot. Assuming fully NNN re-tenanting at $2.00/SF, the asset projects a 6.87% pro forma cap rate. SBA financing is available for qualified buyers, and with as little as 10% down an owner-user’s total monthly cost pencils to roughly $2.49 per SF.', '11007 Crenshaw Boulevard is located in the southeastern pocket of Inglewood, just south of Century Blvd and north of W Imperial Hwy. Inglewood continues to emerge as one of Southern California’s most dynamic centers for sports, entertainment, and real estate investment. Significant public and private investment has transformed the city, anchored by world-class destinations including SoFi Stadium, Intuit Dome, the Kia Forum, Hollywood Park Casino, and the nearly 300-acre Hollywood Park master-planned development, which alone is adding approximately 2,500 residences alongside new retail, office, hospitality, entertainment, and public spaces.', 'That momentum extends throughout the surrounding community, where new multifamily and mixed-use developments are adding housing and investment along key corridors such as Florence Avenue and La Brea Avenue. As Inglewood prepares to welcome an even greater international audience through Super Bowl LXI in February 2027 and the 2028 Olympic and Paralympic Games, the property is well positioned within a market benefiting from continued development, institutional investment, and growing global recognition.', '*Per title, building is 2,385 SF. Buyer to verify all information and conduct their own due diligence.'] },
  { title: '1817 W. Pico Boulevard', meta: 'Los Angeles, CA 90006', status: 'for-sale', image: S + '1817-w-pico.jpg', price: '$750,000', headline: 'Retail Storefront and Residential Units', tagline: 'Mixed-Use Value-Add | Owner-User Opportunity | 4 Blocks from Crypto Arena', specs: ['±2,663 SF Building', '±6,239 SF Lot', '2 Retail Storefronts + 3 Residential Units', '6.29% Cap | 12.14% Pro Forma', 'Over 100% Rental Upside', '4 Blocks from Crypto Arena'], description: ['1817 W. Pico Boulevard is a mixed-use property located in Downtown Los Angeles, approximately four blocks away from the renowned Crypto Arena. The property consists of two retail storefronts and three residential units. The building itself spans around ±2,663 square feet, situated on a ±6,239 square foot lot.', 'Currently, there is only one vacant residential unit within the building; however, with the storefronts being month-to-month and residential units all being rented significantly below market, this allows an investor the opportunity to add value. The investor can negotiate new lease terms with the existing tenants, potentially raising the rental rates to market levels or alternatively, the investor can choose to re-lease the spaces altogether, allowing for new tenants to occupy the retail storefronts and residential units. This offers the opportunity to secure higher rents from new tenants, further maximizing the property’s income potential.', 'In addition, with the current retail storefronts being on month-to-month terms, this opportunity can also be ideal for an owner-user looking to occupy the retail stores for their own business, while collecting rental income from the remainder of the units, helping toward their monthly expense.', 'Given the prime location near the Crypto Arena and the potential to double the current income, this property presents a tremendous opportunity for an investor looking to add value and generate higher returns.'] },
  { title: '431 E. Hillcrest Boulevard', meta: 'Inglewood, CA 90301', status: 'for-sale', image: S + '431-hillcrest.jpg', price: '$1,100,000', headline: 'McCormick Ambulance Station — Freestanding Office', tagline: 'McCormick Portfolio | 6.42% Cap Rate | NNN Lease | Can Be Sold as a Package or Individually', specs: ['±1,600 SF Building', '±6,325 SF Lot', '6.42% Cap | 7.06% Pro Forma', 'INC1 Zoning', 'Built 1959', '10 Marked Spaces'], saleHighlights: ['McCormick Ambulance Portfolio | Combined Cap Rate of 6.54%', 'Long Historical Occupancy of Nearly 20 Years | CUP for Both Properties Making Relocation Impractical', 'Can Be Sold as a Package or Individually', 'Perfect Investor or 1031 Exchange Opportunity | NNN Leases', 'Prime Inglewood Locations | Near Intuit Dome, SoFi Stadium, The Forum, and Hollywood Park Casino'], description: ['Daniel Hirth of The Hirth Group has been exclusively selected to market for sale 431 E Hillcrest Boulevard, a freestanding office property used by McCormick Ambulance for office operations, employee accommodations, and ambulance parking, with approximately 10 on-site parking spaces.', 'The property is occupied by McCormick Ambulance Company, a Southern California institution with roots dating to 1962 in the South Bay, distinguished as the first organization in California to deploy certified paramedics and a key contributor to the founding of Los Angeles County\'s original mobile cardiac care ("heart car") program. McCormick remains one of the region\'s major private EMS providers and has occupied the site for just under 20 years under a specialized Conditional Use Permit (CUP).', 'The tenant, Westmed Ambulance, Inc. dba McCormick Ambulance — an American Medical Response / Global Medical Response company — has operated from these two locations continuously since 2007 and holds the exclusive rights to all 911 ambulance transport in LA County\'s Exclusive Operating Areas 6–9. Those county contracts require the operator to post ambulances with   { title: '3738 W. Imperial Highway', meta: 'Inglewood, CA 90303', status: 'for-sale', image: S + '3738-imperial.jpg', price: '$1,100,000', headline: 'Mixed-Use | McCormick Ambulance Retail Suite + Two Units', tagline: 'McCormick Portfolio | 6.67% Cap Rate | Retail, Residential & Billboard Income', specs: ['±2,190 SF Building', '±6,126 SF Lot', '6.67% Cap | 7.35% Pro Forma', 'HACM Zoning', 'Built 1940', 'Studio + 1BD/1BA + Retail + Billboard'], saleHighlights: ['McCormick Ambulance Portfolio | Combined Cap Rate of 6.54%', 'Long Historical Occupancy of Nearly 20 Years | CUP for Both Properties Making Relocation Impractical', 'Can Be Sold as a Package or Individually', 'Perfect Investor or 1031 Exchange Opportunity | NNN Leases', 'Prime Inglewood Locations | Near Intuit Dome, SoFi Stadium, The Forum, and Hollywood Park Casino'], description: ['Daniel Hirth of The Hirth Group has been exclusively selected to market for sale 3738 W. Imperial Highway, a mixed-use property comprising approximately 2,190 square feet of building area on a ±6,123 square foot lot. The property features a McCormick Ambulance retail suite, one studio unit, one one-bedroom/one-bathroom unit, billboard income, and a one-car garage that may offer future ADU conversion potential.', 'The property is anchored by McCormick Ambulance Company, a Southern California institution with roots dating to 1962 in the South Bay, distinguished as the first organization in California to deploy certified paramedics and a key contributor to the founding of Los Angeles County\'s original mobile cardiac care ("heart car") program. McCormick remains one of the region\'s major private EMS providers and has occupied the site for just under 20 years under a specialized Conditional Use Permit (CUP).', 'The tenant, Westmed Ambulance, Inc. dba McCormick Ambulance — an American Medical Response / Global Medical Response company — has operated from these two locations continuously since 2007 and holds the exclusive rights to all 911 ambulance transport in LA County\'s Exclusive Operating Areas 6–9. Those county contracts require the operator to post ambulances within the zone under strict response-time penalties, making entitled, purpose-built ambulance stations inside the territory essential infrastructure — and these sites benefit from a conditional use permit for ambulance operations that is extremely difficult to replicate.', 'Inglewood has undergone a remarkable transformation into a major sports, entertainment, and development hub, driven by billions of dollars in public and private investment. The city is home to SoFi Stadium, Intuit Dome, Kia Forum, Hollywood Park Casino, and the broader nearly 300-acre Hollywood Park development, which includes approximately 2,500 residences alongside extensive retail, office, hospitality, entertainment, and public open space. With Inglewood positioned on the global stage for major events including the 2027 Super Bowl and the 2028 Olympic Games, the properties offer investors an opportunity to acquire real estate in a city experiencing significant investment, development, and international exposure.'] },
  { title: '503 S Victory Boulevard', meta: 'Burbank, CA 91502', status: 'for-sale', image: S + '503-victory.jpg', price: '$1,850,000', headline: 'Creative Post-Production Office Building', tagline: 'Prime Owner-User Opportunity | SBA Financing Available with As Little as 10% Down', specs: ['±4,133 SF Building', '±4,718 SF Lot', '$508/SF Building', 'BUC4YY Zoning', 'Built 1953', '7 Parking Spaces'], saleHighlights: ['Prime Owner-User Opportunity | SBA Financing Available with As Little as 10% Down', 'Turnkey Post-Production Office Facility | $500,000 Renovations Throughout the Years', 'Eleven (11) Private Rooms | Avid Editing Suites, Recording/Voice-Over Rooms, and Executive Offices', 'Premium Build-Out | Screening Room, Soundproof Rooms, and Secure Keypad-Access Server Room', 'Recent Capital Improvements | New Roof (2023), Updated Electrical, and Meticulous Finishes Throughout', 'On-Site Parking | Seven (7) Parking Spaces with EV Charging', 'No City Income Tax | Burbank Has No City Income Tax or Gross Sales Receipt Tax'], description: ['Ethan Donel, Alex Reyhan, and Daniel Hirth have been exclusively retained by ownership to market for sale 503 S Victory Boulevard, Burbank, CA 91502. Built in 1953 and renovated with over $500,000 in improvements throughout the years, this single-tenant creative and post-production office building encompasses approximately ±4,133 square feet of building on a ±4,718 square foot lot, featuring seven (7) on-site parking spaces. The property has been purpose-built for creative and post-production uses, featuring eleven (11) private rooms currently used as Avid editing suites, recording/voice-over rooms, and executive offices, along with a reception area, screening room, secure keypad-access server room, kitchen/lounge, and two (2) restrooms. While the current build-out caters to post-production users, the flexible floor plan lends itself to any office user seeking beautiful private office space.', 'Exposed wood truss ceilings, polished concrete floors, and high ceilings throughout create an open and inviting environment, while abundant natural light enhances the front of the building. Each suite is equipped with individual HVAC ducting and AC controls, served by five (5) rooftop HVAC units, one of which is dedicated to the server room. Additionally, the property showcases a new roof (2023), updated electrical service, with meticulous finishings all-throughout.', '503 S Victory Boulevard allows an owner/user to capitalize on the demand for office space in the heart of Burbank. For an owner/user taking advantage of SBA financing with as little as 10% down is the ideal situation while also being able to own prime real estate in a great pocket of Burbank. Due to Burbank\'s initiative to attract new businesses, there is also no city income tax and no gross sales receipt tax.', 'This property is nestled in the heart of the highly desired submarket of Burbank. Known as being the \"Media Capital of the World,\" Burbank is home to many well-established media and entertainment companies such as The Walt Disney Company, Warner Brothers Entertainment/Music Group, Cartoon Network, Nickelodeon, Warner Music Group, NBC Universal, ABC, Arri Cameras, Cinelease, Entertainment Partners, JL Fisher and Matthews Studio equipment just to name a few. Surrounded by the 134 and 5 freeways makes Burbank very accessible to neighboring cities such as Glendale, Toluca Lake, North Hollywood and Hollywood.'] },
  { title: '11771 Washington Blvd', meta: 'Whittier, CA 90606', status: 'for-sale', image: S + '11771-washington.jpg', price: '$1,995,000', headline: 'Corner Lot Retail Building', specs: ['±984 SF Building', '±15,397 SF Lot', 'LCC3BE* Zoning', '10.91% Cap', '12.16% Pro Forma Cap', 'Corner Lot'], description: ['11771 Washington Blvd presents a rare opportunity to acquire a high-yield commercial investment positioned on a large infill parcel along one of Southeast Los Angeles County\u2019s primary commercial corridors. Located in the City of Whittier, the property consists of approximately 984 square feet of existing commercial improvements situated on an expansive \u00b115,397 square-foot lot with flexible LCC3BE* zoning, offering exceptional long-term functionality, owner-user utility, and redevelopment potential.', 'The asset is currently occupied under a gross lease structure generating strong in-place cash flow, while also benefiting from built-in contractual rent increases that ownership has not yet fully implemented, creating immediate upside for a new investor. The property is offered at an attractive 10.91% current capitalization rate with projected upside to approximately 12.16% pro forma capitalization rate through the implementation of contractual lease escalations alone.', 'Strategically positioned along Washington Boulevard, the property benefits from excellent visibility, strong traffic exposure, and immediate accessibility to Interstate 605, Interstate 5, and State Route 60. The surrounding trade area is supported by a dense mix of residential neighborhoods, industrial operators, automotive businesses, retail users, and commercial service providers that continue to drive strong demand throughout the Southeast Los Angeles County market.', 'The combination of durable in-place income, contractual revenue growth, flexible zoning, and intrinsic land value positions 11771 Washington Boulevard as a uniquely attractive opportunity for investors, owner-users, and redevelopment-oriented buyers alike.'] },
  { title: '4761 W Century Blvd', meta: 'Inglewood, CA 90304', status: 'for-sale', image: S + '4761-century.jpg', price: '$2,500,000', headline: 'Automotive Property', tagline: 'Owner-User or Investor — Flexible Automotive & Commercial Zoning on Century Blvd', specs: ['5,010 SF Building', '10,032 SF Lot', '~15-Car Gated Parking', 'Rear Roll-Up Door'], description: ['Alex Reyhan and Daniel Hirth of The Hirth Group have been exclusively selected to market for sale 4761 W Century Blvd, Inglewood, CA 90304 — a 5,010 SF automotive property situated on 10,032 SF of land. The property is currently occupied by a rental car company and was previously utilized for automotive-related uses, with zoning that allows a broad range of commercial operations, including light automotive services such as glass tinting, audio and electronics installation, security system installation, and similar uses. The site features rear alley access, secured gated parking for approximately 15 vehicles, dedicated office space, and one ground-level roll-up door at the rear.', '4761 W Century Blvd is strategically positioned in the southwestern portion of Inglewood along Century Boulevard, one of the city’s primary and most heavily traveled corridors. Average traffic counts exceed 43,000 vehicles per day, with volumes increasing following the development of SoFi Stadium and the opening of the Intuit Dome. The property benefits from strong surrounding demographics, with over 264,000 residents within a three-mile radius and a median household income exceeding $72,000, anchored by national tenants including Taco Bell, Starbucks, Dollar Tree, El Pollo Loco, Panda Express, McDonald’s, and Carl’s Jr.'] },
  { title: '2221–2225 W Olive Avenue', meta: 'Burbank, CA 91506', status: 'for-sale', image: P + 'listing-olive-ave.jpg', price: '$4,295,000', headline: 'Mixed-Use Opportunity | Retail, Office & Residential Income', tagline: 'Fully Stabilized Income | 18 Total Units Across Retail, Office, and Residential Components', specs: ['±7,478 SF Building', '±10,100 SF Land', '11 Office / 5 Retail / 2 Apt', '6.53% CAP', '7.77% Pro Forma'], description: ['The Hirth Group’s team, comprised of Ethan Donel, Alex Reyhan, and Daniel Hirth, has been exclusively retained by ownership to present 2221–2225 W. Olive Avenue, a fully occupied multi-tenant mixed-use investment opportunity featuring retail, office, and residential units in the heart of Burbank, California.', 'Situated on two contiguous parcels totaling ±10,100 SF of land, the property encompasses ±7,478 SF of building with eleven (11) office suites, five (5) retail storefronts, and two (2) apartment units. All commercial tenants operate on NNN leases, providing investors with a diversified and stable income stream. The asset offers significant upside potential through rent adjustments and tenant repositioning, with a projected pro forma yield of 7.27%. In addition, the property’s strong current CAP rate of 6.20% offers an attractive in-place return rarely found in the Burbank market.', 'Ideally positioned along Olive Avenue just minutes from the 134 Ventura Freeway, the property sits at the center of the “Media Capital of the World,” anchored by Disney, Warner Bros., and NBC Universal — with continued investment including the Warner Bros. Ranch Lot expansion and the $1.1 billion Burbank Airport modernization.'] },
  { title: '6825 Kester Avenue', meta: 'Van Nuys, CA 91405', status: 'for-sale', image: S + '6825-kester.jpg', price: '$1,200,000', headline: 'Shovel-Ready 28-Unit Development Opportunity', tagline: 'RTI Approved Plans | Under $43,000 Per Buildable Unit | TOC Tier 3 | Opportunity Zone', specs: ['28 Buildable Units', '<$43K / Buildable Unit', 'C1.5-1VL TOC Tier 3', '20,514 SF Buildable', 'FAR 2.34:1 (3.75:1 Max)', 'Opportunity Zone'], description: ['Ethan Donel, Alex Reyhan, and Daniel Hirth are pleased to present 6825 Kester Avenue, an exceptional shovel-ready multifamily development opportunity located in the heart of Van Nuys, California. The property is strategically positioned just off the corner of Vanowen Street and North Kester Avenue, within one of the most active and diverse submarkets in the San Fernando Valley.', 'With RTI approved plans in place, a developer can immediately break ground on a 28-unit multifamily building priced at under $43,000 per buildable unit. The design includes twenty-three (23) primary residential units and five (5) fitness rooms with existing plumbing and infrastructure that can be converted into ADUs to reach the full 28-unit potential.', 'The property is zoned C1.5-1VL TOC Tier 3 with a FAR of 2.34:1, permitting 20,514 square feet of buildable area under the current plans. However, the maximum allowable FAR of 3.75:1 presents a rare opportunity for a developer to increase density, total buildable square footage, and unit count if desired.', 'The property is also located within an opportunity zone which will allow a developer to receive federal tax incentives by investing their capital.', 'Van Nuys continues to transform into a vibrant residential and mixed-use hub, driven by ongoing public and private investment. The area benefits from excellent accessibility to the 405 and 101 freeways and is anchored by major employment centers such as the Van Nuys Civic Center and Van Nuys Airport.', 'With the upcoming Metro Light Rail extension along Van Nuys Boulevard — connecting the Orange Line to the City of San Fernando — the neighborhood is poised for long-term appreciation and sustained tenant demand from residents seeking transit-oriented, urban living in the core of the Valley.', 'If a buyer elects to convert the five (5) fitness rooms into ADUs, the total potential unit count increases to twenty-eight (28). Buyer to verify all information and conduct their own due diligence.'] },
  { title: '330 Hillcrest Boulevard', meta: 'Inglewood, CA 90301', status: 'for-sale', image: S + '330-hillcrest.jpg', price: '$1,600,000', headline: 'Multi-Tenant Medical/Office Building', tagline: 'Well-Positioned Medical/Office Asset in Inglewood’s Explosive Growth Corridor', specs: ['5,500 SF Building', '11,550 SF Lot', '2 Units', 'Built 1955 / INC1', 'On-Site Parking'], description: ['Daniel Hirth of The Hirth Group has been exclusively selected to market for sale 330 E Hillcrest Blvd, Inglewood, CA 90301 — a multi-tenant medical/office building consisting of 5,500 SF of building on an 11,550 SF lot. The property is configured with two units, one measuring 3,500 SF and leased to a long-standing dental practice, and the other totaling 2,000 SF and currently vacant, offering flexibility for an owner-user or new tenant. Built in 1955 and zoned INC1, the property provides ample on-site parking in the rear along with additional street parking. This is a compelling opportunity for investors or owner-users seeking a well-positioned asset with strong utility for healthcare, wellness, or general office services.', '330 E Hillcrest Blvd sits at the epicenter of Inglewood’s explosive growth corridor, just south of West Manchester Blvd and east of South Market Street. The property is surrounded by hundreds of brand-new luxury apartments, with more projects breaking ground nearby, signaling sustained demand for high-quality medical and office space. Immediately adjacent is a major mixed-use development featuring 65 luxury residential units and ground-floor retail, expected to be completed in the coming years — a development that will further elevate the area’s tenant base and foot traffic.', 'With strong in-place cash flow, diverse tenant types, and frontage along one of Southeast Los Angeles County’s most active commercial corridors, the asset offers a rare opportunity for investors seeking a stable, income-generating property in a supply-constrained, infill market.', 'Positioned minutes from SoFi Stadium, the Intuit Dome, The Kia Forum, and Hollywood Park, this location captures the momentum of one of Los Angeles’ fastest-growing submarkets. Inglewood continues to transform into a premier entertainment and lifestyle destination, drawing massive private and institutional investment. This property stands to directly benefit from the city’s renaissance, offering investors and owner-users alike a rare opportunity to secure a strategically located asset with strong long-term appreciation potential.', '*Buyer to perform own due diligence and verify all information.'] },
  { title: '8625 Avalon Boulevard', meta: 'Los Angeles, CA 90003', status: 'for-sale', image: S + '8625-avalon.jpg', price: '$3,050,000', headline: 'Industrial Building', tagline: 'Two-Building Configuration: ±14,880 SF across two freestanding industrial structures with flexible layouts and functional design.', specs: ['±14,880 SF', '25,218 SF Lot', 'Two Freestanding Buildings', 'LAM1 Zoned', 'Multiple Roll-Up Doors'], description: ['8625 Avalon Boulevard presents an exceptional opportunity to acquire a versatile light-industrial property in the heart of South Los Angeles, combining immediate in-place income with significant value-add potential. The property consists of two freestanding concrete-tilt-up buildings totaling approximately 14,880 square feet on a 25,218 square-foot lot, zoned LAM1 — ideal for manufacturing, warehousing, or creative industrial uses.', 'With one space currently occupied by a stable tenant and the other delivered vacant, this asset provides flexibility for a wide range of investor or owner-user strategies. The buildings feature multiple roll-up doors, a secure gated yard, ample parking, and functional layouts suited for modern industrial users.', 'Positioned along Avalon Boulevard just north of Manchester Avenue, the property benefits from excellent frontage and accessibility, with immediate access to the I-110, I-105, and I-10 freeways — offering fast connectivity to Downtown Los Angeles, LAX, and the Ports of Los Angeles and Long Beach.'] },
  { title: '8621 Bellanca Avenue', meta: 'Los Angeles, CA 90045', status: 'for-sale', image: S + '8621-bellanca.jpg', price: '$4,350,000', headline: 'Commercial-Flex Building', tagline: 'Freestanding 11,798 SF Commercial-Flex Building on a Large ±20,981 SF Lot', specs: ['11,798 SF Building', '±20,981 SF Lot', 'Built 1961 / LAMR1', '27-Car Gated Parking', 'Verizon Cell Tower Lease'], description: ['8621 Bellanca Avenue, Los Angeles, CA 90045 is a freestanding commercial-flex building with 11,798 SF on 20,981 SF of land. Built in 1961 and zoned LAMR1, it is in excellent condition with major upgrades, offering strong potential for office, creative office, commercial, or flex uses. Perfect for owner-users needing customizable space or investors seeking value-add opportunities, it provides ample room for reconfiguration. The subject property contains two points of ingress and egress as well as gated parking for 27 vehicles. Upgrades include new electrical wiring in December 2022 with mini-split provisions, a 2019 roof, 2023 windows, floors, ceilings, and lighting, plus wrought-iron fencing from 2019–2023.', '8621 Bellanca Avenue is strategically located in the heart of Westchester, adjacent to the booming LAX and Playa Vista submarkets. This dynamic location places the property within minutes of Los Angeles International Airport, the 405 and 105 freeways, and the Metro K Line. The area is surrounded by top-tier amenities including The Campus at Playa Vista, Runway Playa Vista, and Silicon Beach tech giants like Google, YouTube, and Amazon Studios.', '*A Verizon cell tower is located on the south side of the property. The lease agreement extends until November 30, 2029, with current monthly payments of $7,020, subject to 5% annual increases. Verizon is presently in its second option period and holds two additional 5-year renewal options.'] },
  { title: '310 N La Brea Avenue', meta: 'Inglewood, CA 90302', status: 'for-sale', image: S + '310-la-brea.jpg', price: '$1,050,000', headline: 'Auto Repair Property', tagline: 'Rare Auto-Repair Property with Four (4) Auto Bays | 3-Phase Electrical with 400 Amps', specs: ['2,973 SF Building', '4,787 SF Lot', '4 Auto Bays', '400A 3-Phase Power', '~6-Car Parking'], description: ['Daniel Hirth of The Hirth Group has been exclusively selected to market for sale — 310 N La Brea Ave, Inglewood, CA 90302. This prime auto repair property boasts 2,973 SF of building on an estimated 4,787 SF lot. The subject property has four (4) auto bays and parking for approximately six (6) vehicles. There is 400 amps of 3-Phase power, providing ample capacity for lifts, air compressors, welders, and other high-powered auto repair machinery. All in all, this is an amazing opportunity for an owner/user or savvy auto repair investor looking for prime retail space in Inglewood’s ever-evolving market.', 'Ideally situated just north of Florence Avenue and south of Hyde Park Boulevard, this property sits in the heart of Inglewood, surrounded by a wave of new developments and thriving businesses. Nearby residential projects include The Astra and DeMilo apartment complexes, while major venues such as SoFi Stadium, Intuit Dome, The Forum, and Hollywood Park Casino further enhance the area’s appeal. The property also benefits from strong national retail presence, with Target, Walgreens, Superior Grocers, AutoZone, Little Caesars, and CVS all located nearby.', '*Buyer to verify all information.'] },
  { title: '6104 S. Wilton Place', meta: 'Los Angeles, CA 90047', status: 'for-sale', image: S + '6104-wilton.jpg', price: '$419,000', headline: 'Development Opportunity', tagline: 'Perfect Land Banking Opportunity or Development Opportunity', specs: ['4,137 SF Lot', 'R1 Zoned', '~40% Delivered Vacant', '“Van Ness” Neighborhood'], description: ['6104 S. Wilton Place, Los Angeles, CA 90047, is a rare 4,137 SF R1-zoned lot nestled in the quiet “Van Ness” neighborhood of South LA. This property offers tremendous potential for developers and investors alike! Approximately 40% of the parcel, currently used by a neighboring tenant, will be delivered vacant at the close of escrow, providing an adaptable space for future use. Situated just off W. Slauson Ave. and S. Western Ave., enjoy seamless access to major thoroughfares, public transportation, and key employment hubs.', 'Surrounded by single-family homes and emerging developments, this property is in the path of progress, making it a prime investment for appreciation. With an increasing demand for housing and a rapidly evolving market, this lot is perfect for a developer or savvy investor looking to capitalize on future growth.', '*Buyer to verify all information. The backyard also contains an electrical pole.'] },
  { title: '8212 S. Western Avenue', meta: 'Los Angeles, CA 90047', status: 'in-escrow', image: S + '8212-western.jpg', price: '$3,500,000', headline: 'A 89-Unit Development Opportunity', tagline: 'Attractive Price Per Buildable Unit: $39,326 / Buildable Unit', specs: ['23,434 SF Land', 'C2-1VL-CPIO', '58–89 Units', 'TOC Tier 1 / FAR 2.75:1', '~64,444 SF Buildable'], description: ['8212 S Western Avenue is located on the Northeast corner of W 83rd Street and S Western Avenue. The subject property boasts roughly 23,434 SF of land zoned C2-1VL-CPIO on a hard corner. 8212 S Western Avenue allows a developer the opportunity to build 58 units by right or 89 units exercising the TOC Tier 1 incentives, which include a 50% density bonus and an FAR increase of 2.75:1, totaling approximately 64,444 SF of buildable SF with only 8 units being designated to extremely low income, for less than $40,000 per buildable unit.', '8212 S Western Avenue is just blocks away from the well-known intersection of Manchester Avenue and S Western Ave. The submarket is gentrifying rapidly, recognized by the national tenants surrounding the subject property, such as Ralphs, O’Reilly Auto Parts, WSS Shoe Store, Taco Bell, Jiffy Lube, McDonald’s, KFC, Chase Bank, Domino’s Pizza, Smart & Final, and Wells Fargo, to name a few.', 'Note: Buyer to perform their own due diligence and verify all information.'] },
