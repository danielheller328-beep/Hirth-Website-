  { title: '2205 W. Olive Avenue', meta: 'Burbank, CA 91506', status: 'closed', dealType: 'Mixed Use', image: CLO + '2205-olive.jpg', price: '$1,450,000', headline: 'Multi-Tenant Mixed-Use Building', tagline: 'Six-Year Advisory Relationship | 100% of List Price | Seller Represented', specs: ['±2,497 SF Building', '±5,625 SF Lot', 'Multi-Tenant Mixed Use', 'Closed at 100% of List Price', 'Vacant Possession Delivered', 'Seller Leaseback Negotiated'], description: ['Ethan Donel, Alex Reyhan, and Daniel Hirth of The Hirth Group are pleased to announce the closing of 2205 W. Olive Avenue, Burbank, CA 91506! Our agents represented the seller on this ±2,497 SF multi-tenant mixed-use building on a ±5,625 SF lot, steps from Disney Studios, Warner Bros., and Providence Saint Joseph Medical Center — with an office, retail, and a fully renovated studio apartment on site.', 'We advised this seller for six years, guiding him through market conditions until he decided to close his longtime Burbank business and exit his holdings. The retail tenant had been in default for six months, but our team delivered the asset clean — facilitating the eviction and clearing the path to vacant possession at close, plus a free-rent seller leaseback so he could exit on his own timeline.', 'Aggressive marketing and direct outreach generated nearly a dozen qualified buyers, and that competition closed the deal at 100% of list price.', 'Transaction highlights: a six-year advisory relationship and trusted guidance to the right exit; a retail tenant in default with vacant possession delivered at close; nearly a dozen qualified buyers and a close at 100% of list price; and a negotiated seller leaseback for a seamless exit on the seller’s timeline.', 'Seller represented by Ethan Donel, Alex Reyhan, and Daniel Hirth.'] },
  { title: '5142 Lankershim Boulevard', meta: 'North Hollywood, CA 91601', status: 'closed', dealType: 'Retail', image: CLO + '5142-lankershim.jpg', price: '$2,025,000', headline: 'Multi-Tenant Retail Building', tagline: 'Closed Where Two Prior Firms Could Not | 94% of List Price | Seller Represented', specs: ['±4,295 SF Building', '±5,823 SF Lot', 'C4 Zoning', 'Closed at 94% of List Price', 'No Credits Issued in Escrow', 'SBA Owner-User Buyer'], description: ['Ethan Donel, Alex Reyhan, and Daniel Hirth of The Hirth Group are pleased to announce the successful closing of 5142 Lankershim Boulevard, North Hollywood, CA 91601! Our agents represented the seller on this ±4,295 SF retail building set on a ±5,823 SF C4-zoned lot in the heart of the North Hollywood Arts District.', 'At the time escrow opened, we had lease LOIs on the table for the large vacant unit, meaning our seller was choosing a sale over signed tenancy and needed full confidence the buyer would close. Our agents vetted the SBA buyer extensively, confirming financial qualification and genuine intent before the seller committed, so that passing on the lease deals was never a risk.', 'Transaction highlights: closed where two prior firms could not, at 94% of list price. No credits issued in escrow, protecting the seller’s net proceeds in full. We located a qualified owner-user buyer — the strongest exit for the asset — extensively vetted the SBA buyer, and secured tenant estoppels to keep escrow clean and on schedule. The sale delivered ±3,600 SF of deliverable space for turnkey owner-user occupancy.', 'Seller represented by Ethan Donel, Alex Reyhan, and Daniel Hirth.'] },
  { title: '144 N. Clark Drive', meta: 'Beverly Hills, CA 90211', status: 'closed', dealType: 'Multifamily', image: CLO + '144-n-clark.jpg', price: '$3,845,000', headline: 'Eight Unit Apartment Building', tagline: 'Fully Repositioned Beverly Hills Multifamily | 5.28% Cap with 7.90% Pro Forma', specs: ['8 Units', '±5,840 SF Building', '6,298 SF Lot', '5.28% Cap | 7.90% Pro Forma', '13.55 GRM', 'On-Site Parking'], description: ['144 N. Clark Drive is a rare opportunity to acquire a fully repositioned 8-unit multifamily asset located in the heart of Beverly Hills’ most desirable residential enclave. Situated on a quiet, tree-lined street just moments from Beverly Drive, Wilshire Boulevard, and Rodeo Drive, the property benefits from exceptional walkability, premier tenant demand, and long-term value stability synonymous with this A+ submarket.', 'The property consists of 8 units totaling approximately 5,840 square feet on a 6,298 square-foot lot, offering a balanced mix of size, density, and livability that appeals to high-quality renters seeking proximity to Beverly Hills’ luxury retail, dining, and employment centers. Current ownership has invested over $500,000 in comprehensive renovations across 5 of the 8 units, completing full, high-quality interior upgrades rather than cosmetic improvements. Renovations include modern finishes, upgraded kitchens and bathrooms, updated flooring, fixtures, and systems, with four of the units featuring in-unit washer and dryer. These improvements position the majority of the property at or near top-of-market rental standards for the area. Importantly, three units remain significantly below market, providing a clear and achievable value-add opportunity for a new owner through natural tenant turnover and subsequent renovation.', 'The property offers an attractive blend of stable in-place income with meaningful future upside, making it well suited for both cash-flow-oriented and value-add investors. At current operations, the asset delivers a strong 5.28% capitalization rate, underscoring the durability of the existing income stream in an A+ Beverly Hills location. As the remaining three unrenovated units are repositioned to market levels, the investment is projected to achieve a 7.90% pro forma cap rate, providing substantial yield expansion without the need for additional density or development risk. The property is offered at a 13.55 gross rent multiplier, further supporting its favorable pricing relative to location and quality.', 'The asset is comprised of an 8-unit multifamily building, featuring eight one-bedroom, one-bathroom units, totaling approximately 5,840 square feet of rentable building area situated on a 6,298 square-foot lot. The property also includes on-site parking, an important amenity in Beverly Hills that enhances tenant demand and long-term value.'] },
  { title: '144 N. Clark Drive', meta: 'Beverly Hills, CA 90211', status: 'closed', dealType: 'Multifamily', price: '$2,865,000', image: CLO + 'n30.jpg', tagline: 'The Hirth Group advised our client in this transaction.', description: ['The Hirth Group advised our client in the successful sale of 144 N. Clark Drive, a commercial property located in Beverly Hills. The transaction closed as part of the firm’s extensive track record across the greater Los Angeles commercial real estate market.', 'Our hands-on approach — from pricing strategy through closing — ensured a seamless process and a strong outcome for our client.'] },
  { title: '3524–3528 E. Pico Boulevard', meta: 'Los Angeles, CA 90023', status: 'closed', image: S + '3524-pico.jpg', dealType: 'Mixed Residential', price: '$1,175,000', headline: 'Single Family Residence and Duplex', tagline: 'Two Adjacent Parcels | Separate APNs | Development and ADU Potential', specs: ['8,484 SF Combined Lot', 'Two Adjacent Parcels', 'Duplex + SFR', 'LAM2 Zoning', 'ADU Potential'], description: ['Single-family residence and duplex situated on adjacent parcels. Each parcel has its own APN (Assessor Parcel Number).', '3524 E. Pico Boulevard is a duplex and features (two) 1-bedroom/1-bathroom stand-alone units, and 3528 E. Pico Boulevard is a 2-bedroom/1-bathroom house. The property contains a combined lot size of 8,484 SF and is zoned LAM2 (Light Industrial). The large lot presents desirable development potential or the opportunity to add ADUs (Accessory Dwelling Units). The asset also presents an owner-user opportunity and the property may qualify for residential financing (Buyer to verify).', 'Located in the heart of the Los Angeles Metropolitan Area, the asset is located just southeast of Downtown Los Angeles. The property is in close proximity to the Arts District, Boyle Heights, Fashion District and to the many industrial complexes and warehouses in Vernon. The asset is also located near Citadel Outlets, Los Angeles Community Hospital, East L.A. College, Costello J. Recreation Center and the City of Commerce.'] },
  { title: 'Pizza Hut — Angleton, TX', meta: 'Angleton, TX · Single Tenant NNN', status: 'closed', image: CLO + 'pizza-hut-angleton.jpg', dealType: 'Single Tenant Net Lease', price: '$3,050,000', representation: 'Buyer', headline: '1031 Exchange | NNN Asset', tagline: '18+ years remaining · Second-largest Pizza Hut franchisee in the United States · 5.24% in-place CAP.', specs: ['±3,446 SF Building', '0.51 Acre Lot', '18+ Years Remaining', '5.24% CAP', '10% Increases Every 10 Years'], description: ['Alex Reyhan and Daniel Hirth of The Hirth Group represented the buyer on a successful 1031 exchange into a Pizza Hut in Angleton, Texas. The buyer was looking to exchange out of a property in Hollywood which they used for their personal business into an investment with more passive income. As the buyer was working on strategizing their retirement, they were looking for a 1031 exchange with no landlord responsibilities.', 'The Hirth Group was successful in identifying a handful of properties that would meet his criteria, securing the client the deal, and negotiating on behalf of the buyer to obtain seller financing. The Pizza Hut has over 18 years left on their term, being the second-largest Pizza Hut franchisee in the United States with over 388 units. The property is roughly 3,446 SF of building on a 0.51 acre lot. The buyer purchased the property at an in-place CAP rate of 5.24% with 10% increases every 10 years.'] },
  { title: '6543 Lankershim Boulevard', meta: 'North Hollywood, CA 91606 · Preschool/Daycare Center', status: 'closed', image: S + '6543-lankershim.jpg', price: '$1,580,000', dealType: 'Preschool/Daycare Center', representation: 'Seller', specs: ['±3,103 SF Building', '±9,380 SF Lot', 'C2 Zoning', '$509/SF'], headline: 'Prime NoHo Preschool/Daycare Center', tagline: 'Closed where the prior firm could not · 93% of list price · Nearly a dozen offers · Seller represented by Ethan Donel, Alex Reyhan & Daniel Hirth.', description: ['Ethan Donel, Alex Reyhan, and Daniel Hirth of The Hirth Group are proud to announce the successful closing of 6543 Lankershim Boulevard in North Hollywood — marking another strategic win for our clients and our team.', 'This was a deal that required creative problem-solving from start to finish. We generated 30+ showings — all with qualified daycare buyers — and pre-market momentum before the listing even launched. Along the way, we negotiated a six-figure deposit release during escrow to secure our seller\'s position, worked entirely around an active daycare with evening/weekend-only showings, managed tenant interference and restricted access while securing a signed tenant estoppel, and ultimately located the right owner-user buyer despite no on-site parking and deferred condition.', 'Another example of The Hirth Group turning a complex situation into a clean, successful closing.'] },
  { title: '144 N Clark Drive', meta: 'Beverly Hills, CA 90211', status: 'closed', dealType: 'Multifamily', price: '$2,865,000', image: S + '144-n-clark.jpg', headline: 'Eight Unit Apartment Building', tagline: 'The Hirth Group represented our client in this transaction.', description: ['The Hirth Group represented our client in the successful sale of 144 N. Clark Drive, a fully repositioned 8-unit multifamily asset in the heart of Beverly Hills. Situated on a quiet, tree-lined street moments from Beverly Drive, Wilshire Boulevard, and Rodeo Drive, the property traded in one of Los Angeles’ most desirable residential enclaves.', 'Through a competitive marketing campaign and disciplined negotiation, our team delivered certainty of execution and a result that reflected the asset’s full repositioned value.'] },
  { title: '2525 E Ball Road', meta: 'Anaheim, CA 92806 · Express Car Wash', status: 'closed', image: CLO + 'n02.jpg', dealType: 'Single Tenant Net Lease', representation: 'Buyer & Seller', specs: ['±4,840 SF Improvements', '±38,370 SF Land', '5.05% CAP', '25-Year Absolute Ground Lease'], headline: 'Newly Constructed Express Car Wash', tagline: '5.05% CAP Rate · All-Cash Closing · The Hirth Group represented both the buyer and the seller.', description: ['Alex Reyhan and Daniel Hirth of The Hirth Group are pleased to announce the successful closing of 2525 E Ball Road, Anaheim, CA 92806.', 'The property consists of a newly constructed, institutional-quality express car wash situated on approximately ±38,370 square feet of land with ±4,840 square feet of improvements. Strategically located at the signalized intersection of E Ball Road and Sunkist Street, just off the 57 Freeway, the asset benefits from exposure to approximately ±80,000 vehicles per day and exceptional regional accessibility.', 'Positioned within one of Orange County’s most dynamic trade areas, the property is located approximately 2.5 miles from Disneyland Resort, in close proximity to the Honda Center, and approximately 1.5 miles from Angel Stadium. The surrounding Platinum Triangle and Anaheim Resort District continue to experience significant public and private investment, reinforcing long-term fundamentals and sustained consumer traffic in the immediate corridor.', 'The asset is secured by a 25-year absolute ground lease, providing true passive ownership with zero landlord responsibilities and long-term income stability. Notably, The Hirth Group brought the property to market prior to the car wash opening to the public, successfully generating multiple competitive offers during pre-stabilization.', 'In a capital markets environment characterized by elevated interest rates, cautious underwriting, and limited transaction velocity, the team executed an all-cash closing at a 5.05% CAP rate. The buyer, a repeat client of The Hirth Group, strategically acquired the asset for long-term cash flow durability and bonus depreciation benefits, while the seller achieved premium pricing in a market where many comparable assets are experiencing extended marketing timelines and price discovery challenges.', 'This transaction further demonstrates The Hirth Group’s ability to create a competitive marketing campaign, structure certainty, and deliver institutional-level execution; even in a constrained capital markets environment.', 'The Hirth Group represented both the buyer and the seller in this transaction.'] },
  { title: '1329 2nd Avenue', meta: 'Los Angeles, CA 90019 · Mid-City', status: 'closed', image: CLO + '1329-2nd.jpg', price: '$1,365,000', dealType: 'Multifamily', representation: 'Buyer & Seller', specs: ['4 Fully Remodeled Units', '7.33% CAP', '$227,500 Per Unit'], headline: 'Four-Unit Apartment Building', tagline: '7.33% CAP Rate | $227,500 Per Unit · The Hirth Group represented both the buyer and the seller.', description: ['Daniel Hirth and Alex Reyhan of The Hirth Group are proud to announce the successful closing of 1329 2nd Avenue in Los Angeles, CA 90019. Located in the heart of the Mid-City submarket, this transaction represents a strong investment outcome for both buyer and seller.', 'The property consists of four fully remodeled units with a highly desirable unit mix, offering immediate cash flow and long-term upside. The asset traded at a 7.33% cap rate, $227,500 per unit, providing the buyer with strong in-place income and future value-add potential in one of Los Angeles’ most resilient rental markets.', 'This transaction was particularly meaningful as the seller was a repeat client, successfully executing another disposition, while the buyer was a first-time investor, acquiring a stabilized asset with upside in a prime Mid-City location. Through clear communication, thoughtful structuring, and hands-on guidance, the deal moved efficiently from contract to closing.', 'Daniel Hirth and Alex Reyhan represented both the buyer and the seller, ensuring alignment on expectations and a smooth, seamless closing. The result was a true win-win transaction and another example of The Hirth Group’s commitment to delivering exceptional outcomes for our clients.'] },
  { title: '1101 Saviers Road', meta: 'Oxnard, CA 93033 · Auto Center', status: 'closed', image: CLO + '1101-saviers.jpg', price: '$2,500,000', dealType: 'Automotive / Retail', representation: 'Buyer & Seller', specs: ['4,814 SF Building', '65,340 SF Lot', '$519.32/SF Building', '$38.26/SF Land'], headline: 'Hard-Corner Auto Repair Facility', tagline: '$519.32/SF Building | $38.26/SF Land · The Hirth Group represented both the buyer and the seller.', description: ['Daniel Hirth and Alex Reyhan of The Hirth Group are proud to announce the successful closing of 1101 Saviers Road in Oxnard, CA — marking another strategic win for our clients and our team.', 'Positioned on the hard corner of W. Wooley Road & S. Oxnard Blvd, 1101 Saviers Road consists of a 4,814 SF auto repair facility on a 65,340 SF lot in a high-traffic, high-visibility location. The property sold for $2,500,000, equating to $519.32 per square foot on the building and $38.26 per square foot on the land.', 'Leveraging our deep market knowledge and long-standing relationships, The Hirth Group executed an off-market strategy, approaching the existing tenant and creating urgency around securing long-term control of the asset. Despite the challenge of the tenant’s nearly 20-year modified gross lease with multiple options — which the tenant viewed as “practically owning the property” — our team navigated the negotiation with precision and positioned the buyer for long-term success.', 'We also guided the buyer through the SBA financing process, ensuring a seamless transaction from initial discussions through closing. The seller, a repeat client, successfully capitalized on this disposition to complete a cash-out exit.', 'This transaction closed with 45 days of due diligence and a 75-day escrow, with The Hirth Group representing both Buyer and Seller from start to finish.'] },
  { title: '3015 Durfee Avenue', meta: 'El Monte, CA 91732 · Multi-Tenant Industrial Property', status: 'closed', image: CLO + '3015-durfee.jpg', price: '$3,990,000', dealType: 'Industrial', representation: 'Buyer & Seller', specs: ['10 Units', '5.78% CAP', 'Fully NNN Leases', '45-Day Close'], headline: '10-Unit Mixed-Use Industrial Property', tagline: '5.78% CAP Rate · Off-Market Sale · The Hirth Group represented both the buyer and the seller.', description: ['The Hirth Group proudly announces the successful off-market sale of 3015 Durfee Avenue in El Monte, California — a rare 10-unit mixed-use industrial property strategically positioned in the heart of the San Gabriel Valley. Daniel Hirth and Alex Reyhan of The Hirth Group represented both Buyer and Seller, delivering a record-setting sale that exemplifies the team’s unmatched ability to source, negotiate, and execute commercial transactions.', 'The property sold for $3,990,000 at a 5.78% capitalization rate on fully NNN leases, showcasing the strength of stabilized income-producing assets in one of Southern California’s most desirable industrial submarkets. Through a 30-day due diligence period and a 45-day close, The Hirth Group guided both parties seamlessly through an accelerated escrow process — including securing financing for the buyer — ensuring a smooth, strategic, and highly efficient transaction from start to finish.', 'This transaction further reinforces The Hirth Group’s dominance in the Los Angeles industrial market, where their deep relationships, market intelligence, and transactional precision continue to set new benchmarks for execution. The sale of 3015 Durfee Avenue highlights the ongoing demand for well-located, income-generating industrial assets with strong physical fundamentals and limited supply. The property’s combination of modern construction, clear height, NNN leases, and multi-tenant configuration made it a highly coveted investment among institutional and private buyers alike.', 'The sale of 3015 Durfee Avenue is yet another example of The Hirth Group’s unparalleled ability to create value, structure creative deals, and deliver results others can’t. With exceptional market command, deep client relationships, and flawless execution, Daniel Hirth and Alex Reyhan continue to raise the standard for brokerage excellence in Southern California’s commercial real estate market.'] },
  { title: '2226 S Sepulveda Boulevard', meta: 'Los Angeles, CA 90064 · Two-Story Industrial Property', status: 'closed', image: CLO + 'n06.jpg', price: '$3,425,000', dealType: 'Industrial', representation: 'Buyer', headline: 'Two-Story Industrial Property With Retail Frontage', tagline: 'Off-market · Non-contingent all-cash offer · 10-day close with zero retrade · $252/SF.', specs: ['13,585 SF Building', '9,521 SF Lot', '$252/SF', '10-Day Close', 'Delivered Vacant'], description: ['Daniel Hirth and Alex Reyhan of The Hirth Group are proud to announce the successful off-market sale of 2226 S Sepulveda Blvd — a rare 13,585 SF two-story industrial property with highly sought-after retail frontage in the heart of West Los Angeles.', 'Situated on a 9,521 SF lot along the high-visibility Sepulveda Blvd corridor (between Pico & Olympic), this transaction represents a rare opportunity in one of West LA’s tightest submarkets.', 'After sitting on the market as a for-sale-by-owner listing for over a year without movement, The Hirth Group stepped in and delivered results. Leveraging our extensive network and strategic approach, we sourced the ideal buyer off-market, structured a non-contingent, all-cash offer, and executed a 10-day close with zero retrade.', 'The property will be delivered vacant, offering the buyer a blank shell to remodel, reposition, and unlock tremendous value. At $252/SF, this sale highlights both the continued demand for quality assets in prime West LA and the ability of The Hirth Group to create immediate opportunities where others could not.'] },
  { title: '1217–1223 Centinela Avenue', meta: 'Inglewood, CA 90301 · Educational Facility', status: 'closed', image: CLO + '1217-centinela.jpg', price: '$7,700,000', dealType: 'Educational Facility', representation: 'Seller', specs: ['11,647 SF Building', '39,121 SF Lot', '$660+/SF Building', 'Closed in Under 100 Days'], headline: 'Record-Setting Educational Facility', tagline: 'Highest price per SF ever achieved for an educational facility of this size in Inglewood.', description: ['The Hirth Group is pleased to announce the successful closing of 1217–1223 Centinela Avenue, Inglewood, CA 90301 — a daycare/educational facility located in the northwestern portion of Inglewood. The property consists of 11,647 SF of building on an estimated 39,121 SF lot. The building had been vacant for more than three years and carried significant deferred maintenance.', 'Alex and Daniel represented the seller, whose motivation to sell stemmed from the prolonged vacancy and a desire to see the property revitalized to serve children in an underserved community. The buyer, a non-profit entity, plans to redevelop the asset into a K–12 educational facility — a much-needed addition for Inglewood.', 'The Hirth Group’s close collaboration with the seller to strategize, position, and execute on her real estate goals is what sets the team apart. Within the first few weeks of marketing, the team generated multiple offers for both sale and lease, ultimately selecting the buyer best aligned with the seller’s vision. Escrow closed in just under 100 days with no re-trade.', 'At over $660/SF on the building and just under $200/SF on the land, The Hirth Group achieved a record-setting price — the highest price per SF for an educational facility of this size ever in Inglewood. Known for breaking records and consistently delivering in challenging markets, The Hirth Group once again demonstrated the ability to maximize value and provide results sellers can count on.'] },
  { title: 'Chipotle — 2929 Berry Street', meta: 'Fort Worth, TX', status: 'closed', image: CLO + 'n08.jpg', tagline: 'The Hirth Group represented our client in this transaction.', description: ['The Hirth Group represented our client in the successful sale of Chipotle, a single-tenant net-leased retail asset located in Fort Worth. The transaction closed as part of the firm’s extensive track record across the greater Los Angeles commercial real estate market.', 'The assignment reflects The Hirth Group’s expertise across retail, industrial, office, and multifamily product types, and our commitment to maximizing value for every client.'] },
  { title: '7569 Woodman Place', meta: 'Van Nuys, CA 91405 · Freestanding Industrial', status: 'closed', image: CLO + '7569-woodman.jpg', price: '$2,350,000', dealType: 'Industrial', representation: 'Buyer & Seller', specs: ['±7,192 SF Building', '±19,510 SF Corner Lot', 'LAMR2 Zoning', 'Full List Price'], headline: 'Freestanding Corner-Lot Industrial Building', tagline: 'Full list price · SBA-financed owner-user · The Hirth Group represented both the seller and the buyer.', description: ['Ethan Donel, Alex Reyhan, and Daniel Hirth of The Hirth Group are proud to announce the successful closing of 7569 Woodman Place, Van Nuys, CA 91405. This freestanding ±7,192 SF metal building sits on a prominent ±19,510 SF corner lot, zoned LAMR2 — a designation with far more restrictions on allowable uses compared to broader industrial zoning such as M1 or M2. From the start, our team understood these limitations and strategically targeted a niche pool of qualified buyers who could thrive within the property’s permitted uses.', 'This was a transaction years in the making. The property went into escrow twice before, and in that time, market conditions shifted dramatically — higher interest rates, reduced buyer activity, and a more selective lending environment. But our team never stopped pushing. We re-engaged the market multiple times, keeping the seller confident in our ability to deliver, and ultimately secured a full list price sale.', 'We identified and secured a motivated owner-user — a first-time commercial property purchaser — who obtained SBA financing. We guided him through every step of the process, from offer to close. In the final days before escrow, unexpected insurance requirements nearly delayed the deal, ranging from something as minor as adding a fire extinguisher to major safety and liability work such as completely resurfacing the lot. Our team moved quickly, coordinating multiple vendors to complete the work on time so insurance could bind, and escrow could close without delay.', 'For the seller, this sale was part of a broader strategy to liquidate California holdings and expand operations into a large Atlanta facility, taking advantage of the state’s booming film industry market. For the buyer, the property will be transformed into a high-end recycling center for metals, plastics, and all types of scrap — breathing new life into a challenging-to-place Van Nuys asset.', 'This closing showcases The Hirth Group’s deep market knowledge, strategic buyer targeting, and relentless execution — delivering results even when the odds are stacked against the deal.'] },

 depreciation benefits, while the seller achieved premium pricing in a market where many comparable assets are experiencing extended marketing timelines and price discovery challenges.', 'This transaction further demonstrates The Hirth Group’s ability to create a competitive marketing campaign, structure certainty, and deliver institutional-level execution — even in a constrained capital markets environment. The Hirth Group represented both the buyer and the seller in this transaction.'] },
  { title: '6226 Vineland Avenue', meta: 'North Hollywood, CA 91606 · Two-Story Office Building', status: 'closed', image: CLO + 'n10.jpg', price: '$850,000', dealType: 'Office', representation: 'Buyer & Seller', headline: 'Freestanding Two-Story Office Building', tagline: 'All-cash · 30-day close · 5-day due diligence · The Hirth Group represented both the sellers and the buyer.', specs: ['±4,310 SF Building', '±8,563 SF Lot', 'LARD1.5 Zoning', 'All-Cash 30-Day Close'], description: ['Ethan Donel, Alex Reyhan, and Daniel Hirth of The Hirth Group are proud to announce the successful closing of 6226 Vineland Avenue, North Hollywood, CA 91606. This freestanding, two-story office building features ±4,310 square feet of space on an ±8,563 SF LARD1.5-zoned lot, offering exceptional potential in a highly active San Fernando Valley corridor.', 'The Hirth Group represented both the sellers and buyer in this transaction. After years of staying in close contact with the sellers — consistently providing market insights and strategic guidance — we were ultimately trusted to handle the sale when the time was right. The sellers, having retired, no longer had use for the building and were seeking a smooth exit.', 'We identified a motivated owner-user buyer who moved swiftly, securing the deal all-cash with a 30-day close and only a 5-day due diligence period — a rare structure in today’s market, especially for an asset with substantial deferred maintenance. The buyer intends to transform the building into the new headquarters for their growing business.', 'Despite the property’s physical challenges, our team successfully navigated a fast-paced transaction by leveraging deep submarket experience, strategic execution, and hands-on involvement from start to finish.', 'This sale is another example of The Hirth Group’s commitment to delivering value and performance — whether it’s working with clients over many years or executing highly efficient closings under tight timelines.'] },
  { title: '2319 W Magnolia Boulevard', meta: 'Burbank, CA 91506 · Two-Story Office Building', status: 'closed', image: CLO + '2319-magnolia.jpg', price: '$1,350,000', dealType: 'Office', representation: 'Buyer & Seller', specs: ['±2,111 SF Building', '±2,625 SF Lot', 'BUC3YY Zoning', '98% of List Price'], headline: 'Two-Story Office Building on Magnolia Boulevard', tagline: 'Closed at 98% of list price · Over a dozen competitive offers · The Hirth Group represented both the seller and the buyer.', description: ['Ethan Donel, Alex Reyhan, and Daniel Hirth of The Hirth Group are proud to announce the successful closing of 2319 W Magnolia Boulevard, Burbank, CA 91506. This well-located, two-story office building features ±2,111 square feet of space on a ±2,625 SF BUC3YY-zoned lot, positioned along the highly visible thoroughfare of Magnolia Boulevard.', 'The Hirth Group represented both the seller and buyer in this transaction, generating over a dozen competitive offers. Prior to our involvement, the property had been listed with another firm but received little to no traction. Leveraging our market dominance, we advised the seller on a refreshed pricing and positioning strategy — reigniting interest and driving momentum.', 'The road to closing wasn’t without its challenges. The property entered escrow multiple times and fell out, but our team remained relentless throughout the process. We continued to push forward, re-engaging buyers, maintaining momentum, and ultimately delivering results for our client. Our commitment to performance never wavered.', 'We ultimately identified an ideal owner-user buyer, already SBA pre-approved, and negotiated a deal that closed at 98% of list price. Capitalizing on our deep experience in the Burbank submarket and strong negotiation skills, we were able to protect seller value and close near full asking — a major win in today’s commercial real estate climate. Despite volatility in the current financing environment, our team remained hands-on throughout the process — working closely with the buyer, their lender, and the SBA to ensure a seamless and efficient escrow for all parties involved.', 'After outgrowing the space, the seller upgraded to a larger nearby facility — opening the door for a rare owner-user opportunity in the heart of Burbank. The buyer moved quickly to capitalize on the moment and will now transform the property into the new headquarters for their growing company.'] },
  { title: '6334 Laurel Canyon Boulevard', meta: 'North Hollywood, CA 91606 · Turnkey Retail/Office Space', status: 'closed', image: CLO + 'n12.jpg', price: '$1,025,000', dealType: 'Retail/Office', representation: 'Seller', headline: 'Turnkey Single-Tenant Retail/Office Building', tagline: 'Closed $30,000 above list price · 15-day inspection · 27-day close.', specs: ['±2,200 SF Building', '±2,755 SF Lot', 'C2 Zoning', '$30K Above List'], description: ['Ethan Donel, Alex Reyhan, and Daniel Hirth of The Hirth Group are proud to announce the successful closing of 6334 Laurel Canyon Boulevard, North Hollywood, CA 91606. This well-located, turnkey retail property features ±2,200 square feet of single-tenant space on a ±2,755 SF C2-zoned lot, positioned along the highly trafficked Laurel Canyon corridor.', 'The team represented the seller in this transaction and received strong interest from multiple qualified parties. We advised the seller on a sharp, market-aligned pricing strategy that attracted strong interest and created immediate competition in a difficult real estate market. Our team launched an aggressive outreach campaign targeting qualified buyers, which led to significant traction early on. Ultimately, we procured a buyer who performed on a 15-day inspection period and a 27-day close, securing a final sale $30,000 above list price. Even with the headwinds of today’s market, this successful outcome underscores our team’s ability to execute under pressure and deliver results through expert positioning, aggressive marketing, and disciplined negotiation.', 'The seller chose to bring the property to market as part of a broader strategy to liquidate his holdings in Los Angeles. Recognizing the rising demand along Laurel Canyon — driven by incoming developments and area growth — he seized the opportunity to capitalize on current market momentum.'] },
  { title: '130 E Manchester Boulevard', meta: 'Inglewood, CA 90301 · Single-Tenant Retail', status: 'closed', image: CLO + 'n13.jpg', price: '$1,250,000', dealType: 'Single-Tenant Retail', representation: 'Buyer', headline: 'Hard-Corner Single-Tenant Retail Building', tagline: 'All-cash transaction · The Hirth Group represented the buyer.', specs: ['1,613 SF Building', '7,284 SF Lot', 'Hard Corner', 'All-Cash Close'], description: ['Daniel Hirth of The Hirth Group is proud to announce the successful closing of 130 E Manchester Blvd, Inglewood, CA 90301. Representing the buyer, we navigated multiple challenges, including potential contamination concerns and building violations. Despite these obstacles, we successfully negotiated a credit for our client, ensuring a favorable outcome.', 'This all-cash transaction involved a single-tenant retail building situated on the high-traffic corner of Manchester Blvd and S La Brea Avenue, one of Inglewood’s key intersections. The 1,613 SF building on a 7,284 SF lot presents a strong investment opportunity, with the buyer planning to lease the property for long-term income. The seller, who owned the property for many years, decided to sell as part of their retirement strategy. This deal exemplifies our commitment to overcoming challenges and delivering results for our clients.', 'Daniel continues to be known as a go-to broker in Inglewood and the surrounding markets.'] },
  { title: '10020 Venice Boulevard', meta: 'Culver City, CA 90232 · Retail Shopping Center', status: 'closed', dealType: 'Multi-Tenant Retail', price: '$6,695,000', image: CLO + '10020-venice.jpg', representation: 'Buyer', headline: 'Premier Culver City Retail Shopping Center', tagline: 'Nearly a dozen competing offers · The Hirth Group represented the buyer.', specs: ['9,773 SF Building', '16,826 SF Lot', '8 Storefronts', '7 Tenants'], description: ['The Hirth Group is pleased to announce the successful closing of 10020 Venice Boulevard, located in Culver City, CA. Alex Reyhan and Daniel Hirth represented the buyer on this premier retail shopping center, which spans 9,773 square feet on a 16,826 square foot lot, featuring eight storefronts and seven tenants.', 'Despite navigating a competitive process with nearly a dozen offers, our team’s strategic approach secured this exceptional investment opportunity for our client, underscoring our dedication to delivering outstanding results in the commercial real estate market.'] },
  { title: '11132 Fleetwood Street', meta: 'Sun Valley, CA 91352 · Multi-Tenant Industrial Complex', status: 'closed', dealType: 'Multi-Tenant Industrial', price: '$4,925,000', image: CLO + '11132-fleetwood.jpg', representation: 'Seller', headline: 'Eleven-Unit Multi-Tenant Industrial Complex', tagline: 'Closed at nearly 99% of list price · 2.58% CAP · Nearly 50% upside in rents.', specs: ['11 Units', '±18,043 SF Building', '±33,376 SF Lot', 'M1 Zoning', '2.58% CAP'], description: ['Ethan Donel, Alex Reyhan, and Daniel Hirth of The Hirth Group are proud to announce the successful closing of 11132 Fleetwood Street, Sun Valley, CA 91352. The subject property is an eleven (11) unit multi-tenant industrial complex — a highly sought-after product type with nearly 50% upside in rents. The building stands at ±18,043 SF spanning across an estimated ±33,376 square foot lot, zoned M1.', 'Our team, representing the seller and having identified the buyer, skillfully navigated market challenges and the insignificant in-place income to attract the ideal buyer through a targeted marketing strategy. Prior to going to market, the team generated strong interest, securing multiple offers from qualified buyers and nearly a dozen more within the first two weeks of going to market. Through strategic negotiation, The Hirth Group achieved nearly 99% of its list price, closing the property at $4,925,000 and a 2.58% CAP rate.', 'A short-term seller carryback was structured to provide the seller with passive income while also supporting the buyer through renovations and repositioning of the asset. This transaction highlights The Hirth Group’s dedication to offering comprehensive services, from engaging with individual tenants to secure estoppels to collaborating closely with legal counsel on drafting loan documents.'] },
  { title: '1501 Main Street', meta: 'Venice, CA 90291 · Retail/Office Mixed-Use Building', status: 'closed', dealType: 'Mixed Use', price: '$8,900,000', image: CLO + '1501-main.jpg', representation: 'Buyer', headline: 'Retail/Office Mixed-Use Building a Block From Venice Beach', tagline: '$1,290,000 negotiated off the purchase price · 6.43% CAP rising to a projected 8.14% · The Hirth Group represented the buyer.', specs: ['13,582 SF Building', '16,379 SF Lot', '6 Retail + 7 Office', 'NNN Leases', '6.43% CAP | 8.14% Pro Forma'], description: ['Alex Reyhan and Daniel Hirth of The Hirth Group are proud to announce the successful closing of 1501 Main St, Venice, CA 90291.', 'This premier retail/office mixed-use property spans an impressive 13,582 SF of building space on a 16,379 SF lot and features ample rear parking — a rare and highly coveted asset in Venice, CA.', 'Representing the buyer, a valued repeat client, Alex and Daniel expertly navigated the acquisition to fulfill their 1031 exchange. The property is ideally located just a block from world-renowned Venice Beach, comprising 6 retail storefronts and 7 office suites, all under NNN leases. With a 20% value-add opportunity from upcoming lease renewals, the CAP rate is projected to rise from 6.43% to 8.14%.', 'Additionally, the buyer secured nearly 60% LTV financing at 5.75% for 5 years, setting the stage for a strong long-term investment. Through strategic negotiation, The Hirth Group achieved $1,290,000 off the purchase price, closing the deal at $8,900,000.', 'This transaction underscores The Hirth Group’s commitment to delivering unparalleled results and exceeding client expectations in Southern California’s competitive commercial real estate market.'] },
  { title: '14602 Victory Boulevard', meta: 'Van Nuys, CA 91411 · Two-Story Medical Office Building', status: 'closed', dealType: 'Medical Office', price: '$4,400,000', image: CLO + '14602-victory.jpg', representation: 'Buyer & Seller', headline: 'Two-Story Medical Office Building', tagline: 'All-cash close · C2/R3 zoning with TOC Tier 4 supporting up to 94 units.', specs: ['±15,691 SF Building', '±25,989 SF Total Land', 'C2 / R3 · TOC Tier 4', 'Up to 94 Units'], description: ['Ethan Donel, Alex Reyhan, and Daniel Hirth of The Hirth Group are pleased to announce the successful closing of 14602 Victory Boulevard, Van Nuys, CA 91411. The subject property is a two-story medical office building. The building stands at ±15,691 SF of building on a ±12,983 SF hard corner lot with an additional parking lot in the rear of ±13,006 SF, totaling ±25,989 SF of land.', 'Our team, representing both the seller and the buyer, skillfully navigated market challenges and the dismal current income to attract a buyer through a targeted marketing strategy. Despite limited demand for large medical office spaces, our agents took an alternative approach and highlighted the property’s valuable underlying C2 and R3 zoning, coupled with its TOC Tier 4 designation. This zoning potential supports the development of up to 94 units in the vibrant Downtown Van Nuys area.', 'The Hirth Group is proud to serve clients in an advisory capacity. Over the past four years, our team collaborated closely with the seller to determine the best strategy for maximizing asset value and ensuring a seamless closing. Given the current tight financing environment, the seller sought an all-cash buyer, and our repeat client met this need perfectly, facilitating a smooth escrow process. This transaction represents another upcoming development in Van Nuys, a neighborhood undergoing notable growth, fueled by the anticipated new Light Rail Metro along Van Nuys Boulevard.'] },
  { title: '3108 W. Magnolia Boulevard', meta: 'Burbank, CA 91505 · Single Tenant Retail Building', status: 'closed', dealType: 'Retail', price: '$1,660,000', image: CLO + 'n18.jpg', representation: 'Seller', headline: 'Single Tenant Retail in the Magnolia Business Park District', tagline: 'Closed above list price · $82,500 non-refundable pass-through · One of the highest price-per-SF retail sales in Burbank.', specs: ['±1,925 SF Building', '±2,672 SF Lot', 'Closed Above List'], description: ['Ethan Donel, Alex Reyhan, and Daniel Hirth of The Hirth Group are pleased to announce the successful closing of 3108 W Magnolia Boulevard, Burbank, CA 91505. Our agents represented the seller in this transaction, who aimed to liquidate their holdings in California. This property is a single tenant retail storefront in the highly desirable Magnolia Business Park District of Burbank, featuring approximately ±1,925 SF of building on a lot showcasing ±2,672 SF of land.', 'Notably, prior to The Hirth Group’s involvement, the property was listed with another firm for an entire year at a much lower asking than our closing price. Leveraging the team’s extensive resume in the San Fernando Valley and market knowledge, we were able to generate a high level of interest, ultimately leading to a closing above the list price. Through our strategic marketing efforts and the current market uncertainties, we also secured an $82,500 non-refundable pass-through deposit to our seller upon the opening of escrow, ensuring the buyer’s commitment to proceed with the sale.', 'This transaction marks one of the highest price per square foot sales along Magnolia Boulevard and for retail in the City of Burbank.'] },
  { title: '18934 Ventura Boulevard', meta: 'Tarzana, CA 91356 · Multi-Tenant Retail Building', status: 'closed', dealType: 'Multi-Tenant Retail', price: '$5,000,000', image: CLO + '18934-ventura.jpg', representation: 'Seller', headline: 'Three-Storefront Retail Building on Ventura Boulevard', tagline: '$527 per SF · All-cash buyer · 21-day due diligence · 26-day close.', specs: ['±9,480 SF Building', '±28,266 SF Corner Lot', '3 Retail Storefronts', '$527/SF', '26-Day Close'], description: ['Ethan Donel, Alex Reyhan, and Daniel Hirth of The Hirth Group are proud to announce the successful closing of 18934 Ventura Boulevard, Tarzana, CA 91356. This asset consists of three large retail storefronts along Ventura Boulevard, boasting approximately ±9,480 square feet of building on a corner lot of ±28,266 square feet.', 'It’s important to note that prior to The Hirth Group’s involvement, the property was listed with a different firm local in the San Fernando Valley for an entire year without success. Before taking the property to market, our agents identified several significant hurdles: a grossly underperforming asset, a significant amount of vacancy, and unfavorable leases for the landlord. Recognizing these challenges, our agents leveraged their market expertise and extensive network to secure multiple offers from investors and owner-users. Our agents also negotiated with the buyer to cover commissions for both the seller’s and buyer’s agents, significantly enhancing the seller’s net proceeds.', 'Ultimately, Ethan Donel, Alex Reyhan, and Daniel Hirth closed the transaction at $5,000,000, or $527 per SF, representing a current CAP rate just shy of 2%. The buyer was all cash with a 21-day due diligence period and a 26-day close.'] },
  { title: '521–525 Hyde Park Place', meta: 'Inglewood, CA 90302 · Daycare Facility & Office', status: 'closed', dealType: 'Daycare Facility/Office', price: '$1,677,000', image: CLO + '521-hyde.jpg', representation: 'Seller', headline: 'Operating as a Daycare Facility & Office', tagline: 'The Hirth Group represented the seller in this transaction.', specs: ['±3,782 SF Building', '±12,014 SF Lot', 'Tenant in Place ~10 Years'], description: ['The Hirth Group is pleased to announce the successful closing of 521–525 Hyde Park Place, Inglewood, CA 90302 — a daycare center/preschool located directly off Centinela Avenue in Inglewood. Daniel represented the seller in this transaction, whose motivation to sell the asset was due to allocating funds for other investments. The buyer was an owner/user who had future plans of occupying the building for his own daycare/preschool.', 'The Hirth Group was able to navigate a relatively smooth escrow process, negotiating minor credit requests and one escrow extension from the buyer to obtain financing.', '521–525 Hyde Park Place consists of ±3,782 SF of building on a ±12,014 SF lot. The property was sold with the tenant in place, who has been there for nearly 10 years. The asset is strategically located in the northeastern section of Inglewood, in a cozy and quiet residential community.', 'Daniel continues to be known as a go-to broker in Inglewood and the surrounding markets.'] },
  { title: '5358 Cartwright Avenue', meta: 'North Hollywood, CA 91601 · Industrial Building', status: 'closed', dealType: 'Industrial Building', price: '$2,400,000', image: CLO + '5358-cartwright.jpg', representation: 'Seller', headline: 'Bow-Truss Industrial Building on a Corner Lot', tagline: 'Full list price · All-cash buyer · 20-day close · $250,000 non-refundable pass-through.', specs: ['±4,960 SF Building', '±11,885 SF Corner Lot', 'LAMR1 Zoning', '20-Day Close'], description: ['The Hirth Group is delighted to announce the successful closing of 5358 Cartwright Avenue, situated in the heart of the North Hollywood Arts District. This property features a well-preserved industrial building with a distinctive bow-truss ceiling, encompassing approximately 4,960 square feet on an estimated 11,885 square foot corner lot, zoned LAMR1.', 'Ethan Donel, Alex Reyhan, and Daniel Hirth represented the seller in this transaction. During the first two weeks of marketing, the property received over a dozen offers. Due to a high demand for industrial space in the North Hollywood area, our team effectively sparked a bidding war for this asset, which led to a closing at the full list price with an all-cash buyer. The buyer had a 5-day due diligence period, and the deal closed in 20 days. Through a combination of our strategic marketing efforts and the current market uncertainties, we were also able to secure a $250,000 non-refundable pass-through to our seller upon the removal of contingencies, ensuring the buyer’s commitment to proceed with the sale.', 'This transaction marked the first sale for the seller’s family in the past four decades, and our agents took great responsibility to ensure that the seller received maximum compensation for their property.'] },
  { title: '256 W. Florence Ave & 7200–7218 S. Broadway', meta: 'Los Angeles, CA 90003 · 14 Retail Stores & 3 Apartments', status: 'closed', dealType: 'Mixed-Use Retail/ Residential', price: '$4,600,000', image: CLO + '7200-broadway.jpg', representation: 'Buyer & Seller', headline: 'Fourteen Retail Storefronts and Three Apartments', tagline: '6.98% CAP at full occupancy · All-cash buyer · 14-day due diligence · 21-day close.', specs: ['±17,074 SF Building', '±24,812 SF Lot', '4 Parcels', '14 Retail + 3 Residential', '6.98% CAP'], description: ['The Hirth Group is pleased to announce the successful closing of 256 W Florence Ave and 7200–7218 S Broadway. Alex Reyhan and Daniel Hirth represented both the buyer and seller in this transaction, securing an all-cash buyer with a 14-day due diligence period and a 21-day close. Daniel and Alex helped the buyers secure their first commercial acquisition, which traded at a CAP rate of 6.98% at full occupancy.', 'Located at the prominent intersection of Florence Avenue and Broadway, 256 W. Florence Avenue and 7200–7218 S. Broadway consist of four parcels. The properties include fourteen retail storefronts and three residential units, spanning approximately 17,074 square feet of building space on a ±24,812 square foot lot. Despite uncertainty in the commercial real estate market, Alex Reyhan and Daniel Hirth successfully navigated these challenges.', 'At The Hirth Group, we take pride in supporting our clients in every aspect of their transactions, adding value for both sellers and buyers.'] },
  { title: '6200 S. Western Avenue', meta: 'Los Angeles, CA 90047 · Signalized Corner-Lot Retail Building', status: 'closed', dealType: 'Retail Building & Parking Lot', price: '$605,000', image: CLO + 'n23.jpg', representation: 'Seller', headline: 'Signalized Corner-Lot Retail Building', tagline: 'Buyer satisfied a 1031 exchange · The Hirth Group represented the seller.', specs: ['Signalized Corner Lot', 'Retail + Parking Lot', '1031 Exchange Buyer'], description: ['Daniel Hirth of The Hirth Group is pleased to announce the successful sale of 6200 S. Western Avenue, Los Angeles, CA 90047. The seller’s motivation to liquidate the asset was due to vacancy, as well as motivation to give each owner their share of the property’s value in cash.', 'The buyer’s motivation to purchase this asset was purely for investment purposes and to satisfy his 1031 exchange. The team had to navigate a variety of issues during this transaction — most notably the high risk of potential contamination due to the property being operated as a gas station in the 1950s and 60s. By making strategic price reductions at the right times, The Hirth Group was able to confidently get the sellers the highest price possible for the subject property.'] },
  { title: '1501 & 1509 W. Magnolia Boulevard', meta: 'Burbank, CA 91506 · Mixed-Use Retail & Office Building', status: 'closed', dealType: 'Mixed-Use Retail/ Office Building', price: '$4,000,000', image: CLO + '1501-magnolia.jpg', representation: 'Buyer & Seller', headline: 'Mixed-Use Retail and Office Building', tagline: '$563 per square foot · Non-contingent buyer · 14-day close with $250,000 passed through nonrefundable.', specs: ['7,100 SF Building', '11,500 SF Corner Lot', '14 Parking Spaces', '$563/SF', '14-Day Close'], description: ['The Hirth Group is pleased to announce another successful closing of 1501 & 1509 W Magnolia Boulevard, Burbank, CA 91506. The subject property is a mixed-use building comprising both retail and office space. The building stands at 7,100 SF on an 11,500 SF corner lot with fourteen (14) parking spaces. At the time of close, 85% of the building was either month-to-month or vacant, while the retail storefront was leased.', 'Ethan Donel, Alex Reyhan, and Daniel Hirth represented both the seller and buyer in this transaction. Despite market concerns and a significant portion of the building being vacant office space, our team executed a strategic marketing campaign that attracted a buyer ready to move forward without any contingencies. This resulted in a swift 14-day close with $250,000 passed through nonrefundable to the seller at the open of escrow.', 'Notably, the property had previously been listed for sale two years prior with a different firm in a market with favorable interest rates. Additionally, a short-term seller carry was arranged to aid the buyer during renovations and repairs. The property was sold at an impressive $563 per square foot, totaling $4,000,000.'] },
  { title: '1327–1337 Abbot Kinney Boulevard', meta: 'Venice, CA 90291 · Multi-Tenant Retail', status: 'closed', dealType: 'Multi Tenant Retail', price: '$29,300,000', image: CLO + '1327-abbot.jpg', representation: 'Buyer', headline: 'Generational Acquisition', tagline: 'Ten retail storefronts on Abbot Kinney · $200,000 leasing credit negotiated for the buyer · The Hirth Group represented the buyer.', specs: ['±10,828 SF Building', '±13,448 SF Lot', '10 Retail Storefronts', 'Two Parcels', '1031 Exchange'], description: ['Alex Reyhan and Daniel Hirth of The Hirth Group are pleased to announce the successful closing of 1327–1337 Abbot Kinney Boulevard, Venice, CA. The Hirth Group played the role of representing the buyer in this transaction, a valued client going through a 1031 exchange, seeking a trophy retail asset with a strong return, an A+ location, and a value-add component. Throughout the process, Alex Reyhan and Daniel Hirth collaborated with our client to ensure a timely exchange and pinpoint the ideal property that met the buyer’s criteria.', '1327–1337 Abbot Kinney Boulevard, located on one of the most pristine, prestigious, and reputable streets in California, consisted of two parcels spanning a total of ten (10) retail storefronts. The subject property comprises approximately 10,828 SF of building on a 13,448 SF lot. Alex Reyhan and Daniel Hirth overcame many hurdles, including an unexpected vacancy during escrow, which added complexity to the financing of the property. Due to the unforeseen vacancy, The Hirth Group stepped up and negotiated a new lease with a national credit tenant, resulting in an increase of nearly double the rent for the vacant unit. Additionally, Alex Reyhan and Daniel Hirth were able to hold the seller responsible for all leasing costs — including leasing commission, tenant improvements, and rent abatements — crediting the buyer $200,000 for the lease. The Hirth Group was able to assist our buyer in obtaining financing at 60% LTV and 6.06% for a 3-year fixed term with interest-only payments.', 'The Hirth Group takes pride in helping their clients in an advisory role, adding value in all aspects of the transaction — from identifying opportunities to securing the deal and financing, all while keeping the escrow process smooth and seamless. Throughout the process, Alex Reyhan and Daniel Hirth partnered with the buyer, offering support in underwriting, strategizing, and successfully navigating through escrow to complete the transaction.'] },
  { title: 'Dollar General Market', meta: '4000 E. 9th Street, Texarkana, AR 71854 · Single Tenant NNN', status: 'closed', image: CLO + 'n26.jpg', price: '$1,925,000', dealType: 'Single Tenant Net Lease', representation: 'Buyer', headline: 'Dollar General Market | 1031 Exchange | NNN', tagline: 'Brand-new 2023 construction · 15-year corporate-guaranteed lease · Zero landlord responsibilities.', specs: ['2023 Construction', '15-Year Corporate Lease', 'Zero Landlord Responsibilities', '1031 Exchange'], description: ['Alex Reyhan and Daniel Hirth of The Hirth Group are pleased to announce yet another successful closing. The Hirth Group was able to assist a valued repeat client on their 1031 exchange, looking to purchase a NNN investment with a secured long-term corporate lease. Leveraging our expertise, Alex Reyhan and Daniel Hirth presented a diverse amount of exchange opportunities, helping the client better understand and identify the ideal exchange that would meet their goals.', 'The Hirth Group assisted with the sale of a Dollar General Market in Texarkana, AR. The asset is a brand-new 2023 construction with a newly negotiated 15-year lease, corporate guaranteed by Dollar General, and with zero landlord responsibilities. DG Market relocated their store from a previously existing site less than a quarter mile away. Dollar General Market stores are DG’s grocery store concept, and they are projecting a very large sales volume based on their previous store’s revenue numbers.'] },
  { title: '2700 North Main Street', meta: 'Santa Ana, CA 92705 · Twelve-Story Office Tower', status: 'closed', dealType: 'Office Building', price: '$18,600,000', image: CLO + '2700-main.jpg', representation: 'Buyer', headline: 'Twelve-Story Office Tower', tagline: 'Negotiated off-market nearly 10% below the seller’s 2016 acquisition cost, with a $1,250,000 credit to the buyer.', specs: ['120,560 SF Building', '±196,020 SF Land', '1031 Exchange', '$1.25M Seller Credit', 'Entitlements for 300+ Units'], description: ['Alex Reyhan and Daniel Hirth of The Hirth Group are pleased to announce the successful closing of 2700 N Main St, Santa Ana, CA. The Hirth Group played the role of representing the buyer, a valued client engaged in a 1031 exchange, seeking an office building at a favorable price per square foot. Throughout the process, Alex Reyhan and Daniel Hirth collaborated with the buyer, identifying several off-market opportunities to ensure a timely exchange and pinpointing the ideal property that met the buyer’s criteria.', 'Situated in Santa Ana, adjacent to the MainPlace Mall, 2700 N Main Street is a notable high-rise office building comprising 120,560 square feet, with a significant portion — over 48% — of the property currently unoccupied. The property spans approximately 196,020 square feet of land. This distinctive opportunity presented various options for the buyer, including entitlements for over 300 units across the entire parcel or the possibility of maintaining the office building while constructing nearly 200 multifamily units in the rear.', 'The Hirth Group adeptly negotiated the sale off market, securing a price nearly 10% below the seller’s acquisition cost in 2016. Throughout the process, Alex Reyhan and Daniel Hirth partnered with the buyer, offering support in underwriting, strategizing, developing an exit strategy, and successfully navigating through escrow to complete the transaction. To safeguard the buyer’s interests, they successfully negotiated a $1,250,000 credit from the seller.'] },
  { title: '633 Rose Avenue', meta: 'Venice, CA 90291 · Mixed-Use Retail/Residential', status: 'closed', dealType: 'Mixed-Use Retail/ Residential', price: '$1,670,000', image: CLO + '633-rose.jpg', representation: 'Seller', headline: 'Mixed-Use Retail and Residential Building in Venice', tagline: 'Under contract within a month of taking over the listing · The Hirth Group represented the seller.', specs: ['±1,368 SF Building', '±3,481 SF Lot', 'Retail + 3 Studios', '3 Private Garages'], description: ['Daniel Hirth of The Hirth Group is pleased to announce the successful closing of 633 Rose Avenue, Venice, CA 90291 — a mixed-use retail/residential building comprised of ±1,368 SF of building on an estimated ±3,481 SF lot. The subject property contained a retail storefront and three studios with three private garages. Other than one studio, the building was delivered completely vacant.', 'The Hirth Group was called in to assist with the sale of the asset after another broker had the property on the market for several months with no luck in consummating a transaction. Within a month after taking over the listing, the team successfully found a buyer to transact while negotiating favorable terms for the seller. They were able to accomplish a longer escrow period for their client (the seller needed to sell business equipment and find a new residence out of state) and a shorter due diligence period for the buyer.', 'The seller’s motivation to liquidate the asset was due to retirement, while the buyer’s motivation to purchase the asset was due to a value-add opportunity in one of Los Angeles’ hottest submarkets. Venice is one of the most hip and trendy areas on the West Side and prices have increased dramatically over the last few years.'] },

  { title: '5051 W. Sunset Boulevard', meta: 'Los Angeles, CA 90027 · Owner/User & Development Site', status: 'closed', image: CLO + '5051-sunset.jpg', price: '$2,100,000', dealType: 'Land', representation: 'Buyer & Seller', headline: 'Owner/User & Development Acquisition', tagline: '14-day due diligence · 30-day close · 45% short-term seller carry.', specs: ['±300 SF Building', '±8,013 SF Lot', 'TOC Tier 3', 'Up to 36 Units', '±30,049 SF Buildable'], description: ['Alex Reyhan and Daniel Hirth of The Hirth Group are pleased to announce the successful closing of 5051 W. Sunset Boulevard, Los Angeles, CA 90027. The Hirth Group represented both the buyer and seller on this transaction, successfully negotiating a 14-day due diligence, 30-day close, with a 45% short-term seller carry. While the seller was motivated to move his equity into other projects, the buyer had multiple plans for the site, from an owner/user approach to a potential development in the near future.', '5051 W. Sunset Boulevard is a ±300 SF property on a ±8,013 SF lot, previously used and operated as an auto smog check. The tenant was paying roughly $8,000 per month on a month-to-month term. Due to cash flow and availability of vacating the property, there was a realm of developers that found the passive income beneficial due to the permitting process, and owner/users looking to occupy the space for their own business use. 5051 W. Sunset Boulevard is part of TOC Tier 3, allowing for potentially 36 units with an FAR of 3.75:1, totaling ±30,049 buildable SF.'] },

  { title: '3253–3263 E. Cesar E. Chavez Avenue', meta: 'Los Angeles, CA 90063 · Boyle Heights', status: 'closed', dealType: 'Development & Value-Add', price: '$1,768,000', image: CLO + '3253-cesar.jpg', representation: 'Buyer & Seller', headline: 'Development & Value-Add Acquisition', tagline: '14-day due diligence · 21-day close · 5-year seller carry · Closed within 95% of list price.', specs: ['±13,114 SF Two Parcels', '4 Residential + Storefront', 'C2-1 · TOC Tier 3', 'Up to 62 Units', '49,178 SF Buildable'], description: ['Alex Reyhan and Daniel Hirth of The Hirth Group are pleased to announce the successful closing of 3253–3261 E Cesar E Chavez Avenue. The Hirth Group represented both the buyer and seller on this transaction. In this rollercoaster of a market, Alex and Daniel were able to negotiate a 14-day due diligence period, 21-day close, along with a 5-year seller carry, while closing within 95% of the list price.', '3253–3263 E Cesar E Chavez Avenue is a unique investment opportunity with a vast amount of diverse value-add components. The subject property is two adjacent parcels totaling ±13,114 SF in the highly gentrifying submarket of Boyle Heights, on the main thoroughfare of E Cesar Chavez. 3253 E Cesar E Chavez Avenue comprises four (4) freestanding residential units with a commercial storefront, totaling approximately 6,919 SF of building. With rents way below market, an investor can add value by increasing rents up to 50% to reach market rate.', 'In addition, the subject property is zoned C2-1 and is part of TOC Tier 3, allowing a density bonus of up to 70% — allowing a developer the opportunity to build up to sixty-two (62) units, with seven (7) being designated to extremely low income, and an FAR increase to 3.75:1, totaling 49,178 SF of buildable. With alley access in the rear, this benefits the developer in many aspects of development and ingress/egress. The property is currently generating roughly $104,304 gross annually, allowing a developer to collect passive income while working on entitling the project.'] },

  { title: '1250 & 1270 East Park Street', meta: 'Hollister, CA 95023 · Verizon & Chipotle · New Construction 2020', status: 'closed', dealType: 'Shopping Center', price: '$5,250,000', image: CLO + '1250-park.jpg', representation: 'Buyer', headline: 'New Construction Built 2020', tagline: 'Secured off-market $127,000 below list price as a 1031 exchange upleg · The Hirth Group represented the buyer.', specs: ['Built 2020', 'Verizon & Chipotle', 'Corporate Guaranteed', '1031 Exchange'], description: ['Alex Reyhan and Daniel Hirth of The Hirth Group are pleased to announce another successful closing of 1250 & 1270 E Park Street. The Hirth Group represented the buyer, who was going through a 1031 exchange. We were able to negotiate and secure the multi-national tenant center $127,000 below list price as an upleg for our client while the property was not currently listed on the open market.', 'The subject property is located in Hollister, California and was recently constructed in 2020. The current tenants consist of Verizon and Chipotle: Verizon’s lease is secured with one of the strongest franchisees, with over 800 stores across 40 states, and Chipotle being corporate guaranteed. The parcel is part of a new shopping center being developed in Hollister, California.'] },

<script type="text/babel">
// The Hirth Group website kit — DiveHero: cinematic Earth → LA scroll descent.
// 2D compositor-only build: every animated element moves with transform/opacity
// alone (pre-tinted map images, zero runtime filters, no WebGL) so the dive runs
// at full frame rate on any machine. Real cartography throughout (CARTO/OSM).
// Static contexts (no rendering frames / reduced motion) skip the dive and render
// the normal LA-map hero — content is never hidden. The descent is one-way per
// session: once you land in LA, the hero pins and never flies back to space.
const { Button: DiveButton, Eyebrow: DiveEyebrow } = window.HirthGroupDesignSystem_c76dea;

const diveMercY = (lat) => { const r = lat * Math.PI / 180; return (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2; };
const DIVE_LA = { lat: 34.05, lon: -118.25 };
const diveFrac = (b) => {
  const yN = diveMercY(b.north), yS = diveMercY(b.south);
  return { x: (DIVE_LA.lon - b.west) / (b.east - b.west), y: (diveMercY(DIVE_LA.lat) - yN) / (yS - yN) };
};
const EF = diveFrac(window.MAP_BOUNDS.earth);

function DiveHero({ go }) {
  const wrapRef = React.useRef(null);

  React.useEffect(() => {
    const wrap = wrapRef.current;
    if (!wrap) return;
    let cleanup = null;

    const t = setTimeout(() => {
      const framesOk = document.documentElement.classList.contains('anim-ok');
      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      // DESKTOP: the earth fills the screen and LOCKS scroll — you descend through
      // it (Earth → LA) before the site scrolls. TOUCH/iPhone: the dive AUTO-PLAYS
      // and never locks (locking touch-scroll breaks inside the Wix frame).
      if (!framesOk || reduced) return; // static hero
      // SCROLL-LOCKED DESCENT on EVERY device (desktop + iPhone): the earth fills
      // the screen and the page is locked — you drive the Earth → LA descent with
      // wheel or swipe. The instant you land, the lock is FULLY released (every
      // listener removed, overflow + touch-action restored) so the rest of the
      // site scrolls freely from then on, with no blockers anywhere.

      const planet = wrap.querySelector('.dive-planet-wrap');
      const glint = wrap.querySelector('.dive-la-glint');
      const starsEl = wrap.querySelector('.dive-stars');
      const layers = { socal: wrap.querySelector('.dive-socal') };
      const intro = wrap.querySelector('.dive-intro');
      const label = wrap.querySelector('.dive-label');
      const hint = wrap.querySelector('.dive-hint');
      const finalEl = wrap.querySelector('.dive-final');
      const B = window.MAP_BOUNDS;

      wrap.classList.add('dive-on');

      // ---------- layout ----------
      let D = 0;
      const place = () => {
        const vw = window.innerWidth, vh = window.innerHeight;
        D = Math.round(Math.min(vw, vh) * 0.74);
        planet.style.width = D + 'px';
        planet.style.height = D + 'px';
        planet.style.left = (vw / 2 - D / 2) + 'px';
        planet.style.top = (vh / 2 - D / 2 + vh * 0.03) + 'px';
        planet.style.transformOrigin = (EF.x * 100) + '% ' + (EF.y * 100) + '%';
        const S = 1.28 * Math.max(vw, vh);
        [['socal', B.socal]].forEach(([k, b]) => {
          const f = diveFrac(b), el = layers[k];
          el.style.width = S + 'px'; el.style.height = S + 'px';
          el.style.left = (vw / 2 - f.x * S) + 'px';
          el.style.top = (vh / 2 - f.y * S) + 'px';
          el.style.transformOrigin = (f.x * 100) + '% ' + (f.y * 100) + '%';
        });
      };

      // ---------- scroll-driven timeline (all eased, all overlapping) ----------
      const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
      const ss = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
      const seg = (p, a, b) => ss((p - a) / (b - a));
      let target = 0, prog = 0;
      let done = false; // one-way ratchet per page load — every fresh load starts at Earth
      // Scroll-jack: while descending we LOCK the page and drive progress from wheel/
      // touch deltas — so no matter how fast the user flings, they cannot skip past the
      // dive to the footer. Progress is clamped 0→1; the page releases only on landing.
      const SENS = 1 / 2600;
      let touchY = null;
      let locked = true;
      document.body.style.overflow = 'hidden';
      document.documentElement.style.overflow = 'hidden';
      document.body.style.touchAction = 'none';
      window.scrollTo(0, 0);
      const onWheel = (e) => { if (done) return; e.preventDefault(); target = clamp(target + e.deltaY * SENS, 0, 1); };
      const onTouchStart = (e) => { touchY = e.touches[0].clientY; };
      const onTouchMove = (e) => {
        if (done) return; e.preventDefault();
        const y = e.touches[0].clientY;
        if (touchY != null) target = clamp(target + (touchY - y) * SENS * 2.4, 0, 1);
        touchY = y;
      };
      const onKey = (e) => {
        if (done) return;
        if (['ArrowDown', 'PageDown', ' ', 'Spacebar'].includes(e.key)) { e.preventDefault(); target = clamp(target + 0.14, 0, 1); }
        else if (['ArrowUp', 'PageUp'].includes(e.key)) { e.preventDefault(); target = clamp(target - 0.14, 0, 1); }
      };
      const releaseLock = () => {
        if (!locked) return;
        locked = false;
        document.body.style.overflow = '';
        document.documentElement.style.overflow = '';
        document.body.style.touchAction = '';
        window.removeEventListener('wheel', onWheel, { passive: false });
        window.removeEventListener('touchstart', onTouchStart);
        window.removeEventListener('touchmove', onTouchMove, { passive: false });
        window.removeEventListener('keydown', onKey);
      };
      const onScroll = () => { if (done) target = 1; };

      const setFlat = (el, p, inA, inB, outA, outB, sA, sB) => {
        const o = seg(p, inA, inB) * (1 - seg(p, outA, outB));
        if (o < 0.004) { if (el.style.visibility !== 'hidden') { el.style.visibility = 'hidden'; el.style.opacity = 0; } return; }
        el.style.visibility = 'visible';
        el.style.opacity = o;
        // modest per-layer scale — kept low so the raster map never magnifies
        // past its native resolution and stays sharp through the descent
        el.style.transform = 'translateZ(0) scale(' + Math.pow(1.7, seg(p, sA, sB)).toFixed(4) + ')';
      };

      let smoothTarget = 0;
      let diveStart = 0;
      const AUTO_MS = 4200; // earth descends Earth → LA by itself over ~4.2s

        // locked the whole time (earth is all you see) until it lands, then the
        // lock releases and the site scrolls freely. Same on every device.
        if (!done) target = clamp((now - diveStart) / AUTO_MS, 0, 1);

        const k = 1 - Math.exp(-dt * 4.2); // gentle glide, ~230ms time-constant

  const polar = (cx, cy, r, deg) => { const a = (deg - 90) * Math.PI / 180; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; };

  const ticks = Array.from({ length: 60 }, (_, i) => { const deg = i * 6; const [x1, y1] = polar(100, 100, 82, deg); const [x2, y2] = polar(100, 100, i % 5 === 0 ? 72 : 77, deg); return <line key={i} x1={x1} y1={y1} x2={x2} y2={y2} stroke={BLUE} strokeWidth={i % 5 === 0 ? 1.4 : 0.7} opacity={i % 5 === 0 ? 0.85 : 0.4} />; });

          <radialGradient id="hgcore" cx="50%" cy="42%" r="60%">

    // Jarvis-style spoken greeting — composed, low, British-butler cadence
    try {
      const synth = window.speechSynthesis;
      if (synth) {
        synth.cancel();
        const speak = () => {
          const u = new SpeechSynthesisUtterance('Thank you, ' + first + '. Your message has been received. The Hirth Group will be in touch shortly.');
          const vs = synth.getVoices();
          // prefer refined British male voices first (closest to Jarvis)
          const prefer = ['Daniel', 'Arthur', 'Oliver', 'Google UK English Male', 'Microsoft Ryan', 'Microsoft George', 'Microsoft Guy', 'Alex'];
          u.voice = vs.find(v => prefer.some(p => v.name.includes(p)) && /en/i.test(v.lang))
                 || vs.find(v => /en-GB/i.test(v.lang) && /male/i.test(v.name))
                 || vs.find(v => /en-GB/i.test(v.lang))
                 || vs.find(v => /male/i.test(v.name))
                 || vs.find(v => /^en/i.test(v.lang)) || null;
          u.rate = 0.86; u.pitch = 0.72; u.volume = 1;
          u.onstart = () => setSpeaking(true);
          u.onend = () => setSpeaking(false);
          u.onerror = () => setSpeaking(false);
          synth.speak(u);
        };
        if (synth.getVoices().length) speak(); else synth.addEventListener('voiceschanged', speak, { once: true });

function TestimonialCarousel() {
  const items = window.TESTIMONIALS || [];
  const [i, setI] = React.useState(0);
  const n = items.length;
  const go = (next) => setI((p) => (p + next + n) % n);
  const touch = React.useRef(null);
  const onStart = (e) => { touch.current = e.touches[0].clientX; };
  const onEnd = (e) => {
    if (touch.current == null) return;
    const dx = e.changedTouches[0].clientX - touch.current;
    if (Math.abs(dx) > 50) go(dx < 0 ? 1 : -1);
    touch.current = null;
  };
  React.useEffect(() => {
    const onKey = (e) => { if (e.key === 'ArrowLeft') go(-1); if (e.key === 'ArrowRight') go(1); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  });
  const arrow = {
    background: 'none', border: 0, cursor: 'pointer', color: 'var(--text-inverse-secondary)',
    fontSize: '32px', lineHeight: 1, padding: '12px', transition: 'color 150ms var(--ease-out)',
    flexShrink: 0,
  };
  const t = items[i] || { quote: '', attribution: '' };
  return (
    <div style={{ width: '100%', maxWidth: 'var(--container-max)', margin: '0 auto' }}>
      <div
        onTouchStart={onStart}
        onTouchEnd={onEnd}
        style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '24px' }}
      >
        <button style={arrow} aria-label="Previous" onClick={() => go(-1)}
          onMouseEnter={(e) => (e.currentTarget.style.color = 'var(--blue-400)')}
          onMouseLeave={(e) => (e.currentTarget.style.color = 'var(--text-inverse-secondary)')}
        >&larr;</button>
        <div style={{ flex: 1, minHeight: '340px', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          <PgQuote key={i} inverse={false} quote={t.quote} attribution={t.attribution} />
        </div>
        <button style={arrow} aria-label="Next" onClick={() => go(1)}
          onMouseEnter={(e) => (e.currentTarget.style.color = 'var(--blue-400)')}
          onMouseLeave={(e) => (e.currentTarget.style.color = 'var(--text-inverse-secondary)')}
        >&rarr;</button>
      </div>
      <div style={{ display: 'flex', justifyContent: 'center', gap: '14px', marginTop: '36px' }}>
        {items.map((_, d) => (
          <button key={d} aria-label={'Testimonial ' + (d + 1)} onClick={() => setI(d)}
            style={{
              width: '9px', height: '9px', borderRadius: '50%', padding: 0, cursor: 'pointer',
              border: d === i ? '1.5px solid var(--text-primary)' : 0,
              background: d === i ? 'transparent' : 'var(--border-subtle)',
              transition: 'all 150ms var(--ease-out)',
            }}
          ></button>
        ))}
      </div>
    </div>
  );
}
