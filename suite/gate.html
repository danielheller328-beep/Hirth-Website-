<!-- ══════════════════════════════════════════════════════════════════════════
     The sign-in, shared by the suite and the post maker.

     Be clear about what this is. Both pages are static files on a public host,
     so the check runs in the browser and nothing more: it keeps the tools off
     the desk of anyone who wanders past the URL, and it will not stop somebody
     who opens the page source. It is a door, not a vault. Nothing behind it is
     client data — it is marketing artwork and captions.

     The passcode is stored as a SHA-256 digest rather than as itself, so at
     least it is not sitting in plain sight in the file. To change it, hash the
     new one and replace PASS below:

         printf 'newcode' | shasum -a 256

     Signing in at either page carries to the other — same key, same origin.
     ══════════════════════════════════════════════════════════════════════ */ -->
<style>
#gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
  padding:24px;background:#0B0F14;
  background-image:radial-gradient(1100px 620px at 70% -14%,rgba(59,124,178,.22),transparent 62%),
                   radial-gradient(900px 520px at 6% 112%,rgba(198,164,97,.10),transparent 62%)}
#gate[hidden]{display:none}
.gatebox{width:100%;max-width:376px;text-align:center;
  font-family:'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;color:#ECF1F5}
.gatebox .gmark{width:132px;height:auto;display:block;margin:0 auto 22px}
.gatebox h2{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:23px;margin:0 0 6px;
  letter-spacing:.004em}
.gatebox p.gsub{margin:0 0 26px;color:#8A98A4;font-size:13.5px;line-height:1.6}
.gaterow{display:flex;gap:9px}
#gatecode{flex:1;min-width:0;background:rgba(255,255,255,.045);border:1px solid #2A3742;
  border-radius:999px;padding:12px 18px;color:#ECF1F5;font:500 15px inherit;letter-spacing:.06em;
  outline:none;transition:border-color .15s ease}
#gatecode::placeholder{color:#5F6C77;letter-spacing:.02em}
#gatecode:focus{border-color:#6FB6E8}
#gatego{flex:none;background:#6FB6E8;color:#08121B;border:none;border-radius:999px;
  padding:12px 22px;font:700 13px inherit;letter-spacing:.04em;cursor:pointer;
  transition:filter .14s ease,transform .14s ease}
#gatego:hover{filter:brightness(1.07)}
#gatego:active{transform:scale(.97)}
#gateerr{margin:14px 0 0;min-height:18px;color:#E8836B;font-size:12.5px;letter-spacing:.01em}
.gatebox .gfoot{margin-top:30px;color:#5F6C77;font-size:11px;letter-spacing:.10em;text-transform:uppercase}
@keyframes gshake{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(4px)}
  50%{transform:translateX(-4px)}}
.gateshake{animation:gshake .4s}
@media (prefers-reduced-motion:reduce){.gateshake{animation:none}}
/* the page stays hidden until the gate says otherwise, so a broken script
   fails closed rather than open */
body.locked > *:not(#gate){display:none!important}
</style>

<div id="gate">
  <div class="gatebox">
    <img class="gmark" src="/assets/logo-hirth-white.png" alt="The Hirth Group">
    <h2>Operations Suite</h2>
    <p class="gsub">Enter the passcode to continue.</p>
    <div class="gaterow">
      <input id="gatecode" type="password" inputmode="text" autocomplete="current-password"
             placeholder="Passcode" aria-label="Passcode" spellcheck="false">
      <button id="gatego" type="button">Enter</button>
    </div>
    <p id="gateerr" role="alert"></p>
    <div class="gfoot">The Hirth Group</div>
  </div>
</div>

<script>
(function () {
  var PASS = '7956313a6285b3b55ef43c4413cfc34c0bb7d0e7da9be20fc58a116165f8d5ef';
  var KEY = 'hg.suite.v1';
  var gate = document.getElementById('gate');
  var input = document.getElementById('gatecode');
  var err = document.getElementById('gateerr');
  document.body.classList.add('locked');

  function open_() {
    document.body.classList.remove('locked');
    gate.hidden = true;
    document.dispatchEvent(new Event('hg:unlocked'));
  }
  function sha256(s) {
    if (!(window.crypto && crypto.subtle)) return Promise.resolve(null);
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)).then(function (buf) {
      return Array.prototype.map.call(new Uint8Array(buf), function (b) {
        return b.toString(16).padStart(2, '0');
      }).join('');
    });
  }
  /* registered before the early return below — when you are already signed in
     the rest of this function never runs, and signing out has to keep working */
  document.addEventListener('click', function (e) {
    var t = e.target.closest && e.target.closest('[data-signout]');
    if (!t) return;
    e.preventDefault();
    try { localStorage.removeItem(KEY); } catch (er) { }
    location.reload();
  });

  try { if (localStorage.getItem(KEY) === PASS) { open_(); return; } } catch (e) { }

  function tryIt() {
    var v = (input.value || '').trim().toLowerCase();
    if (!v) { input.focus(); return; }
    sha256(v).then(function (h) {
      if (h === PASS) {
        try { localStorage.setItem(KEY, PASS); } catch (e) { }
        open_();
      } else {
        err.textContent = h === null
          ? 'This browser cannot check the passcode.'
          : 'That passcode is not right.';
        input.value = '';
        input.focus();
        gate.querySelector('.gatebox').classList.remove('gateshake');
        void gate.offsetWidth;
        gate.querySelector('.gatebox').classList.add('gateshake');
      }
    });
  }
  document.getElementById('gatego').onclick = tryIt;
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') tryIt(); });
  input.addEventListener('input', function () { err.textContent = ''; });
  setTimeout(function () { input.focus(); }, 60);
})();
</script>
